name: Build and publish Quarto materials

# Das bestehende Veröffentlichungsziel bleibt der Branch `gh-pages`.
# Pull Requests prüfen alle Ausgabeformate und stellen sie als Artefakt bereit.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # TEMPORARY: read-only probe of TeX Live package containers to record their
      # revisions and SHA-256 digests. Removed again by the commit that pins them.
      - name: Probe TeX Live package containers (temporary)
        run: |
          probe() {
            local base="$1" pkg file rev
            echo "===== $base"
            for pkg in ctablestack luatexbase babel-german hyphen-german selnolig; do
              file="$(mktemp)"
              if curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 "$base/$pkg.tar.xz" -o "$file"; then
                rev="$(tar -xJOf "$file" "tlpkg/tlpobj/$pkg.tlpobj" | sed -n 's/^revision //p')"
                echo "$pkg unversioned sha256=$(sha256sum "$file" | cut -d' ' -f1) bytes=$(stat -c %s "$file") revision=$rev"
                if curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 "$base/$pkg.r$rev.tar.xz" -o "$file.versioned"; then
                  echo "$pkg.r$rev versioned sha256=$(sha256sum "$file.versioned" | cut -d' ' -f1)"
                else
                  echo "$pkg.r$rev versioned name: download failed"
                fi
                tar -xJOf "$file" "tlpkg/tlpobj/$pkg.tlpobj" | grep -v -E '^(longdesc|shortdesc)'
              else
                echo "$pkg: download failed"
              fi
            done
          }
          probe https://ftp.tu-chemnitz.de/pub/tug/historic/systems/texlive/2025/tlnet-final/archive
          probe https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2025/tlnet-final/archive
          probe https://texlive.info/tlnet-archive/2026/10/21/tlnet/archive
          probe https://mirror.ctan.org/systems/texlive/tlnet/archive
          echo 'Probe finished; stopping this temporary run before the build.'
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python for the programming example
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test build scripts
        run: python3 -m unittest discover -s tests -v

      - name: Install system dependencies
        run: bash scripts/setup.sh --system-deps

      - name: Set up pinned toolchain
        run: bash scripts/setup.sh

      - name: Build website, PDFs and verified starter packages
        run: |
          source scripts/activate.sh
          python3 scripts/build-materials.py all

      - name: Upload validated materials
        uses: actions/upload-artifact@v4
        with:
          name: course-materials
          path: _site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated materials
        uses: actions/download-artifact@v4
        with:
          name: course-materials
          path: _site/

      # Für das Veröffentlichen der fertigen Dateien genügen Quarto und Git.
      - name: Set up pinned Quarto
        run: |
          bash scripts/setup.sh --quarto-only
          source scripts/activate.sh
          dirname "$(command -v quarto)" >> "$GITHUB_PATH"

      # Quarto publish verlangt einen bestehenden Remote-Branch `gh-pages`.
      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages:gh-pages

      - name: Publish validated materials to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
