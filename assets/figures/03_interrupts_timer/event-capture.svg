<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img">
<title>Drei Ereignisse ergeben in einem Bereitschaftsbit nur einen gespeicherten Hinweis.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="350" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="30" font-size="25" text-anchor="start" fill="#1D1D1F">Ereignisse, gespeicherter Zustand und spätere Beobachtung</text>
<text x="20" y="105" font-size="24" text-anchor="start" fill="#1D1D1F">Impulse</text>
<text x="20" y="195" font-size="24" text-anchor="start" fill="#1D1D1F">Bereitschaft</text>
<path d="M200,110 H300 V65 H330 V110 H480 V65 H510 V110 H600 V65 H630 V110 H950" fill="none" stroke="#E2001A" stroke-width="3"/>
<path d="M200,205 H300 V160 H950" fill="none" stroke="#1D1D1F" stroke-width="3"/>
<text x="240" y="195" font-size="22" text-anchor="middle" fill="#1D1D1F">0</text>
<text x="400" y="150" font-size="22" text-anchor="middle" fill="#1D1D1F">1</text>
<path d="M850,50 V225" stroke="#86868B" stroke-width="2" stroke-dasharray="5 5"/>
<text x="850" y="280" font-size="24" text-anchor="middle" fill="#1D1D1F">Status lesen: 1</text>
<path d="M200,240 H950 V240" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="950" y="225" font-size="23" text-anchor="end" fill="#1D1D1F">Zeit</text>
<text x="20" y="325" font-size="24" text-anchor="start" fill="#1D1D1F">Das Bit erhält einen Hinweis; die Zahl der Impulse bleibt unbekannt.</text>
</svg>
