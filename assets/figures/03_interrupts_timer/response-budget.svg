<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img">
<title>Datensicherung nach 53 Mikrosekunden und fertige Auswertung nach 163 Mikrosekunden.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="365" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="30" font-size="25" text-anchor="start" fill="#1D1D1F">Zwei Endpunkte derselben Ereignisbehandlung</text>
<rect x="100" y="85" width="200" height="60" fill="#F5F5F7" stroke="#86868B"/>
<text x="200.0" y="123" font-size="22" text-anchor="middle" fill="#1D1D1F">1</text>
<rect x="300" y="85" width="25" height="60" fill="#E5E5EA" stroke="#86868B"/>
<text x="312.5" y="123" font-size="22" text-anchor="middle" fill="#1D1D1F">2</text>
<rect x="325" y="85" width="40" height="60" fill="#F5F5F7" stroke="#86868B"/>
<text x="345.0" y="123" font-size="22" text-anchor="middle" fill="#1D1D1F">3</text>
<rect x="365" y="85" width="400" height="60" fill="#F5F5F7" stroke="#86868B"/>
<text x="565.0" y="123" font-size="22" text-anchor="middle" fill="#1D1D1F">4</text>
<rect x="765" y="85" width="150" height="60" fill="#E5E5EA" stroke="#86868B"/>
<text x="840.0" y="123" font-size="22" text-anchor="middle" fill="#1D1D1F">5</text>
<path d="M100,175 H945 V175" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M100,170 H100 V180" fill="none" stroke="#86868B" stroke-width="2"/>
<text x="100" y="208" font-size="22" text-anchor="middle" fill="#1D1D1F">0</text>
<path d="M300,170 H300 V180" fill="none" stroke="#86868B" stroke-width="2"/>
<text x="300" y="208" font-size="22" text-anchor="middle" fill="#1D1D1F">40</text>
<path d="M365,170 H365 V180" fill="none" stroke="#86868B" stroke-width="2"/>
<text x="365" y="208" font-size="22" text-anchor="middle" fill="#1D1D1F">53</text>
<path d="M765,170 H765 V180" fill="none" stroke="#86868B" stroke-width="2"/>
<text x="765" y="208" font-size="22" text-anchor="middle" fill="#1D1D1F">133</text>
<path d="M915,170 H915 V180" fill="none" stroke="#86868B" stroke-width="2"/>
<text x="915" y="208" font-size="22" text-anchor="middle" fill="#1D1D1F">163</text>
<path d="M365,72 H365 V155" fill="none" stroke="#E2001A" stroke-width="2"/>
<text x="365" y="65" font-size="23" text-anchor="start" fill="#E2001A">Daten gesichert</text>
<path d="M915,72 H915 V155" fill="none" stroke="#E2001A" stroke-width="2"/>
<text x="915" y="65" font-size="23" text-anchor="end" fill="#E2001A">Ergebnis fertig</text>
<text x="100" y="245" font-size="23" text-anchor="start" fill="#1D1D1F">Zeit ab Ereignis [µs]</text>
<text x="20" y="295" font-size="23" text-anchor="start" fill="#1D1D1F">1  Blockierung: 40 µs</text>
<text x="365" y="295" font-size="23" text-anchor="start" fill="#1D1D1F">2  Eintritt: 5 µs</text>
<text x="670" y="295" font-size="23" text-anchor="start" fill="#1D1D1F">3  Sicherung: 8 µs</text>
<text x="20" y="335" font-size="23" text-anchor="start" fill="#1D1D1F">4  Warten auf Hauptprogramm: 80 µs</text>
<text x="600" y="335" font-size="23" text-anchor="start" fill="#1D1D1F">5  Auswertung: 30 µs</text>
</svg>
