<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285" role="img">
<title>Claim, getrennte Gerätebearbeitung und Complete in Reihenfolge.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="285" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="30" font-size="25" text-anchor="start" fill="#1D1D1F">Normaler Lebenszyklus einer bekannten Gerätequelle</text>
<rect x="20" y="65" width="160" height="95" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="100.0" y="116" font-size="22" text-anchor="middle" fill="#1D1D1F">Gerät aktiv</text>
<rect x="215" y="65" width="155" height="95" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="292.5" y="116" font-size="22" text-anchor="middle" fill="#1D1D1F">Pending</text>
<rect x="405" y="65" width="155" height="95" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="482.5" y="116" font-size="22" text-anchor="middle" fill="#1D1D1F">Claim ID</text>
<rect x="595" y="65" width="180" height="95" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="685.0" y="116" font-size="22" text-anchor="middle" fill="#1D1D1F">Gerät bedienen</text>
<rect x="810" y="65" width="170" height="95" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="895.0" y="116" font-size="22" text-anchor="middle" fill="#1D1D1F">Complete ID</text>
<path d="M180,110 H215 V110" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M370,110 H405 V110" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,110 H595 V110" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M775,110 H810 V110" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="410" y="210" font-size="22" text-anchor="start" fill="#1D1D1F">PLIC-Pending gelöscht</text>
<text x="20" y="255" font-size="25" text-anchor="start" fill="#1D1D1F">Geräteursache bearbeiten, danach dieselbe ID abschließen.</text>
</svg>
