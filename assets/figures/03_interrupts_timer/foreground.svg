<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="255" viewBox="0 0 1000 255" role="img">
<title>Sofortige kurze Behandlung und spätere Hauptprogramm-Nutzarbeit.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="255" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="30" font-size="25" text-anchor="start" fill="#1D1D1F">Ein Hart: ISR und Hauptprogramm laufen nacheinander.</text>
<rect x="20" y="80" width="240" height="80" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="140" y="128" font-size="26" text-anchor="middle" fill="#1D1D1F">Main vorher</text>
<rect x="330" y="80" width="200" height="80" rx="10" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="430" y="128" font-size="26" text-anchor="middle" fill="#1D1D1F">kurze ISR</text>
<rect x="650" y="80" width="330" height="80" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="815" y="114" font-size="25" text-anchor="middle" fill="#1D1D1F">Main später:</text>
<text x="815" y="148" font-size="25" text-anchor="middle" fill="#1D1D1F">Nutzarbeit</text>
<path d="M260,120 H330 V120" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M530,120 H650 V120" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M275,50 H275 V180" fill="none" stroke="#E2001A" stroke-width="2"/>
<text x="275" y="220" font-size="23" text-anchor="middle" fill="#E2001A">Ereignis</text>
<text x="590" y="220" font-size="23" text-anchor="middle" fill="#1D1D1F">zusätzliche Wartezeit</text>
</svg>
