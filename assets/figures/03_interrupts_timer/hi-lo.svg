<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="295" viewBox="0 0 1000 295" role="img">
<title>Überlauf zwischen Zugriffen und Erkennung durch einen zweiten HI-Wert.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="295" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="30" font-size="25" text-anchor="start" fill="#1D1D1F">Zählerübergang:</text>
<text x="250" y="30" font-size="24" text-anchor="start" fill="#1D1D1F">0x00000001_FFFFFFFF → 0x00000002_00000000</text>
<rect x="20" y="70" width="250" height="100" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="145" y="110" font-size="26" text-anchor="middle" fill="#1D1D1F">HI vorher</text>
<text x="145" y="151" font-size="28" text-anchor="middle" fill="#1D1D1F">1</text>
<rect x="375" y="70" width="250" height="100" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="500" y="110" font-size="26" text-anchor="middle" fill="#1D1D1F">LO danach</text>
<text x="500" y="151" font-size="28" text-anchor="middle" fill="#1D1D1F">0</text>
<rect x="730" y="70" width="250" height="100" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="855" y="110" font-size="26" text-anchor="middle" fill="#1D1D1F">HI nochmals</text>
<text x="855" y="151" font-size="28" text-anchor="middle" fill="#1D1D1F">2</text>
<path d="M270,120 H375 V120" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M625,120 H730 V120" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="225" font-size="25" text-anchor="start" fill="#E2001A">HI 1 + LO 0 wäre falsch: 0x00000001_00000000</text>
<text x="20" y="270" font-size="25" text-anchor="start" fill="#1D1D1F">HI vorher ≠ HI nochmals → Leseversuch wiederholen</text>
</svg>
