<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250">
<rect width="1100" height="250" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">RV32, zwei 32-Bit-Haelften. Kein einzelner atomarer 64-Bit-Load.</text>
<text x="16" y="56" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Vorher 0x00000001_FFFFFFFF, nachher 0x00000002_00000000</text>
<text x="16" y="90" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">HI=1 vor dem Uebergang und LO=0 danach ergibt faelschlich 0x00000001_00000000</text>
<text x="16" y="130" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">Lesen: HI, LO, HI noch einmal. Nur gleiche HI-Werte akzeptieren.</text>
<text x="16" y="170" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">Compare schreiben, Little Endian: LO=0xFFFFFFFF, dann HI, dann neues LO.</text>
<text x="16" y="210" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">32-Bit-Ticks bei 1 MHz: ca. 71,6 min. 32-Bit-Millisekunden: ca. 49,7 Tage.</text>
</svg>
