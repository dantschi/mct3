<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" role="img">
<title>Relativer Termin verschiebt die Phase, absolutes Raster erhält sie.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="345" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="30" font-size="25" text-anchor="start" fill="#1D1D1F">Solltermin 10,0 ms · tatsächlicher Eintritt 10,2 ms</text>
<text x="20" y="115" font-size="25" text-anchor="start" fill="#1D1D1F">Relativ</text>
<rect x="425" y="80" width="250" height="55" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="550" y="116" font-size="24" text-anchor="middle" fill="#1D1D1F">1 ms ab Eintritt</text>
<text x="675" y="165" font-size="25" text-anchor="middle" fill="#E2001A">11,2 ms</text>
<text x="20" y="230" font-size="25" text-anchor="start" fill="#1D1D1F">Sollraster</text>
<rect x="375" y="195" width="250" height="55" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="500" y="231" font-size="24" text-anchor="middle" fill="#1D1D1F">1 ms ab Sollwert</text>
<text x="625" y="280" font-size="25" text-anchor="middle" fill="#1D1D1F">11,0 ms</text>
<path d="M425,45 H425 V65" fill="none" stroke="#E2001A" stroke-width="2"/>
<text x="375" y="320" font-size="23" text-anchor="middle" fill="#1D1D1F">10,0</text>
<text x="875" y="320" font-size="23" text-anchor="middle" fill="#1D1D1F">12,0 ms</text>
<path d="M375,295 H875 V295" fill="none" stroke="#86868B" stroke-width="2"/>
</svg>
