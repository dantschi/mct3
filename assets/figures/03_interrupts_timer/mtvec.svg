<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="1100" height="280">
<rect width="1100" height="280" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">BASE 0x80000100. Direct-Wert 0x80000100, Vectored-Wert 0x80000101.</text>
<rect x="16" y="36" width="700" height="36" rx="6" fill="#F3E5F5" stroke="#6A1B9A"/>
<text x="28" y="60" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">Bits 31:2 BASE    Bits 1:0 MODE</text>
<text x="16" y="100" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">MSI Cause 3: 0x8000010C</text>
<text x="16" y="128" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">MTI Cause 7: 0x8000011C</text>
<text x="16" y="156" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">MEI Cause 11: 0x8000012C</text>
<text x="16" y="190" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Synchrone Exceptions bleiben bei BASE, auch im Vectored Mode.</text>
<text x="16" y="220" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Slots 0..11 je 4 Byte. Abstand ist fest, nicht die aktuelle Befehlslaenge.</text>
<text x="16" y="250" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">jal x0, Ziel. Mit RVC den Bereich .option norvc schuetzen.</text>
</svg>
