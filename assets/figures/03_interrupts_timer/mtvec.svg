<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="1100" height="280">
<rect width="1100" height="280" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">BASE 0x80000100. Vectored-Registerwert 0x80000101.</text>
<rect x="16" y="40" width="80" height="44" rx="6" fill="#E8F5E9" stroke="#1D1D1F"/>
<text x="24" y="68" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">0 Exc</text>
<rect x="104" y="40" width="80" height="44" rx="6" fill="#F5F5F7" stroke="#1D1D1F"/>
<text x="112" y="68" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">1 d</text>
<rect x="192" y="40" width="80" height="44" rx="6" fill="#F5F5F7" stroke="#1D1D1F"/>
<text x="200" y="68" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">2 d</text>
<rect x="280" y="40" width="80" height="44" rx="6" fill="#E8F5E9" stroke="#1D1D1F"/>
<text x="288" y="68" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">3 MSI</text>
<rect x="368" y="40" width="80" height="44" rx="6" fill="#F5F5F7" stroke="#1D1D1F"/>
<text x="376" y="68" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">4 d</text>
<rect x="456" y="40" width="80" height="44" rx="6" fill="#F5F5F7" stroke="#1D1D1F"/>
<text x="464" y="68" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">5 d</text>
<rect x="544" y="40" width="80" height="44" rx="6" fill="#F5F5F7" stroke="#1D1D1F"/>
<text x="552" y="68" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">6 d</text>
<rect x="632" y="40" width="80" height="44" rx="6" fill="#E8F5E9" stroke="#1D1D1F"/>
<text x="640" y="68" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">7 MTI</text>
<rect x="720" y="40" width="80" height="44" rx="6" fill="#F5F5F7" stroke="#1D1D1F"/>
<text x="728" y="68" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">8 d</text>
<rect x="808" y="40" width="80" height="44" rx="6" fill="#F5F5F7" stroke="#1D1D1F"/>
<text x="816" y="68" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">9 d</text>
<rect x="896" y="40" width="80" height="44" rx="6" fill="#F5F5F7" stroke="#1D1D1F"/>
<text x="904" y="68" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">10 d</text>
<rect x="984" y="40" width="80" height="44" rx="6" fill="#E8F5E9" stroke="#1D1D1F"/>
<text x="992" y="68" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">11 MEI</text>
<text x="16" y="120" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Cause 3 -> +12 = 0x8000010C</text>
<text x="16" y="150" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Cause 7 -> +28 = 0x8000011C</text>
<text x="16" y="180" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Cause 11 -> +44 = 0x8000012C</text>
<text x="16" y="220" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Abstand 4 Byte bleibt auch bei komprimierten Befehlen fest.</text>
<text x="16" y="252" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Exceptionen gehen an BASE, nicht in einen Cause-Slot.</text>
</svg>
