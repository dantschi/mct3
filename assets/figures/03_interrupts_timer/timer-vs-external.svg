<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img">
<title>Timerkategorie und externe Sammelkategorie sind von der Geräte-ID aus Claim getrennt.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="390" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<rect x="20" y="35" width="350" height="80" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="195" y="68" font-size="26" text-anchor="middle" fill="#1D1D1F">Timer</text>
<text x="195" y="99" font-size="24" text-anchor="middle" fill="#1D1D1F">mtime / mtimecmp</text>
<rect x="20" y="180" width="350" height="90" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="195" y="215" font-size="23" text-anchor="middle" fill="#1D1D1F">UART 1 · Sensor 2 · Taster 3</text>
<text x="195" y="250" font-size="23" text-anchor="middle" fill="#1D1D1F">externe Geräte-IDs</text>
<rect x="450" y="180" width="160" height="90" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="530" y="235" font-size="28" text-anchor="middle" fill="#1D1D1F">PLIC</text>
<rect x="780" y="35" width="200" height="235" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="880" y="77" font-size="29" text-anchor="middle" fill="#1D1D1F">Hart</text>
<text x="880" y="123" font-size="23" text-anchor="middle" fill="#1D1D1F">Kategorie 7</text>
<text x="880" y="234" font-size="23" text-anchor="middle" fill="#1D1D1F">Kategorie 11</text>
<path d="M370,75 H690 V110 H780" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M370,225 H450 V225" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M610,225 H780 V225" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="560" y="52" font-size="23" text-anchor="middle" fill="#1D1D1F">Timer-Anforderung</text>
<text x="690" y="205" font-size="22" text-anchor="middle" fill="#1D1D1F">extern</text>
<path d="M880,270 V325 H530 V270" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="350" font-size="23" text-anchor="start" fill="#1D1D1F">Software fragt zusätzlich:</text>
<text x="705" y="365" font-size="24" text-anchor="middle" fill="#E2001A">Claim → konkrete Geräte-ID</text>
</svg>
