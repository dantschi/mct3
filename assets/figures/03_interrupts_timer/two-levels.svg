<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300">
<rect width="1100" height="300" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Lehr-Modell, ein Hart. Cause-Code und PLIC-ID sind verschiedene Zahlen.</text>
<rect x="16" y="40" width="320" height="110" rx="6" fill="#FFF3E0" stroke="#E65100"/>
<text x="28" y="68" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Lokal: mtime, mtimecmp, msip</text>
<text x="28" y="96" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">MSI Cause 3, MTI Cause 7</text>
<text x="28" y="124" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">CSRs im Hart: mip, mie, MIE</text>
<rect x="360" y="40" width="360" height="110" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="372" y="68" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">UART ID1, I2C ID2, GPIO ID3</text>
<text x="372" y="96" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">alle nach MEI, Cause 11</text>
<text x="372" y="124" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Claim liefert die Geraete-ID</text>
<rect x="750" y="40" width="320" height="110" rx="6" fill="#fff" stroke="#6A1B9A"/>
<text x="762" y="78" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">ID 7 ist nicht Cause 7</text>
<text x="762" y="110" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Timer bleibt Cause 7</text>
<text x="16" y="190" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Prioritaet der Kategorien im klassischen M-Mode: MEI vor MSI vor MTI.</text>
<text x="16" y="220" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Der Timer ist nicht automatisch der hoechstpriore VIP.</text>
<text x="16" y="250" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">O(1) waehlt nur die Kategorie. Die ISR-Laufzeit bleibt workloadabhaengig.</text>
<text x="16" y="280" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Lokal heisst dem Hart zugeordnet, nicht automatisch kuerzere Leitung.</text>
</svg>
