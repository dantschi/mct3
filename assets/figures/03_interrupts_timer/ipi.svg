<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 200" width="1100" height="200">
<rect width="1100" height="200" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Zwei Harts. msip ist ein Pending-Bit, keine Nachrichtenwarteschlange.</text>
<rect x="16" y="50" width="220" height="60" rx="6" fill="#fff" stroke="#E65100"/>
<text x="28" y="86" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">Hart A schreibt</text>
<rect x="280" y="50" width="260" height="60" rx="6" fill="#fff" stroke="#6A1B9A"/>
<text x="292" y="86" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">msip von Hart B = 1</text>
<rect x="580" y="50" width="480" height="60" rx="6" fill="#fff" stroke="#1B5E20"/>
<text x="592" y="86" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">Hart B: MSI Cause 3, dann msip=0</text>
<text x="16" y="150" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Die Nutzdaten liegen in einer eigenen Shared-Memory-Struktur mit passender Ordnung.</text>
<text x="16" y="182" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">MSI ist nicht automatisch niedriger als der Timer. Kategorien: MEI, MSI, MTI.</text>
</svg>
