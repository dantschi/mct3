<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320">
<rect width="1100" height="320" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Modell. Ereignis bei 1,2 ms. Wartezeit bis dahin 0,8 ms.</text>
<rect x="16" y="40" width="160" height="52" rx="6" fill="#FFEBEE" stroke="#1D1D1F"/>
<text x="28" y="72" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Busy-Wait</text>
<rect x="200" y="40" width="860" height="52" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="220" y="72" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">CPU belegt bis 1,2 ms</text>
<rect x="16" y="110" width="160" height="52" rx="6" fill="#FFF3E0" stroke="#1D1D1F"/>
<text x="28" y="142" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Periodisch</text>
<rect x="200" y="110" width="860" height="52" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="220" y="142" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Fragen 0 / 1 / 2 ms</text>
<rect x="16" y="180" width="160" height="52" rx="6" fill="#E8F5E9" stroke="#1D1D1F"/>
<text x="28" y="212" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Interrupt</text>
<rect x="200" y="180" width="860" height="52" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="220" y="212" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Latenz, ISR, weiter Main</text>
<text x="200" y="268" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Markierung Ereignis</text>
<line x1="520" y1="40" x2="520" y2="232" stroke="#B71C1C" stroke-width="2"/>
<text x="16" y="300" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">0,8 ms ist die angenommene Zeit bis zum Ereignis, nicht die Interruptlatenz.</text>
</svg>
