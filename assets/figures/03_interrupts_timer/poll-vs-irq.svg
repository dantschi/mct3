<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="315" viewBox="0 0 1000 315" role="img">
<title>Alternative Abläufe auf derselben Millisekundenachse.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="315" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="30" font-size="24" text-anchor="start" fill="#1D1D1F">Modell: Ereignis 1,2 ms · ISR-Eintritt 1,3 ms · Ende 1,5 ms</text>
<text x="20" y="90" font-size="23" text-anchor="start" fill="#1D1D1F">Busy-Wait</text>
<rect x="200" y="60" width="450" height="45" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="425" y="90" font-size="23" text-anchor="middle" fill="#1D1D1F">wiederholt prüfen</text>
<text x="20" y="165" font-size="23" text-anchor="start" fill="#1D1D1F">Periodisch</text>
<path d="M200,155 H950 V155" fill="none" stroke="#86868B" stroke-width="2"/>
<circle cx="200" cy="155" r="6" fill="#1D1D1F"/>
<circle cx="575" cy="155" r="6" fill="#1D1D1F"/>
<circle cx="950" cy="155" r="6" fill="#1D1D1F"/>
<text x="20" y="240" font-size="23" text-anchor="start" fill="#1D1D1F">Interrupt</text>
<rect x="200" y="210" width="450" height="45" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="425" y="240" font-size="23" text-anchor="middle" fill="#1D1D1F">Hauptprogramm</text>
<rect x="687.5" y="210" width="75" height="45" rx="10" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="725" y="240" font-size="22" text-anchor="middle" fill="#1D1D1F">ISR</text>
<rect x="762.5" y="210" width="187.5" height="45" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="855" y="240" font-size="23" text-anchor="middle" fill="#1D1D1F">Main</text>
<path d="M650,45 H650 V260" fill="none" stroke="#E2001A" stroke-width="2"/>
<text x="650" y="290" font-size="22" text-anchor="middle" fill="#E2001A">1,2</text>
<text x="200" y="290" font-size="22" text-anchor="middle" fill="#1D1D1F">0</text>
<text x="575" y="290" font-size="22" text-anchor="middle" fill="#1D1D1F">1</text>
<text x="950" y="290" font-size="22" text-anchor="end" fill="#1D1D1F">2 ms</text>
</svg>
