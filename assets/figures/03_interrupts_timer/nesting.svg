<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="335" viewBox="0 0 1000 335" role="img">
<title>Überschriebenes mepc und die nötigen getrennten Sicherungsrahmen.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="335" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="30" font-size="25" text-anchor="start" fill="#1D1D1F">Ein Hardware-mepc, getrennte Softwareframes bei Nesting</text>
<rect x="20" y="60" width="440" height="105" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="40" y="100" font-size="24" text-anchor="start" fill="#1D1D1F">äußerer Eintritt: mepc 0x80001000</text>
<text x="40" y="144" font-size="24" text-anchor="start" fill="#E2001A">innerer Eintritt: mepc 0x80002040</text>
<rect x="570" y="65" width="410" height="75" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="590" y="96" font-size="24" text-anchor="start" fill="#1D1D1F">äußerer Frame:</text>
<text x="590" y="125" font-size="24" text-anchor="start" fill="#1D1D1F">Rückkehr 0x80001000</text>
<rect x="570" y="185" width="410" height="75" rx="10" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="590" y="216" font-size="24" text-anchor="start" fill="#1D1D1F">innerer Frame:</text>
<text x="590" y="245" font-size="24" text-anchor="start" fill="#1D1D1F">Rückkehr 0x80002040</text>
<path d="M775,185 H775 V140" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="220" font-size="25" text-anchor="start" fill="#1D1D1F">Ohne Sicherung ist die</text>
<text x="20" y="253" font-size="25" text-anchor="start" fill="#1D1D1F">ursprüngliche Adresse verloren.</text>
<text x="20" y="310" font-size="24" text-anchor="start" fill="#1D1D1F">Rückkehr: innen → außen → Main; Register und Status ebenfalls erhalten.</text>
</svg>
