<rect x="20" y="180" width="250" height="55" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="145" y="216" font-size="25" text-anchor="middle" fill="#1D1D1F">Taster · ID 3</text>
