<rect x="20" y="100" width="250" height="55" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="145" y="136" font-size="25" text-anchor="middle" fill="#1D1D1F">Sensor · ID 2</text>
