<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="245" viewBox="0 0 1000 245" role="img">
<title>Arbeitsteilung beim Trap-Eintritt und bei der Rückkehr.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="245" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<rect x="20" y="40" width="150" height="135" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="95.0" y="75" font-size="26" text-anchor="middle" fill="#1D1D1F">Main</text>
<rect x="220" y="40" width="300" height="135" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="370.0" y="75" font-size="26" text-anchor="middle" fill="#1D1D1F">Hardware</text>
<rect x="570" y="40" width="240" height="135" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="690.0" y="75" font-size="26" text-anchor="middle" fill="#1D1D1F">Software</text>
<rect x="860" y="40" width="120" height="135" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="920.0" y="75" font-size="26" text-anchor="middle" fill="#1D1D1F">mret</text>
<text x="35" y="116" font-size="23" text-anchor="start" fill="#1D1D1F">MIE = 1</text>
<text x="235" y="112" font-size="23" text-anchor="start" fill="#1D1D1F">mepc · mcause · MPP</text>
<text x="235" y="151" font-size="23" text-anchor="start" fill="#1D1D1F">MPIE ← MIE; MIE ← 0</text>
<text x="590" y="112" font-size="23" text-anchor="start" fill="#1D1D1F">Prolog · Handler</text>
<text x="590" y="151" font-size="23" text-anchor="start" fill="#1D1D1F">Epilog</text>
<text x="920" y="117" font-size="21" text-anchor="middle" fill="#1D1D1F">Rückkehr</text>
<path d="M170,100 H220 V100" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M520,100 H570 V100" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M810,100 H860 V100" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="220" font-size="25" text-anchor="start" fill="#1D1D1F">Hardware hält Trap-Zustand; Software erhält weitere Register.</text>
</svg>
