<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="422" viewBox="0 0 1000 422" role="img" aria-labelledby="title">
<title id="title">Lokale Akkumulation und gerichtete Nachbarweitergabe</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="422" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Output-Stationary · lokale Summe bleibt während des Tiles</text>
<rect x="360" y="125" width="280" height="125" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="500.0" y="180.5" font-size="24" fill="#1D1D1F" text-anchor="middle">C hält die Summe</text>
<text x="500.0" y="210.5" font-size="24" fill="#1D1D1F" text-anchor="middle">C neu: C + A · B</text>
<text x="70" y="198" font-size="24" fill="#1D1D1F" text-anchor="start">A von links</text>
<line x1="230" y1="185" x2="350" y2="185" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="82" font-size="24" fill="#1D1D1F" text-anchor="middle">B von oben</text>
<line x1="500" y1="92" x2="500" y2="115" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="650" y1="185" x2="750" y2="185" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="790" y="194" font-size="24" fill="#1D1D1F" text-anchor="start">A weiter</text>
<line x1="500" y1="258" x2="500" y2="300" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="337" font-size="24" fill="#1D1D1F" text-anchor="middle">B weiter</text>
<text x="500" y="393" font-size="23" fill="#1D1D1F" text-anchor="middle">Nur gültige Paare rechnen · unveränderte Operanden gehen zum Nachbarn</text>
</svg>
