<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title">
<title id="title">Zwei Eingaben, zwei nichtlineare Zwischenwerte und eine Ausgabesumme</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#656D76"/></marker></defs>
<rect width="1000" height="440" fill="#FFFFFF"/>
<text x="500" y="32" font-size="27" fill="#1D1D1F" text-anchor="middle">Mehrere Schichten bilden eine neue Rechenfolge</text><line x1="160" y1="135" x2="427" y2="135" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="160" y1="135" x2="427" y2="285" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="160" y1="285" x2="427" y2="135" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="160" y1="285" x2="427" y2="285" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="506" y1="135" x2="810" y2="210" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="506" y1="285" x2="810" y2="210" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="120" cy="135" r="37" fill="#FFFFFF" stroke="#656D76" stroke-width="2.5"/><text x="120" y="143" font-size="25" fill="#1D1D1F" text-anchor="middle">2</text><circle cx="120" cy="285" r="37" fill="#FFFFFF" stroke="#656D76" stroke-width="2.5"/><text x="120" y="293" font-size="25" fill="#1D1D1F" text-anchor="middle">−1</text><circle cx="468" cy="135" r="40" fill="#FFFFFF" stroke="#E2001A" stroke-width="2.5"/><text x="468" y="143" font-size="25" fill="#1D1D1F" text-anchor="middle">1</text><circle cx="468" cy="285" r="40" fill="#FFFFFF" stroke="#E2001A" stroke-width="2.5"/><text x="468" y="293" font-size="25" fill="#1D1D1F" text-anchor="middle">0</text><circle cx="852" cy="210" r="42" fill="#FFFFFF" stroke="#E2001A" stroke-width="2.5"/><text x="852" y="218" font-size="25" fill="#1D1D1F" text-anchor="middle">2</text><text x="120" y="83" font-size="25" fill="#1D1D1F" text-anchor="middle">Eingabe x</text><text x="470" y="83" font-size="25" fill="#1D1D1F" text-anchor="middle">h = ReLU(W₁x + b₁)</text><text x="850" y="135" font-size="25" fill="#1D1D1F" text-anchor="middle">Ausgabe</text><text x="663" y="135" font-size="24" fill="#1D1D1F" text-anchor="middle">Gewicht 2</text><text x="661" y="310" font-size="24" fill="#1D1D1F" text-anchor="middle">Gewicht −1</text><text x="500" y="365" font-size="26" fill="#1D1D1F" text-anchor="middle">h = [1, 0]ᵀ;   y = [2, −1] · h = 2</text><text x="500" y="406" font-size="23" fill="#656D76" text-anchor="middle">Ohne Nichtlinearität bleiben mehrere affine Schichten insgesamt affin.</text></svg>
