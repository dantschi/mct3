<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect width="1200" height="400" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Lehr-Roofline, keine Chipmessung. Grenze: DRAM zu On-Chip. Peak 8 Ops/Takt, Band 8 Byte/Takt.</text>
<text x="16" y="44" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">Knick bei Peak/Bandbreite = 1 Op/Byte.</text>
<text x="80" y="250" font-size="13" font-weight="600" fill="#1565C0" text-anchor="start">0,25</text>
<rect x="140" y="200" width="80" height="40" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.4"/>
<text x="150" y="224" font-size="13" font-weight="600" fill="#1565C0" text-anchor="start">naiv</text>
<text x="280" y="180" font-size="13" font-weight="600" fill="#1B5E20" text-anchor="start">0,5</text>
<rect x="330" y="160" width="80" height="40" fill="#E8F5E9" stroke="#1B5E20" stroke-width="1.4"/>
<text x="338" y="184" font-size="13" font-weight="600" fill="#1B5E20" text-anchor="start">Reuse</text>
<line x1="520" y1="80" x2="520" y2="250" stroke="#B71C1C" stroke-width="2" stroke-dasharray="4 3"/>
<text x="528" y="100" font-size="13" font-weight="600" fill="#B71C1C" text-anchor="start">Knick 1</text>
<text x="16" y="280" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Naiv: 2 Ops / 8 Byte = 0,25. Erreichbar min(8, 8*0,25) = 2 Ops/Takt.</text>
<text x="16" y="308" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">2x2 ohne Wiederverwendung: 64 Byte, untere Schranke 8 Takte bei 8 Byte/Takt.</text>
<text x="16" y="336" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Mit lokalem Tile: 32 Byte, Schranke 4 Takte. Rechnung min(Peak, Band*AI).</text>
<text x="16" y="368" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Nicht jeder Zugriff ist ein DRAM-Miss. SRAM, Cache-Hit und Prefetch sind andere Faelle.</text>
</svg>
