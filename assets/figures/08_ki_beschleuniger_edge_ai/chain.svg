<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
<rect width="1200" height="340" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Lehrlatenzen: Mul 2 Takte, Add 1. Vier Elemente, eine Lane. Keine RVV-Hardwarezeit.</text>
<text x="16" y="52" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">Getrennt: Mul fertig ab Takt 2, Add erst danach. Alles fertig Takt 6.</text>
<text x="16" y="80" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Chaining: Element 0 geht nach Mul-Latenz in den Add. Folgeelemente ueberlappen.</text>
<text x="16" y="108" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Erstes Ergebnis Takt 3. Letztes Takt 6. Bandbreite kann vorher begrenzen.</text>
<rect x="16" y="140" width="140" height="36" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="24" y="164" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">e0 mul</text>
<rect x="176" y="140" width="140" height="36" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="184" y="164" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">e1 mul</text>
<rect x="336" y="140" width="140" height="36" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="344" y="164" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">e0 add</text>
<rect x="496" y="140" width="140" height="36" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="504" y="164" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">e2 mul</text>
<rect x="656" y="140" width="140" height="36" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="664" y="164" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">e1 add</text>
<rect x="816" y="140" width="140" height="36" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="824" y="164" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">e3/e2</text>
<text x="16" y="210" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Annahme: Initiationsintervall 1, eine Lane, Forwarding nur im Chaining-Fall.</text>
<text x="16" y="238" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">RVV garantiert Chaining nicht. FMA ist zusaetzlich eine andere Rundung.</text>
<text x="16" y="266" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Weniger Fetch spart nicht automatisch Gesamtenergie. Speicher bleibt im Budget.</text>
<text x="16" y="300" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Registerbreite allein erklaert grosse Modelle nicht.</text>
</svg>
