<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<rect width="1200" height="360" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Lokale und Cloud-Inferenz. Keine Aussage, Funk sei immer teurer.</text>
<rect x="16" y="48" width="520" height="150" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="32" y="74" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Lokal</text>
<text x="32" y="120" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Sensor</text>
<text x="152" y="120" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Vorverarbeitung</text>
<text x="272" y="120" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Inferenz</text>
<text x="392" y="120" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Ergebnis</text>
<rect x="620" y="48" width="520" height="150" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="636" y="74" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">Cloud</text>
<text x="636" y="120" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Sensor</text>
<text x="756" y="120" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Funk</text>
<text x="876" y="120" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Server-Inferenz</text>
<text x="996" y="120" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Antwort</text>
<text x="16" y="230" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Anforderungen: Latenz, Energie, Datenschutz, Verfuegbarkeit. Jede kann ausfallen.</text>
<text x="16" y="258" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Edge umfasst auch Gateways. Nicht jede lokale Inferenz braucht eine NPU.</text>
<text x="16" y="286" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Lokal bleiben heisst nicht automatisch datenschutzkonform oder sicher.</text>
<text x="16" y="320" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">OoO kann Load-Latenzen und mehrere Akkumulatoren nutzen. Eine einzelne Kette bleibt RAW.</text>
<text x="16" y="346" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">-O3 garantiert weder Unrolling noch kuerzere Laufzeit.</text>
</svg>
