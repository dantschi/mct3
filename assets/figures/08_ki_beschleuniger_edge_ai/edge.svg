<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="325" viewBox="0 0 1000 325" role="img" aria-labelledby="title">
<title id="title">Lokale und entfernte Verarbeitungsorte</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="325" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Edge: Verarbeitung am Gerät oder lokalen Gateway</text>
<rect x="20" y="100" width="150" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="95.0" y="158.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Sensor</text>
<rect x="210" y="100" width="220" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="320.0" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Endgerät</text>
<text x="320.0" y="173.0" font-size="24" fill="#1D1D1F" text-anchor="middle">CPU / DSP</text>
<rect x="465" y="100" width="220" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="575.0" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Gateway</text>
<text x="575.0" y="173.0" font-size="24" fill="#1D1D1F" text-anchor="middle">lokal</text>
<rect x="750" y="100" width="220" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="860.0" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Server</text>
<text x="860.0" y="173.0" font-size="24" fill="#1D1D1F" text-anchor="middle">entfernt</text>
<line x1="170" y1="150" x2="205" y2="150" stroke="#E2001A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="430" y1="150" x2="460" y2="150" stroke="#E2001A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="685" y1="150" x2="745" y2="150" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="245" font-size="23" fill="#1D1D1F" text-anchor="middle">kurzer lokaler Weg</text>
<text x="825" y="245" font-size="23" fill="#1D1D1F" text-anchor="middle">Netzübertragung</text>
<text x="500" y="295" font-size="24" fill="#1D1D1F" text-anchor="middle">Ort allein bestimmt weder Energie noch Modellgüte</text>
</svg>
