<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect width="1200" height="420" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">LMUL=1, e32. VLMAX = VLEN/SEW. VLEN ist nicht die Lane-Zahl.</text>
<rect x="16" y="48" width="540" height="90" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="28" y="74" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">VLEN 128 Bit, VLMAX 4</text>
<text x="28" y="100" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">1000 Elemente: 250 mal VL=4, Rest 0</text>
<rect x="600" y="48" width="560" height="90" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="612" y="74" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">VLEN 1024 Bit, VLMAX 32</text>
<text x="612" y="100" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Eine Policy: 30 mal 32, dann 32+8</text>
<text x="16" y="170" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">31*32+8 = 1000. Zusammen 32 Schleifen, nicht 31.</text>
<text x="16" y="202" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">vsetvli liefert nicht immer min(AVL, VLMAX), wenn AVL zwischen VLMAX und 2*VLMAX liegt.</text>
<text x="16" y="234" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Ist der Rest 8 und VLMAX 32, ist VL genau 8, nicht frei gewaehlt.</text>
<text x="16" y="270" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">Eine physische Lane-Gruppe kann VLMAX Elemente ueber mehrere Takte rechnen.</text>
<text x="16" y="302" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Ein Binary braucht passende ISA, Erweiterung, ABI und einen RVV-Kern.</text>
<text x="16" y="334" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Pointer += VL * 4 Byte. Zaehler -= VL. Ende bei AVL 0.</text>
<text x="16" y="370" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Policy im Beispiel: ta, ma, m1. Spezifikation RVV 1.0.</text>
<text x="16" y="398" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Keine Toolchain in diesem Repository hat die Schleife assembliert.</text>
</svg>
