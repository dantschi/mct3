<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title">
<title id="title">Vektorkapazität und drei aktive Elementplätze</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="310" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">32 Vektorregister v0–v31 · ein Register hat hier VLEN = 128 Bit</text>
<rect x="80" y="100" width="210" height="90" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="185" y="155" font-size="25" fill="#1D1D1F" text-anchor="middle">Element 0</text>
<text x="185" y="224" font-size="23" fill="#1D1D1F" text-anchor="middle">32 Bit</text>
<rect x="295" y="100" width="210" height="90" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="400" y="155" font-size="25" fill="#1D1D1F" text-anchor="middle">Element 1</text>
<text x="400" y="224" font-size="23" fill="#1D1D1F" text-anchor="middle">32 Bit</text>
<rect x="510" y="100" width="210" height="90" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="615" y="155" font-size="25" fill="#1D1D1F" text-anchor="middle">Element 2</text>
<text x="615" y="224" font-size="23" fill="#1D1D1F" text-anchor="middle">32 Bit</text>
<rect x="725" y="100" width="210" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="830" y="155" font-size="25" fill="#1D1D1F" text-anchor="middle">Tail</text>
<text x="830" y="224" font-size="23" fill="#1D1D1F" text-anchor="middle">32 Bit</text>
<text x="500" y="280" font-size="24" fill="#1D1D1F" text-anchor="middle">LMUL = 1 · SEW = 32 Bit · VLMAX = 4 Elemente · VL = 3 Elemente</text>
</svg>
