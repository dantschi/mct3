<text x="322.5" y="105.5" font-size="24" fill="#1D1D1F" text-anchor="middle">0</text>
<line x1="385" y1="97" x2="435" y2="97" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="440" y="65" width="125" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="502.5" y="105.5" font-size="24" fill="#1D1D1F" text-anchor="middle">2</text>
