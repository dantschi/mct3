<text x="695.0" y="305.5" font-size="24" fill="#1D1D1F" text-anchor="middle">3 · 3</text>
<rect x="800" y="265" width="150" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="875.0" y="305.5" font-size="24" fill="#1D1D1F" text-anchor="middle">0 · 2</text>
<text x="500" y="380" font-size="23" fill="#1D1D1F" text-anchor="middle">Getrennte Summen sind unabhängig · Produkte bieten Datenparallelität</text>
