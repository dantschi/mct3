<text x="785.0" y="203.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Summe y1: 9</text>
<text x="20" y="314" font-size="23" fill="#1D1D1F" text-anchor="start">viele Produkte</text>
<rect x="260" y="265" width="150" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
