<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415" viewBox="0 0 1000 415" role="img" aria-labelledby="title">
<title id="title">Dieselbe Ausgabesumme: drei beispielhafte Datenwege</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="415" fill="#FFFFFF"/>
<desc>Eine Ausgabesumme der Dense-Schicht: Gewichte 1, 2, 3, Eingaben 2, 1, 3 und Bias 1. Der skalare CPU-Lehrpfad nutzt eine MAC wiederholt. Der GPU-Lehrpfad bildet drei Produkte parallel und reduziert sie. Ein NPU-Prinzipbeispiel hält ladbare Gewichte lokal und reicht Teilsummen durch drei MAC-Zellen. Alle ergeben 14. Keine Zeit- oder Energiewerte.</desc>
<metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:title>Dieselbe Ausgabesumme auf CPU, GPU und NPU</dc:title><dc:creator>Projekt Mikrocomputertechnik 3 (MCT3)</dc:creator><dc:description>Eigene Zeichnung zum kursinternen Zahlenbeispiel; keine übernommenen Bildbestandteile.</dc:description><cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/></cc:Work></rdf:RDF></metadata>
<text x="170" y="35" font-size="30" fill="#1D1D1F" text-anchor="middle">CPU</text>
<text x="170" y="72" font-size="23" fill="#1D1D1F" text-anchor="middle">Skalarer Lehrpfad</text>
<rect x="20" y="95" width="300" height="310" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500" y="35" font-size="30" fill="#1D1D1F" text-anchor="middle">GPU</text>
<text x="500" y="72" font-size="23" fill="#1D1D1F" text-anchor="middle">Produkte parallel bilden</text>
<rect x="350" y="95" width="300" height="310" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="830" y="35" font-size="30" fill="#1D1D1F" text-anchor="middle">NPU</text>
<text x="830" y="72" font-size="23" fill="#1D1D1F" text-anchor="middle">Ein lokaler Datenfluss</text>
<rect x="680" y="95" width="300" height="310" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<rect x="45" y="135" width="115" height="55" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
<text x="102.5" y="169.86" font-size="23" fill="#1D1D1F" text-anchor="middle">Eingang 2</text>
<rect x="180" y="135" width="115" height="55" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
<text x="237.5" y="169.86" font-size="23" fill="#1D1D1F" text-anchor="middle">Gewicht 1</text>
<polyline points="102.000,190.000 102.000,205.000 145.000,205.000 145.000,225.000" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
