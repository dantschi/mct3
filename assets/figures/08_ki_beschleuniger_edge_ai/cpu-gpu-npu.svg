<line x1="500" y1="225" x2="500" y2="255" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="255" width="240" height="85" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
<text x="500" y="289" font-size="25" fill="#1D1D1F" text-anchor="middle">Reduktion + Bias</text>
