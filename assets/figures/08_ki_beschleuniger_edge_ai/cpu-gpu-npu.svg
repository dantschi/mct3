<rect x="115" y="225" width="110" height="55" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
<text x="170.0" y="260.82" font-size="26" fill="#1D1D1F" text-anchor="middle">MAC</text>
<rect x="50" y="305" width="240" height="60" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
<text x="170" y="326" font-size="22" fill="#1D1D1F" text-anchor="middle">Akkumulator</text>
<text x="170" y="358" font-size="26" fill="#1D1D1F" text-anchor="middle">1 → 3 → 5 → 14</text>
<line x1="170" y1="280" x2="170" y2="305" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
