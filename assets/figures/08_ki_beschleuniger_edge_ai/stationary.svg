<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title">
<title id="title">Zwei unterschiedliche lokal gehaltene Datenarten</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="405" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Stationary bezeichnet den lokal bleibenden Wert, nicht das ganze Netz</text>
<rect x="110" y="110" width="270" height="110" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="245.0" y="158.0" font-size="24" fill="#1D1D1F" text-anchor="middle">C bleibt lokal</text>
<text x="245.0" y="188.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Output-Stationary</text>
<rect x="620" y="110" width="270" height="110" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="755.0" y="158.0" font-size="24" fill="#1D1D1F" text-anchor="middle">W bleibt lokal</text>
<text x="755.0" y="188.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Weight-Stationary</text>
<line x1="245" y1="65" x2="245" y2="100" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="245" y1="230" x2="245" y2="270" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="245" y="312" font-size="22" fill="#1D1D1F" text-anchor="middle">A und B bewegen sich</text>
<line x1="755" y1="65" x2="755" y2="100" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="755" y1="230" x2="755" y2="270" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="755" y="312" font-size="22" fill="#1D1D1F" text-anchor="middle">x und Teilsummen bewegen sich</text>
<text x="500" y="375" font-size="24" fill="#1D1D1F" text-anchor="middle">Vorladen und Tilewechsel bleiben nötig · verschiedene Ablaufmodelle</text>
</svg>
