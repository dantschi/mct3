<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
<rect width="1200" height="340" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Zwei Dataflows. Der Rand-Speicherzugriff gilt fuer dieses vereinfachte Array.</text>
<rect x="16" y="50" width="560" height="150" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="28" y="76" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Output-Stationary</text>
<text x="28" y="104" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">C bleibt. A horizontal, B vertikal.</text>
<text x="28" y="130" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Teilsumme lokal. Readout am Ende.</text>
<text x="28" y="156" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Gewichte fliessen, sie stehen nicht fest.</text>
<rect x="620" y="50" width="540" height="150" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="632" y="76" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">Weight-Stationary</text>
<text x="632" y="104" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Gewicht steht. Aktivierung fliesst.</text>
<text x="632" y="130" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Teilsumme kann weiterwandern.</text>
<text x="632" y="156" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Weights brauchen trotzdem Load und Wechsel.</text>
<text x="16" y="230" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Nicht jede NPU ist systolisch und nicht jede rechnet nur Matrizen.</text>
<text x="16" y="258" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Vergleich CPU/GPU/NPU braucht Datentyp, Batch, Auslastung und Transfer.</text>
<text x="16" y="292" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">TPU v1: 256*256*2*700e6 = 91,75e12 Ops/s, oft 92 TOPS genannt. Datacenter, kein mW-Edge.</text>
<text x="16" y="320" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Peak ist nicht die End-to-End-Inferenzleistung.</text>
</svg>
