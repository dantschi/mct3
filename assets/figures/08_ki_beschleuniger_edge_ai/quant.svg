<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect width="1200" height="400" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">real = scale * (q - zero_point). scale=0,1 zero_point=0. Rundung zur naechsten Zahl.</text>
<text x="16" y="50" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">1,24 -> q=12 -> zurueck 1,2. Fehler 0,04.</text>
<text x="16" y="78" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">20,0 -> Rohwert 200 -> Clamp 127 -> zurueck 12,7.</text>
<text x="16" y="114" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Int8-Gewichte: 4 Byte auf 1 Byte, 75 Prozent weniger reine Gewichtsbytes.</text>
<text x="16" y="142" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Bias, Metadaten, Aktivierungen, Scratch und Arena bleiben extra.</text>
<rect x="16" y="170" width="340" height="80" fill="#fff" stroke="#6A1B9A" stroke-width="1.4"/>
<text x="28" y="196" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">Flash: Gewichte</text>
<text x="28" y="220" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">nur der konstante Block</text>
<rect x="400" y="170" width="740" height="80" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="412" y="196" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">SRAM: Input, Output, Aktivierungen, Scratch</text>
<text x="412" y="220" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Arena ist dieser Puffer, kein zweiter Heap</text>
<text x="16" y="280" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Int32-Akkumulator fuer geeignete Int8-MACs. Per-Tensor und Per-Channel sind verschiedene Scales.</text>
<text x="16" y="308" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Integer ist nicht auf jeder CPU schneller. Accuracy gehoert auf Testdaten gemessen.</text>
<text x="16" y="340" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Pruning aendert die Darstellung. Weniger MACs nur, wenn der Kernel Sparse versteht.</text>
<text x="16" y="372" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Kein 10-KiB- oder 20-KB-Wert ohne Messung.</text>
</svg>
