<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="355" viewBox="0 0 1000 355" role="img" aria-labelledby="title">
<title id="title">Zwei gültige Aufteilungen desselben Vektorrestes</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="355" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">AVL = 40 · VLMAX = 32 · erste VL muss zwischen 20 und 32 liegen</text>
<rect x="120" y="95" width="635" height="65" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="438" y="137" font-size="28" fill="#1D1D1F" text-anchor="middle">32</text>
<rect x="760" y="95" width="155" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="838" y="137" font-size="28" fill="#1D1D1F" text-anchor="middle">8</text>
<rect x="120" y="210" width="395" height="65" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="318" y="252" font-size="28" fill="#1D1D1F" text-anchor="middle">20</text>
<rect x="520" y="210" width="395" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="718" y="252" font-size="28" fill="#1D1D1F" text-anchor="middle">20</text>
<text x="500" y="325" font-size="24" fill="#1D1D1F" text-anchor="middle">Zulässig: 32 + 8 oder 20 + 20 · unzulässig: zuerst 16</text>
</svg>
