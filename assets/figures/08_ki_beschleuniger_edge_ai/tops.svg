<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title">
<title id="title">Von Einheiten und Taktfrequenz zum gezählten Peak</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="310" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">TPU v1 · dokumentierter Rechenpeak · 2 Ops je Int8-MAC</text>
<rect x="20" y="110" width="280" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="160.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">256 × 256</text>
<text x="160.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">65 536 MACs</text>
<rect x="355" y="110" width="280" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="495.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">700 MHz</text>
<text x="495.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">45,8752 TMAC/s</text>
<rect x="700" y="110" width="280" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="840.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">× 2 Ops/MAC</text>
<text x="840.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">91,7504 TOPS</text>
<line x1="300" y1="160" x2="350" y2="160" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="635" y1="160" x2="695" y2="160" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="280" font-size="24" fill="#1D1D1F" text-anchor="middle">Gerundet 92 TOPS · keine Inferenzen/s · keine Wattangabe</text>
</svg>
