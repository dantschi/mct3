<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<rect width="1200" height="360" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Peak-Rechnung und illustrative Auslastung. Keine gemessenen TOPS/W.</text>
<text x="16" y="52" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">65536 MACs * 700 MHz = 45,8752 TMAC/s. Mal 2 Ops = 91,7504 TOPS.</text>
<text x="16" y="88" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">2x2-Rechnung auf einem gedachten 4x4-Array: 4 von 16 Zellen aktiv = 25 Prozent.</text>
<rect x="16" y="110" width="32" height="32" fill="#E8F5E9" stroke="#1B5E20" stroke-width="1.4"/>
<rect x="52" y="110" width="32" height="32" fill="#E8F5E9" stroke="#1B5E20" stroke-width="1.4"/>
<rect x="88" y="110" width="32" height="32" fill="#f5f5f5" stroke="#5F6368" stroke-width="1.4"/>
<rect x="124" y="110" width="32" height="32" fill="#f5f5f5" stroke="#5F6368" stroke-width="1.4"/>
<rect x="16" y="146" width="32" height="32" fill="#E8F5E9" stroke="#1B5E20" stroke-width="1.4"/>
<rect x="52" y="146" width="32" height="32" fill="#E8F5E9" stroke="#1B5E20" stroke-width="1.4"/>
<rect x="88" y="146" width="32" height="32" fill="#f5f5f5" stroke="#5F6368" stroke-width="1.4"/>
<rect x="124" y="146" width="32" height="32" fill="#f5f5f5" stroke="#5F6368" stroke-width="1.4"/>
<rect x="16" y="182" width="32" height="32" fill="#f5f5f5" stroke="#5F6368" stroke-width="1.4"/>
<rect x="52" y="182" width="32" height="32" fill="#f5f5f5" stroke="#5F6368" stroke-width="1.4"/>
<rect x="88" y="182" width="32" height="32" fill="#f5f5f5" stroke="#5F6368" stroke-width="1.4"/>
<rect x="124" y="182" width="32" height="32" fill="#f5f5f5" stroke="#5F6368" stroke-width="1.4"/>
<rect x="16" y="218" width="32" height="32" fill="#f5f5f5" stroke="#5F6368" stroke-width="1.4"/>
<rect x="52" y="218" width="32" height="32" fill="#f5f5f5" stroke="#5F6368" stroke-width="1.4"/>
<rect x="88" y="218" width="32" height="32" fill="#f5f5f5" stroke="#5F6368" stroke-width="1.4"/>
<rect x="124" y="218" width="32" height="32" fill="#f5f5f5" stroke="#5F6368" stroke-width="1.4"/>
<text x="200" y="150" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Gruen = aktive Zelle des 2x2-Beispiels.</text>
<text x="16" y="280" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Pruefliste: Praezision, Ops je MAC, Sparse oder Dense, Batch, Messgrenze, End-to-End-Latenz.</text>
<text x="16" y="308" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Nullen in einer Dense-Matrix sparen keine Zeit, solange der Kernel sie rechnet.</text>
<text x="16" y="338" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Tile, Fill, Drain und nicht beschleunigte Operatoren senken die Auslastung.</text>
</svg>
