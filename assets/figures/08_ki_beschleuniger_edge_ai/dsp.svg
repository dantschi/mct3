<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title">
<title id="title">Zwei lokale Operandenpfade für eine gewichtete Summe</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="380" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">DSP-Lehrbild · FIR: zwei Koeffizienten und ein Eingangsfenster</text>
<rect x="30" y="75" width="260" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="160.0" y="110.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Koeffizienten</text>
<text x="160.0" y="140.5" font-size="24" fill="#1D1D1F" text-anchor="middle">1, 2</text>
<rect x="30" y="210" width="260" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="160.0" y="245.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Fensterwerte</text>
<text x="160.0" y="275.5" font-size="24" fill="#1D1D1F" text-anchor="middle">3, 4</text>
<line x1="290" y1="117" x2="445" y2="117" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="290" y1="252" x2="445" y2="252" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="460" y="100" width="270" height="175" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="595.0" y="165.5" font-size="24" fill="#1D1D1F" text-anchor="middle">MAC</text>
<text x="595.0" y="195.5" font-size="24" fill="#1D1D1F" text-anchor="middle">1 · 3 + 2 · 4</text>
<text x="595.0" y="225.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Akkumulator 11</text>
<text x="500" y="350" font-size="23" fill="#1D1D1F" text-anchor="middle">Getrennte Pfade helfen nur bei passenden Speicherbänken und Ports</text>
</svg>
