<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285" role="img" aria-labelledby="title">
<title id="title">Breite des Produkts und Akkumulators</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="285" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Int8-Eingaben bedeuten nicht Int8-Produkte oder Int8-Summen</text>
<rect x="20" y="95" width="180" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="110.0" y="128.0" font-size="24" fill="#1D1D1F" text-anchor="middle">20</text>
<text x="110.0" y="158.0" font-size="24" fill="#1D1D1F" text-anchor="middle">8-Bit-Eingabe</text>
<rect x="260" y="95" width="180" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="350.0" y="128.0" font-size="24" fill="#1D1D1F" text-anchor="middle">20</text>
<text x="350.0" y="158.0" font-size="24" fill="#1D1D1F" text-anchor="middle">8-Bit-Gewicht</text>
<text x="230" y="146" font-size="28" fill="#1D1D1F" text-anchor="middle">×</text>
<line x1="440" y1="135" x2="505" y2="135" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="520" y="90" width="180" height="90" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="610.0" y="128.0" font-size="24" fill="#1D1D1F" text-anchor="middle">400</text>
<text x="610.0" y="158.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Produkt</text>
<line x1="700" y1="135" x2="775" y2="135" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="790" y="90" width="190" height="90" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="885.0" y="128.0" font-size="24" fill="#1D1D1F" text-anchor="middle">1200</text>
<text x="885.0" y="158.0" font-size="24" fill="#1D1D1F" text-anchor="middle">3 Produkte</text>
<text x="500" y="255" font-size="24" fill="#1D1D1F" text-anchor="middle">Vor der Rechnung verbreitern · anschließend Ergebnisbereich prüfen</text>
</svg>
