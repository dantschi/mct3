<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect width="1200" height="420" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Dense y = Wx+b. W ist 2x3, x hat 3, b und y haben 2. Integer-Analogie, kein Float-mul.</text>
<text x="16" y="48" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">W = [[1,2,3],[0,-1,4]], x = [2,1,3], b = [1,-2]</text>
<text x="16" y="78" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">y0 = 1*2 + 2*1 + 3*3 + 1 = 14</text>
<text x="16" y="104" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">y1 = 0*2 + (-1)*1 + 4*3 + (-2) = 9</text>
<text x="16" y="140" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Parameter 6+2 = 8. MACs nur die Produkte: 6. Nicht allgemein Parameter = MACs.</text>
<text x="16" y="168" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">1 MAC = 2 arithmetische Ops in dieser TOPS-Konvention. Bias-Add ist extra.</text>
<rect x="16" y="190" width="250" height="50" fill="#fff" stroke="#6A1B9A" stroke-width="1.4"/>
<text x="28" y="212" font-size="13" font-weight="600" fill="#6A1B9A" text-anchor="start">Parameter</text>
<text x="28" y="230" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">8</text>
<rect x="296" y="190" width="250" height="50" fill="#fff" stroke="#6A1B9A" stroke-width="1.4"/>
<text x="308" y="212" font-size="13" font-weight="600" fill="#6A1B9A" text-anchor="start">MACs</text>
<text x="308" y="230" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">6</text>
<rect x="576" y="190" width="250" height="50" fill="#fff" stroke="#6A1B9A" stroke-width="1.4"/>
<text x="588" y="212" font-size="13" font-weight="600" fill="#6A1B9A" text-anchor="start">Arithmetik</text>
<text x="588" y="230" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">14</text>
<rect x="856" y="190" width="250" height="50" fill="#fff" stroke="#6A1B9A" stroke-width="1.4"/>
<text x="868" y="212" font-size="13" font-weight="600" fill="#6A1B9A" text-anchor="start">Int8-Bytes Daten</text>
<text x="868" y="230" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">11</text>
<text x="16" y="270" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">14 = 6*2 + 2 Bias-Additionen. Schleife und Pointer zaehlen hier nicht mit.</text>
<text x="16" y="298" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">RV32IM mul/add sind Ganzzahl. Eine Float32-MAC waere eine andere ISA.</text>
<text x="16" y="326" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">FMA rundet einmal. Getrennte Mul und Add runden zweimal.</text>
<text x="16" y="354" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Convolution: ein Gewicht wird mehrfach benutzt. Dann sind MACs groesser als die Parameterzahl.</text>
<text x="16" y="386" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">10^6 Gewichte sind nur unter der Annahme ein Gewicht pro MAC auch 10^6 MACs.</text>
</svg>
