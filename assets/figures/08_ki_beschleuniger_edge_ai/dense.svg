<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375" viewBox="0 0 1000 375" role="img" aria-labelledby="title">
<title id="title">Zwei vollständige Produktsummen mit Bias</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="375" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Dense · drei Produkte je Ausgang · Bias einmal hinzufügen</text>
<rect x="20" y="100" width="190" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="115.0" y="138.0" font-size="24" fill="#1D1D1F" text-anchor="middle">1 · 2 = 2</text>
<rect x="230" y="100" width="190" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="325.0" y="138.0" font-size="24" fill="#1D1D1F" text-anchor="middle">2 · 1 = 2</text>
<rect x="440" y="100" width="190" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="535.0" y="138.0" font-size="24" fill="#1D1D1F" text-anchor="middle">3 · 3 = 9</text>
<line x1="640" y1="130" x2="690" y2="130" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="700" y="90" width="275" height="80" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="837.5" y="123.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Bias +1</text>
<text x="837.5" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Ausgang 14</text>
<rect x="20" y="225" width="190" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="115.0" y="263.0" font-size="24" fill="#1D1D1F" text-anchor="middle">0 · 2 = 0</text>
<rect x="230" y="225" width="190" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="325.0" y="263.0" font-size="24" fill="#1D1D1F" text-anchor="middle">−1 · 1 = −1</text>
<rect x="440" y="225" width="190" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="535.0" y="263.0" font-size="24" fill="#1D1D1F" text-anchor="middle">4 · 3 = 12</text>
<line x1="640" y1="255" x2="690" y2="255" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="700" y="215" width="275" height="80" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="837.5" y="248.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Bias −2</text>
<text x="837.5" y="278.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Ausgang 9</text>
<text x="500" y="345" font-size="24" fill="#1D1D1F" text-anchor="middle">6 produktbezogene MACs · 8 Parameter · Ausgabe [14, 9]</text>
</svg>
