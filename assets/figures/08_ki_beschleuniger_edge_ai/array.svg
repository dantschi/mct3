<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
<rect width="1200" height="460" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="18" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Output-Stationary. A nach rechts, B nach unten, C bleibt. Takt = ein gueltiger MAC.</text>
<text x="16" y="40" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">C00=19, C01=22, C10=43, C11=50. Fertig in den Takten 2, 3, 3 und 4.</text>
<text x="16" y="80" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">T1</text>
<rect x="70" y="58" width="260" height="52" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="80" y="80" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">C00 k=0 +5</text>
<text x="80" y="100" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Summe 5</text>
<text x="16" y="150" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">T2</text>
<rect x="70" y="128" width="260" height="52" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="80" y="150" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">C00 k=1 +14</text>
<text x="80" y="170" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Summe 19</text>
<rect x="350" y="128" width="260" height="52" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="360" y="150" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">C01 k=0 +6</text>
<text x="360" y="170" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Summe 6</text>
<rect x="630" y="128" width="260" height="52" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="640" y="150" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">C10 k=0 +15</text>
<text x="640" y="170" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Summe 15</text>
<text x="16" y="220" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">T3</text>
<rect x="70" y="198" width="260" height="52" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="80" y="220" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">C01 k=1 +16</text>
<text x="80" y="240" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Summe 22</text>
<rect x="350" y="198" width="260" height="52" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="360" y="220" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">C10 k=1 +28</text>
<text x="360" y="240" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Summe 43</text>
<rect x="630" y="198" width="260" height="52" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="640" y="220" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">C11 k=0 +18</text>
<text x="640" y="240" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Summe 18</text>
<text x="16" y="290" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">T4</text>
<rect x="70" y="268" width="260" height="52" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="80" y="290" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">C11 k=1 +32</text>
<text x="80" y="310" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Summe 50</text>
<text x="16" y="360" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Nicht: ab Takt 3 ein fertiger Output je Takt. C11 endet erst in Takt 4.</text>
<text x="16" y="388" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Staffelung: gleiche k treffen sich, weil Zeile und Spalte verzoegert eingespeist werden.</text>
<text x="16" y="416" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Fill Takt 1, Compute bis Takt 4, Readout der lokalen C danach. Drain ist kein Automatismus.</text>
<text x="16" y="444" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Leere Zellen in einem Takt sind ungueltige Begegnungen, keine extra MACs.</text>
</svg>
