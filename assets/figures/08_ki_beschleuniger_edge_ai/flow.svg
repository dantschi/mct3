<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395" role="img" aria-labelledby="title">
<title id="title">Vom Modell zu wiederholter Inferenz</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="395" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Modellvorbereitung und Firmwareausführung sind getrennte Phasen</text>
<rect x="20" y="95" width="280" height="95" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="160.0" y="135.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Training</text>
<text x="160.0" y="165.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Parameter</text>
<rect x="355" y="95" width="280" height="95" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="495.0" y="135.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Konvertierung</text>
<text x="495.0" y="165.5" font-size="24" fill="#1D1D1F" text-anchor="middle">.tflite-Daten</text>
<rect x="700" y="95" width="280" height="95" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="840.0" y="135.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Firmware</text>
<text x="840.0" y="165.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Daten + Kernel</text>
<line x1="300" y1="143" x2="350" y2="143" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="635" y1="143" x2="695" y2="143" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="270" width="280" height="95" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="160.0" y="310.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Sensorfenster</text>
<text x="160.0" y="340.5" font-size="24" fill="#1D1D1F" text-anchor="middle">vorbereiten</text>
<rect x="355" y="270" width="280" height="95" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="495.0" y="310.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Operatoren</text>
<text x="495.0" y="340.5" font-size="24" fill="#1D1D1F" text-anchor="middle">ausführen</text>
<rect x="700" y="270" width="280" height="95" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="840.0" y="310.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Ausgabe</text>
<text x="840.0" y="340.5" font-size="24" fill="#1D1D1F" text-anchor="middle">interpretieren</text>
<line x1="300" y1="317" x2="350" y2="317" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="635" y1="317" x2="695" y2="317" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="840" y1="198" x2="840" y2="260" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
