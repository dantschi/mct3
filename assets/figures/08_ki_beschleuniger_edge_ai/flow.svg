<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<rect width="1200" height="360" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Workflow. Das Byte-Array ist Modelldaten, kein ausfuehrbarer Maschinencode.</text>
<rect x="16" y="48" width="270" height="52" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="28" y="80" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Trainieren</text>
<rect x="306" y="48" width="270" height="52" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="318" y="80" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Quantisieren</text>
<rect x="596" y="48" width="270" height="52" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="608" y="80" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Operator pruefen</text>
<rect x="886" y="48" width="270" height="52" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="898" y="80" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">C-Array</text>
<rect x="16" y="118" width="270" height="52" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="28" y="150" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Vorverarbeitung</text>
<rect x="306" y="118" width="270" height="52" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="318" y="150" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Invoke</text>
<rect x="596" y="118" width="270" height="52" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="608" y="150" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Pruefen</text>
<text x="16" y="210" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">CPU-Kernel ist der Default. Eine NPU braucht Backend, Operator und Toolchain.</text>
<text x="16" y="240" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">AllocateTensors und Invoke haben Rueckgaben. Arena-Groesse wird gemessen, nicht geraten.</text>
<text x="16" y="270" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Int8-Input folgt scale und zero_point der Trainingsvorverarbeitung.</text>
<text x="16" y="300" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Ein Logit ist keine kalibrierte Wahrscheinlichkeit. 0,8 ist keine allgemeine Schwelle.</text>
<text x="16" y="334" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Renode-Funktion ist kein Beweis fuer Memory Wall, CPI oder NPU-Beschleunigung.</text>
</svg>
