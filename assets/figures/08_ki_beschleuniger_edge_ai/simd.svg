<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<rect width="1200" height="360" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Packed Add ist kein Int8-Dot-Product. Lanes haben getrennte Uebertraege.</text>
<text x="16" y="60" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Lane</text>
<rect x="80" y="44" width="220" height="70" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="92" y="70" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">01 + 02</text>
<text x="92" y="96" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Ergebnis 03</text>
<rect x="330" y="44" width="220" height="70" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="342" y="70" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">10 + 20</text>
<text x="342" y="96" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Ergebnis 30</text>
<rect x="580" y="44" width="220" height="70" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="592" y="70" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">7F + 01</text>
<text x="592" y="96" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Ergebnis 80/sat</text>
<rect x="830" y="44" width="220" height="70" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="842" y="70" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">FF + 01</text>
<text x="842" y="96" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Ergebnis 00/sat</text>
<text x="16" y="150" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Int8-MAC: Produkt, dann breiter Akkumulator. Signed/Unsigned und Saettigung festlegen.</text>
<text x="16" y="178" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Beispiel: 20 * 20 passt nicht in int8. Akkumulator hier int32.</text>
<text x="16" y="214" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Ein neuer MAC je Takt ist ein Initiationsintervall, nicht die Ergebnis-Latenz.</text>
<text x="16" y="246" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Zwei Speicherbusse helfen nur ohne Bankkonflikt.</text>
<text x="16" y="274" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Zero-Overhead-Loop entfernt den Schleifenzweig, nicht jeden Daten-Stall.</text>
<text x="16" y="310" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">SIMD, RVV und NPU sind kombinierbar, keine Pflicht-Reihenfolge.</text>
<text x="16" y="338" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Die letzten beiden Lanes zeigen Wrap ohne Saettigung beziehungsweise den Saettigungsfall als Alternative.</text>
</svg>
