<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="298" viewBox="0 0 1000 298" role="img" aria-labelledby="title">
<title id="title">Formen des Dense-Lehrbeispiels</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="298" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Tensorform: Elemente und Parameter getrennt betrachten</text>
<rect x="20" y="100" width="210" height="105" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="125.0" y="145.5" font-size="24" fill="#1D1D1F" text-anchor="middle">x: 3 Eingänge</text>
<text x="125.0" y="175.5" font-size="24" fill="#1D1D1F" text-anchor="middle">[2, 1, 3]</text>
<rect x="270" y="100" width="300" height="105" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="420.0" y="145.5" font-size="24" fill="#1D1D1F" text-anchor="middle">W: 2 × 3 Gewichte</text>
<text x="420.0" y="175.5" font-size="24" fill="#1D1D1F" text-anchor="middle">b: 2 Biaswerte</text>
<rect x="650" y="100" width="300" height="105" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="800.0" y="145.5" font-size="24" fill="#1D1D1F" text-anchor="middle">y: 2 Ausgänge</text>
<text x="800.0" y="175.5" font-size="24" fill="#1D1D1F" text-anchor="middle">[14, 9]</text>
<line x1="230" y1="152" x2="265" y2="152" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="570" y1="152" x2="645" y2="152" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="265" font-size="24" fill="#1D1D1F" text-anchor="middle">6 Gewichte + 2 Bias = 8 Parameter · x und y sind Aktivierungen</text>
</svg>
