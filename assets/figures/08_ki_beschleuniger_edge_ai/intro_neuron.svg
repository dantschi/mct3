<text x="500" y="32" font-size="27" fill="#1D1D1F" text-anchor="middle">Eine Recheneinheit: gewichten, summieren, aktivieren</text><line x1="172" y1="131" x2="398" y2="194" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="172" y1="269" x2="398" y2="206" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="435" y1="113" x2="435" y2="157" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="473" y1="200" x2="580" y2="200" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="763" y1="200" x2="845" y2="200" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="135" cy="120" r="37" fill="#FFFFFF" stroke="#656D76" stroke-width="2.5"/><text x="135" y="128" font-size="25" fill="#1D1D1F" text-anchor="middle">2</text><circle cx="135" cy="280" r="37" fill="#FFFFFF" stroke="#656D76" stroke-width="2.5"/><text x="135" y="288" font-size="25" fill="#1D1D1F" text-anchor="middle">−1</text><circle cx="435" cy="82" r="30" fill="#FFFFFF" stroke="#656D76" stroke-width="2.5"/><text x="435" y="90" font-size="25" fill="#1D1D1F" text-anchor="middle">−1</text><circle cx="435" cy="200" r="43" fill="#FFFFFF" stroke="#656D76" stroke-width="2.5"/><text x="435" y="208" font-size="25" fill="#1D1D1F" text-anchor="middle">Σ</text><circle cx="890" cy="200" r="43" fill="#FFFFFF" stroke="#E2001A" stroke-width="2.5"/><text x="890" y="208" font-size="25" fill="#1D1D1F" text-anchor="middle">1</text><text x="135" y="62" font-size="23" fill="#1D1D1F" text-anchor="middle">x₀</text><text x="135" y="342" font-size="23" fill="#1D1D1F" text-anchor="middle">x₁</text><text x="270" y="122" font-size="24" fill="#1D1D1F" text-anchor="middle">Gewicht 3</text><text x="268" y="289" font-size="24" fill="#1D1D1F" text-anchor="middle">Gewicht 4</text><text x="540" y="90" font-size="24" fill="#1D1D1F" text-anchor="start">Bias</text><text x="527" y="177" font-size="24" fill="#1D1D1F" text-anchor="middle">z = 1</text><text x="88