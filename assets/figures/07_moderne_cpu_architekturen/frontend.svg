<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
<rect width="1200" height="430" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Vereinfachtes Front-End/Back-End. Breiten sind Annahmen, kein konkreter Kern.</text>
<rect x="16" y="48" width="160" height="58" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="24" y="70" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">Fetch 16 Byte</text>
<text x="24" y="92" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">C-ISA: keine feste Zahl</text>
<rect x="230" y="48" width="160" height="58" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="238" y="70" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">Decode 3</text>
<text x="238" y="92" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Dispatch 3</text>
<rect x="430" y="48" width="160" height="58" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="438" y="70" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">Issue 3</text>
<text x="438" y="92" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">wenn bereit</text>
<rect x="640" y="48" width="160" height="58" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="648" y="70" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">ALU0  ALU1</text>
<text x="648" y="92" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Latenz 1</text>
<rect x="860" y="48" width="160" height="58" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="868" y="70" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">LSU</text>
<text x="868" y="92" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Load/Store</text>
<rect x="1020" y="48" width="160" height="58" fill="#fff" stroke="#6A1B9A" stroke-width="1.4"/>
<text x="1028" y="70" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">Retire 2</text>
<text x="1028" y="92" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Engpass hier</text>
<text x="16" y="140" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">MUL pipelined: Latenz 3 Takte, Initiationsintervall 1. Durchsatz ist nicht 1/Latenz-Wartezeit als Einzelstueck.</text>
<text x="16" y="168" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Ein MUL alle Takte startbar, Ergebnis erst nach 3 Takten. Latenz und Durchsatz getrennt.</text>
<text x="16" y="210" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Belegung, ein Takt, drei unabhaengige Befehle add/add/lw:</text>
<text x="40" y="240" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">ALU0: add    ALU1: add    LSU: lw    Retire-Slots: 2</text>
<text x="16" y="278" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Ausfuehrung koennte 3 schaffen, Retire nur 2. Der ROB fuellt sich. Engpass: Retire-Breite.</text>
<text x="16" y="316" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Ein zweites lw im selben Takt passt nicht: nur eine LSU. Operationstyp begrenzt die Auslastung.</text>
<text x="16" y="354" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Zusaetzliche Ports, Scheduler und Bypassnetze kosten Flaeche und Energie.</text>
<text x="16" y="386" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">16 Fetch-Bytes sind bei komprimierten RISC-V-Befehlen keine feste Instruktionszahl.</text>
<text x="16" y="416" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Aktivitaet alpha, Kapazitaet C, Spannung V, Frequenz f. Keine feste GHz-Mauer aus diesem Modell.</text>
</svg>
