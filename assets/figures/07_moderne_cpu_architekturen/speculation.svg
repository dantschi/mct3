<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="408" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Fehlvorhersage · Architekturzustand und interne Spur unterscheiden</text>
<text x="20" y="139" font-size="24" fill="#1D1D1F" text-anchor="start">Architektur</text>
<text x="20" y="284" font-size="24" fill="#1D1D1F" text-anchor="start">Cache</text>
