<text x="332.5" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">vorläufige Werte</text>
<rect x="495" y="95" width="215" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="602.5" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Squash</text>
<rect x="765" y="95" width="215" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="872.5" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">gültige Abbildung</text>
<rect x="225" y="240" width="215" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="332.5" y="288.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Zugriff ausgelöst</text>
