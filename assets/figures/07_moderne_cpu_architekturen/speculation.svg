<line x1="710" y1="280" x2="760" y2="280" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="378" font-size="23" fill="#1D1D1F" text-anchor="middle">Rücknahme normaler Wirkungen löscht nicht pauschal jede Cacheänderung</text>
