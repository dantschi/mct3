<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect width="1200" height="400" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Richtung und Ziel sind getrennt. Index nicht blind die niedrigsten Bits, Ausrichtung beachten.</text>
<rect x="16" y="48" width="200" height="50" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="28" y="78" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Fetch-PC</text>
<rect x="280" y="48" width="280" height="50" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="292" y="78" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">BHT: taken / not taken</text>
<rect x="620" y="48" width="280" height="50" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="632" y="78" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">BTB: Zieladresse</text>
<line x1="216" y1="73" x2="280" y2="73" stroke="#1D1D1F" stroke-width="2"/>
<line x1="560" y1="73" x2="620" y2="73" stroke="#1D1D1F" stroke-width="2"/>
<text x="16" y="130" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">Aliasing, Index PC[4:2]: 0x04 und 0x24 liefern beide 001.</text>
<text x="16" y="158" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Zwei verschiedene Branches koennen denselben Eintrag teilen und sich stoeren.</text>
<text x="16" y="196" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">gshare-Lehrbeispiel, 4 Bit: PC-Index 0101 XOR GHR 0011 = 0110.</text>
<text x="16" y="226" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Globale Historie ist nicht automatisch lokale plus globale Historie.</text>
<text x="16" y="258" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Lokal, global und Hybrid-Auswahl sind verschiedene Modelle.</text>
<text x="16" y="290" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">TAGE und Perceptron sind veroeffentlichte Beispiele, nicht die Implementierung jedes Kerns.</text>
<text x="16" y="322" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Lernen heisst hier ein festes Hardware-Modell, keine allgemeine KI.</text>
<text x="16" y="360" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">BHT/PHT: in diesem Bild ist BHT die Richtungstabelle. Das Ziel liegt nur im BTB.</text>
</svg>
