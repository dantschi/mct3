<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="408" viewBox="0 0 1000 408" role="img" aria-labelledby="title">
<title id="title">Zwei Informationsquellen für die Wahl des nächsten Program Counters</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="408" fill="#FFFFFF"/>
<rect x="20" y="135" width="200" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="120.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Fetch-PC</text>
<rect x="370" y="65" width="260" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="95.5" font-size="24" fill="#1D1D1F" text-anchor="middle">BHT</text>
<text x="500.0" y="125.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Richtung T / NT</text>
<rect x="370" y="235" width="260" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="265.5" font-size="24" fill="#1D1D1F" text-anchor="middle">BTB</text>
<text x="500.0" y="295.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Zieladresse</text>
<rect x="775" y="135" width="205" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="877.5" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">nächster PC</text>
<line x1="220" y1="175" x2="365" y2="102" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="220" y1="175" x2="365" y2="272" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="630" y1="102" x2="770" y2="155" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="630" y1="272" x2="770" y2="197" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="690" y="97" font-size="22" fill="#1D1D1F" text-anchor="middle">Richtung</text>
<text x="704" y="298" font-size="22" fill="#1D1D1F" text-anchor="middle">Ziel bei Taken</text>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Richtung und Ziel sind getrennte Vorhersageinformationen</text>
<text x="500" y="378" font-size="23" fill="#1D1D1F" text-anchor="middle">Fehlt ein passendes Ziel, ist richtiges Taken noch kein kompletter Fetch</text>
</svg>
