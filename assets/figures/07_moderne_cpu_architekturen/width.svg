<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect width="1200" height="400" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Vier unabhaengige ALU-Befehle. ALU-Latenz 1. Fuellung gehoert zum Fenster.</text>
<text x="16" y="46" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">Skalar: Issue und Retire hoechstens 1. Fenster 5 Takte, IPC = 4/5 = 0,8.</text>
<rect x="16" y="64" width="210" height="32" fill="#1565C0" stroke="#1565C0" stroke-width="0.4"/>
<text x="121.0" y="85.76" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">I1 iss</text>
<rect x="246" y="64" width="210" height="32" fill="#1565C0" stroke="#1565C0" stroke-width="0.4"/>
<text x="351.0" y="85.76" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">I2 iss / I1 ret</text>
<rect x="476" y="64" width="210" height="32" fill="#1565C0" stroke="#1565C0" stroke-width="0.4"/>
<text x="581.0" y="85.76" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">I3 iss / I2 ret</text>
<rect x="706" y="64" width="210" height="32" fill="#1565C0" stroke="#1565C0" stroke-width="0.4"/>
<text x="811.0" y="85.76" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">I4 iss / I3 ret</text>
<rect x="936" y="64" width="210" height="32" fill="#1565C0" stroke="#1565C0" stroke-width="0.4"/>
<text x="1041.0" y="85.76" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">I4 ret</text>
<text x="16" y="130" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Zweifach: Issue und Retire hoechstens 2. Fenster 3 Takte, IPC = 4/3 ca. 1,33.</text>
<rect x="16" y="148" width="280" height="32" fill="#E65100" stroke="#E65100" stroke-width="0.4"/>
<text x="156.0" y="169.76" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">I1 I2 iss</text>
<rect x="316" y="148" width="280" height="32" fill="#E65100" stroke="#E65100" stroke-width="0.4"/>
<text x="456.0" y="169.76" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">I3 I4 iss / I1 I2 ret</text>
<rect x="616" y="148" width="280" height="32" fill="#E65100" stroke="#E65100" stroke-width="0.4"/>
<text x="756.0" y="169.76" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">I3 I4 ret</text>
<text x="16" y="220" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">Takt 2 retiriert zwei Befehle. Das mittlere IPC des Fensters ist nicht 2.</text>
<text x="16" y="252" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Nachhaltig mehrere Retires sind etwas anderes als ein einzelner Abschlussburst.</text>
<text x="16" y="290" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Superskalar heisst Multiple Issue, nicht automatisch Out-of-Order.</text>
<text x="16" y="322" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Drei Units garantieren weder drei passende Befehle noch IPC 3.</text>
<text x="16" y="360" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Annahme: keine Abhaengigkeit, keine Cache-Misses, Retire im Takt nach dem Issue.</text>
<text x="16" y="386" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">P_dyn ungefaehr alpha * C * V^2 * f. Leckleistung ist ein eigener Term. Breite ist nicht kostenlos.</text>
</svg>
