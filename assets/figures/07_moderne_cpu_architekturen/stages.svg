<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="283" viewBox="0 0 1000 283" role="img" aria-labelledby="title">
<title id="title">Fünf Funktionen der skalaren Lehrpipeline</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="283" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">M1 · ein Takt je Stufe · nur Funktionen, kein Schaltplan</text>
<rect x="20" y="95" width="160" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="100.0" y="123.0" font-size="24" fill="#1D1D1F" text-anchor="middle">IF</text>
<text x="100.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Befehl</text>
<text x="100.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">holen</text>
<line x1="180" y1="145" x2="215" y2="145" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="220" y="95" width="160" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="300.0" y="123.0" font-size="24" fill="#1D1D1F" text-anchor="middle">ID</text>
<text x="300.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Decode</text>
<text x="300.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Register lesen</text>
<line x1="380" y1="145" x2="415" y2="145" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="420" y="95" width="160" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="123.0" font-size="24" fill="#1D1D1F" text-anchor="middle">EX</text>
<text x="500.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">ALU</text>
<text x="500.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">rechnet</text>
<line x1="580" y1="145" x2="615" y2="145" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="620" y="95" width="160" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="700.0" y="123.0" font-size="24" fill="#1D1D1F" text-anchor="middle">MEM</text>
<text x="700.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Daten</text>
<text x="700.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">zugreifen</text>
<line x1="780" y1="145" x2="815" y2="145" stroke="#E2001A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="820" y="95" width="160" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="900.0" y="123.0" font-size="24" fill="#1D1D1F" text-anchor="middle">WB</text>
<text x="900.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Register</text>
<text x="900.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">schreiben</text>
<text x="500" y="254" font-size="22" fill="#1D1D1F" text-anchor="middle">Ein Befehl braucht fünf Schritte · mehrere Befehle nutzen verschiedene Stufen</text>
