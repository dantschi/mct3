<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="590" viewBox="0 0 1160 590" role="img" aria-labelledby="title">
<title id="title">Zweifachstart mit einem gemeinsamen abhängigen Verbraucher</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1160" height="590" fill="#FFFFFF"/>
<text x="25" y="35" text-anchor="start" font-size="26" fill="#1D1D1F">M2-Variante · zwei passende ALUs und höchstens zwei Starts / Retires je Takt</text>
<text x="540.0" y="82" text-anchor="middle" font-size="27" fill="#1D1D1F">Takt 1</text>
<text x="760.0" y="82" text-anchor="middle" font-size="27" fill="#1D1D1F">Takt 2</text>
<text x="980.0" y="82" text-anchor="middle" font-size="27" fill="#1D1D1F">Takt 3</text>
<text x="25" y="153" text-anchor="start" font-size="27" fill="#1D1D1F">I1: 2 + 3 → t0</text>
<rect x="430" y="110" width="210" height="63" rx="7" fill="#FFFFFF" stroke="#656D76" stroke-width="2"/>
<rect x="650" y="110" width="210" height="63" rx="7" fill="#FFFFFF" stroke="#656D76" stroke-width="2"/>
<rect x="870" y="110" width="210" height="63" rx="7" fill="#FFFFFF" stroke="#656D76" stroke-width="2"/>
<rect x="434" y="114" width="202" height="55" rx="7" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="535.0" y="152" text-anchor="middle" font-size="25" fill="#1D1D1F">Start → Ende</text>
<rect x="654" y="114" width="202" height="55" rx="7" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="755.0" y="152" text-anchor="middle" font-size="25" fill="#E2001A">Retire</text>
<text x="25" y="228" text-anchor="start" font-size="27" fill="#1D1D1F">I2: 4 + 1 → t1</text>
<rect x="430" y="185" width="210" height="63" rx="7" fill="#FFFFFF" stroke="#656D76" stroke-width="2"/>
<rect x="650" y="185" width="210" height="63" rx="7" fill="#FFFFFF" stroke="#656D76" stroke-width="2"/>
<rect x="870" y="185" width="210" height="63" rx="7" fill="#FFFFFF" stroke="#656D76" stroke-width="2"/>
<rect x="434" y="189" width="202" height="55" rx="7" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="535.0" y="227" text-anchor="middle" font-size="25" fill="#1D1D1F">Start → Ende</text>
<rect x="654" y="189" width="202" height="55" rx="7" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="755.0" y="227" text-anchor="middle" font-size="25" fill="#E2001A">Retire</text>
<text x="25" y="303" text-anchor="start" font-size="27" fill="#1D1D1F">I3: t0 + t1 → t2</text>
<rect x="430" y="260" width="210" height="63" rx="7" fill="#FFFFFF" stroke="#656D76" stroke-width="2"/>
<rect x="650" y="260" width="210" height="63" rx="7" fill="#FFFFFF" stroke="#656D76" stroke-width="2"/>
<rect x="870" y="260" width="210" height="63" rx="7" fill="#FFFFFF" stroke="#656D76" stroke-width="2"/>
<rect x="654" y="264" width="202" height="55" rx="7" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="755.0" y="302" text-anchor="middle" font-size="25" fill="#1D1D1F">Start → Ende</text>
<rect x="874" y="264" width="202" height="55" rx="7" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="975.0" y="302" text-anchor="middle" font-size="25" fill="#E2001A">Retire</text>
<text x="25" y="378" text-anchor="start" font-size="27" fill="#1D1D1F">I4: 6 XOR 3 → t3</text>
<rect x="430" y="335" width="210" height="63" rx="7" fill="#FFFFFF" stroke="#656D76" stroke-width="2"/>
<rect x="650" y="335" width="210" height="63" rx="7" fill="#FFFFFF" stroke="#656D76" stroke-width="2"/>
<rect x="870" y="335" width="210" height="63" rx="7" fill="#FFFFFF" stroke="#656D76" stroke-width="2"/>
<rect x="654" y="339" width="202" height="55" rx="7" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="755.0" y="377" text-anchor="middle" font-size="25" fill="#1D1D1F">Start → Ende</text>
<rect x="874" y="339" width="202" height="55" rx="7" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="975.0" y="377" text-anchor="middle" font-size="25" fill="#E2001A">Retire</text>
<text x="25" y="465" text-anchor="start" font-size="26" fill="#1D1D1F">I3 startet erst, wenn beide Werte 5 seit Ende Takt 1 bereitliegen.</text>
<text x="25" y="513" text-anchor="start" font-size="25" fill="#1D1D1F">Ergebnisse: t0 = 5, t1 = 5, t2 = 10, t3 = 5; letzter Retire in Takt 3.</text>
<text x="25" y="560" text-anchor="start" font-size="23" fill="#656D76">Start am Taktbeginn · Fertigstellung am Taktende · Retire frühestens im Folgetakt</text>
</svg>
