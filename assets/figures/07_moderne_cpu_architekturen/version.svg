<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="413" viewBox="0 0 1000 413" role="img" aria-labelledby="title">
<title id="title">Gespeicherter Quelltag statt späterem Blick auf die neueste Abbildung</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="413" fill="#FFFFFF"/>
<rect x="20" y="90" width="270" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="155.0" y="125.5" font-size="24" fill="#1D1D1F" text-anchor="middle">P10 = 10</text>
<text x="155.0" y="155.5" font-size="24" fill="#1D1D1F" text-anchor="middle">alte t0-Version</text>
<rect x="20" y="245" width="270" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="155.0" y="280.5" font-size="24" fill="#1D1D1F" text-anchor="middle">P12 = 5</text>
<text x="155.0" y="310.5" font-size="24" fill="#1D1D1F" text-anchor="middle">neue t0-Version</text>
<rect x="690" y="90" width="290" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="835.0" y="125.5" font-size="24" fill="#1D1D1F" text-anchor="middle">B behält P10</text>
<text x="835.0" y="155.5" font-size="24" fill="#1D1D1F" text-anchor="middle">10 + 1 = 11</text>
<rect x="690" y="245" width="290" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="835.0" y="280.5" font-size="24" fill="#1D1D1F" text-anchor="middle">D nutzt P12</text>
<text x="835.0" y="310.5" font-size="24" fill="#1D1D1F" text-anchor="middle">5 AND 7 = 5</text>
<line x1="290" y1="132" x2="685" y2="132" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="290" y1="287" x2="685" y2="287" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Aktuelle Abbildung t0 → P12 · alter Leser wird nicht umgebogen</text>
<text x="500" y="385" font-size="23" fill="#1D1D1F" text-anchor="middle">P10 bleibt geschützt, solange ein alter Nutzer oder Rückweg es benötigt</text>
</svg>
