<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="307" viewBox="0 0 1000 307" role="img" aria-labelledby="title">
<title id="title">Vorläufiger Store, Freigabe durch Commit und spätere Weitergabe</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="307" fill="#FFFFFF"/>
<rect x="20" y="105" width="195" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="117.5" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Adresse und Daten</text>
<text x="117.5" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">vorbereiten</text>
<rect x="275" y="105" width="195" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="372.5" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Store-Queue</text>
<text x="372.5" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">noch vorläufig</text>
<rect x="530" y="105" width="195" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="627.5" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Commit</text>
<text x="627.5" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">geordnet freigeben</text>
<rect x="785" y="105" width="195" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="882.5" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Cache / Speicher</text>
<text x="882.5" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">später weitergeben</text>
<line x1="215" y1="155" x2="270" y2="155" stroke="#1D1D1F" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="470" y1="155" x2="525" y2="155" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="725" y1="155" x2="780" y2="155" stroke="#1D1D1F" stroke-width="3" marker-end="url(#arrow)"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Store: Fertigstellung, Bestätigung und Speicherweg unterscheiden</text>
<text x="500" y="277" font-size="23" fill="#1D1D1F" text-anchor="middle">Externe Sichtbarkeit hängt zusätzlich von Cache und Speichervertrag ab</text>
</svg>
