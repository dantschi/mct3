<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<rect width="1200" height="360" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Aelterer Store, juengerer Load. Adressalias zuerst unbekannt. Eine Zusatzfolie.</text>
<rect x="16" y="48" width="360" height="120" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="28" y="74" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">Adressen verschieden</text>
<text x="28" y="102" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Load darf unabhaengig laufen</text>
<text x="28" y="128" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">kein Replay</text>
<rect x="400" y="48" width="360" height="120" fill="#fff" stroke="#B71C1C" stroke-width="1.4"/>
<text x="412" y="74" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Dieselbe Adresse</text>
<text x="412" y="102" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Store-to-Load oder Replay</text>
<text x="412" y="128" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Renaming loest das nicht</text>
<rect x="790" y="48" width="380" height="120" fill="#fff" stroke="#6A1B9A" stroke-width="1.4"/>
<text x="802" y="74" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">Drei Schritte</text>
<text x="802" y="102" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">1 Store-Queue</text>
<text x="802" y="126" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">2 Commit-Freigabe</text>
<text x="802" y="150" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">3 Memory-Drain</text>
<text x="16" y="200" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Spekulative Stores duerfen nicht beliebig MMIO ausloesen.</text>
<text x="16" y="230" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Kein Commit heisst nicht: der Cache bleibt ohne Seiteneffekt. Seitenkanaele sind ein anderes Thema.</text>
<text x="16" y="262" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Unbekannte Aliasbeziehung: der Load wartet oder wird bei Konflikt wiederholt.</text>
<text x="16" y="294" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Register-Retire und sichtbarer Speicher sind nicht dasselbe Ereignis.</text>
<text x="16" y="330" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Modellannahme: eine LSU, eine Store-Queue, keine konkrete BOOM-Konfiguration.</text>
</svg>
