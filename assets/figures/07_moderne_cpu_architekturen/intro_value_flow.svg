<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="605" viewBox="0 0 1160 605" role="img" aria-labelledby="title">
<title id="title">Zwei unabhängige Additionen und ihr gemeinsamer Verbraucher</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1160" height="605" fill="#FFFFFF"/>
<text x="25" y="35" text-anchor="start" font-size="27" fill="#1D1D1F">Zwei Summen können unabhängig entstehen; ihre Weiterverarbeitung wartet.</text>
<rect x="35" y="95" width="110" height="65" rx="7" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="90" y="138" text-anchor="middle" font-size="31" fill="#1D1D1F">2</text>
<rect x="35" y="205" width="110" height="65" rx="7" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="90" y="248" text-anchor="middle" font-size="31" fill="#1D1D1F">3</text>
<rect x="35" y="345" width="110" height="65" rx="7" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="90" y="388" text-anchor="middle" font-size="31" fill="#1D1D1F">4</text>
<rect x="35" y="455" width="110" height="65" rx="7" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="90" y="498" text-anchor="middle" font-size="31" fill="#1D1D1F">1</text>
<rect x="325" y="135" width="170" height="80" rx="7" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="410" y="184" text-anchor="middle" font-size="27" fill="#1D1D1F">Addition</text>
<rect x="640" y="135" width="110" height="80" rx="7" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="695" y="187" text-anchor="middle" font-size="31" fill="#1D1D1F">5</text>
<polyline points="495,175 630,175" fill="none" stroke="#1D1D1F" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="325" y="385" width="170" height="80" rx="7" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="410" y="434" text-anchor="middle" font-size="27" fill="#1D1D1F">Addition</text>
<rect x="640" y="385" width="110" height="80" rx="7" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="695" y="437" text-anchor="middle" font-size="31" fill="#1D1D1F">5</text>
<polyline points="495,425 630,425" fill="none" stroke="#1D1D1F" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="145,127 235,127 235,155 315,155" fill="none" stroke="#1D1D1F" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="145,237 235,237 235,195 315,195" fill="none" stroke="#1D1D1F" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="145,377 235,377 235,405 315,405" fill="none" stroke="#1D1D1F" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="145,487 235,487 235,445 315,445" fill="none" stroke="#1D1D1F" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="750,175 810,175 810,300 855,300" fill="none" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="750,425 810,425 810,335 855,335" fill="none" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="865" y="280" width="170" height="80" rx="7" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="950" y="330" text-anchor="middle" font-size="27" fill="#1D1D1F">5 + 5 = 10</text>
<text x="25" y="575" text-anchor="start" font-size="24" fill="#656D76">Pfeile tragen Werte: gleiche Zahlen bedeuten nicht dieselbe Abhängigkeit.</text>
</svg>
