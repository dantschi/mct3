<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title">
<title id="title">Indexalias und getrenntes Vier-Bit-gshare-Beispiel</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="410" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Oberes Modell: 8 Einträge, Index aus PC[4:2]</text>
<rect x="20" y="75" width="260" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="150.0" y="115.5" font-size="24" fill="#1D1D1F" text-anchor="middle">PC 0x04 → 001</text>
<rect x="20" y="170" width="260" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="150.0" y="210.5" font-size="24" fill="#1D1D1F" text-anchor="middle">PC 0x24 → 001</text>
<rect x="525" y="120" width="330" height="75" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="690.0" y="165.5" font-size="24" fill="#1D1D1F" text-anchor="middle">BHT-Eintrag 1</text>
<line x1="280" y1="107" x2="520" y2="140" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="280" y1="202" x2="520" y2="176" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="20" y="285" font-size="24" fill="#1D1D1F" text-anchor="start">Anderes Modell: gshare mit vier Bits</text>
<rect x="20" y="320" width="210" height="55" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="125.0" y="355.5" font-size="24" fill="#1D1D1F" text-anchor="middle">PC-Index 0101</text>
<rect x="340" y="320" width="270" height="55" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="475.0" y="355.5" font-size="24" fill="#1D1D1F" text-anchor="middle">XOR GHR 0011</text>
<rect x="780" y="320" width="200" height="55" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="880.0" y="355.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Index 0110</text>
<line x1="230" y1="347" x2="335" y2="347" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="610" y1="347" x2="775" y2="347" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
