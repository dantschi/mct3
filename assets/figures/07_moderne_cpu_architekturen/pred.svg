<text x="16" y="416" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">1-Bit, warm auf T: der Ausgang kippt auf N, der naechste Einstieg ist der zweite Miss.</text>
<text x="16" y="444" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Kaltstart und sehr kurze Schleifen koennen andere Trefferzahlen liefern.</text>
<text x="16" y="472" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Aufgabe: Start 01, erstes Ergebnis T. Vorhersage ist N, Folgezustand 10. Loesung in den Notizen.</text>
<text x="16" y="500" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Nachgerechnete Misses in den zehn Schritten ab 11: 2.</text>
