<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="371" viewBox="0 0 1000 371" role="img" aria-labelledby="title">
<title id="title">Zwei unabhängige Summen vor einem gemeinsamen Verbraucher</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="371" fill="#FFFFFF"/>
<rect x="20" y="65" width="235" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="137.5" y="108.0" font-size="24" fill="#1D1D1F" text-anchor="middle">bereite Operanden</text>
<rect x="20" y="215" width="235" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="137.5" y="258.0" font-size="24" fill="#1D1D1F" text-anchor="middle">andere Operanden</text>
<rect x="370" y="65" width="240" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="490.0" y="108.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Summe 1</text>
<rect x="370" y="215" width="240" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="490.0" y="258.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Summe 2</text>
<rect x="765" y="140" width="215" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="872.5" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Gesamtsumme</text>
<line x1="255" y1="100" x2="365" y2="100" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="255" y1="250" x2="365" y2="250" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="610" y1="100" x2="760" y2="160" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="610" y1="250" x2="760" y2="190" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Unabhängige Summen · gemeinsamer Verbraucher wartet auf beide</text>
<text x="500" y="343" font-size="23" fill="#1D1D1F" text-anchor="middle">Wertabhängigkeiten bestimmen, welche Arbeit zusammen möglich ist</text>
</svg>
