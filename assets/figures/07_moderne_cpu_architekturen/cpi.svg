<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect width="1200" height="420" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Annahmen: 20 Prozent Branches, 10 Prozent davon falsch, Penalty 15, Basis-CPI 1. Keine Ueberlappung.</text>
<text x="16" y="44" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Aufschlag 0,20 * 0,10 * 15 = 0,30. CPI = 1,30.</text>
<rect x="16" y="64" width="360" height="70" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="28" y="90" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">Laufzeit * 1,30</text>
<text x="28" y="116" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">30 Prozent laenger, gleiches N und f</text>
<rect x="400" y="64" width="420" height="70" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="412" y="90" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">Durchsatz * 0,769</text>
<text x="412" y="116" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">etwa 23,1 Prozent weniger Durchsatz</text>
<text x="16" y="160" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Richtig vorhergesagt</text>
<text x="16" y="190" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Falsch</text>
<rect x="120" y="142" width="60" height="24" fill="#1B5E20" stroke="#1B5E20" stroke-width="0.4"/>
<text x="150.0" y="158.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Br</text>
<rect x="190" y="142" width="60" height="24" fill="#1B5E20" stroke="#1B5E20" stroke-width="0.4"/>
<text x="220.0" y="158.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">S1</text>
<rect x="260" y="142" width="60" height="24" fill="#1B5E20" stroke="#1B5E20" stroke-width="0.4"/>
<text x="290.0" y="158.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">S2</text>
<rect x="330" y="142" width="60" height="24" fill="#1B5E20" stroke="#1B5E20" stroke-width="0.4"/>
<text x="360.0" y="158.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">S3</text>
<rect x="400" y="142" width="60" height="24" fill="#1B5E20" stroke="#1B5E20" stroke-width="0.4"/>
<text x="430.0" y="158.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">ok</text>
<rect x="120" y="176" width="60" height="24" fill="#1565C0" stroke="#1565C0" stroke-width="0.4"/>
<text x="150.0" y="192.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Br</text>
<rect x="190" y="176" width="60" height="24" fill="#B71C1C" stroke="#B71C1C" stroke-width="0.4"/>
<text x="220.0" y="192.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">S1</text>
<rect x="260" y="176" width="60" height="24" fill="#B71C1C" stroke="#B71C1C" stroke-width="0.4"/>
<text x="290.0" y="192.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">S2</text>
<rect x="330" y="176" width="60" height="24" fill="#B71C1C" stroke="#B71C1C" stroke-width="0.4"/>
<text x="360.0" y="192.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">aufl.</text>
<rect x="400" y="176" width="60" height="24" fill="#1565C0" stroke="#1565C0" stroke-width="0.4"/>
<text x="430.0" y="192.32" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">neu</text>
<text x="16" y="230" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Ein Treffer ist nicht automatisch kostenlos: Target und Fetch-Bandbreite bleiben.</text>
<text x="16" y="258" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Die Penalty haengt von Aufloesung und Front-End ab, nicht nur von der Stufenzahl.</text>
<text x="16" y="290" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Renaming entfernt WAR/WAW, nicht jede Datenabhaengigkeit und nicht den Branch.</text>
<text x="16" y="322" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Die Kurve CPI = 1 + 0,20 * m * 15 ist ein Modell ueber die Fehlrate m, keine Messung.</text>
<text x="16" y="354" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">1/1,30 = 0,76923. Nicht 23 Prozent laenger.</text>
<text x="16" y="390" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Spekulative Kaestchen sind der falsche Pfad und werden verworfen, nicht retired.</text>
</svg>
