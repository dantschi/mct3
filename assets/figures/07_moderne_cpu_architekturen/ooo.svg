<text x="16" y="42" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">I1 lw Miss, Daten in Takt 4 bereit, Nutzer fruehestens Takt 5. ALU-Latenz 1. Retire-Breite OoO: 2.</text>
