<text x="16" y="430" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">I3 und I4 sind frueh fertig, duerfen vor I1 nicht retiren. Der Miss wird ueberlappt, nicht geloescht.</text>
<text x="16" y="456" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Takt 3: beide ALU ungenutzt. Ein voller ROB wuerde spaeter auch unabhaengige Arbeit stoppen.</text>
<text x="16" y="484" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Werte: mem=10, t2=1, t4=8, t5=3, t7=15, t8=3. Ergebnisse t0=10, t1=11, t3=5, t6=3.</text>
<text x="16" y="508" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Dieses In-Order-Stauverhalten ist die Lehrannahme, nicht jeder reale In-Order-Kern.</text>
