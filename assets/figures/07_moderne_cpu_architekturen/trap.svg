<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="354" viewBox="0 0 1000 354" role="img" aria-labelledby="title">
<title id="title">Präziser Ausnahmezustand ohne normale jüngere Bestätigung</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="354" fill="#FFFFFF"/>
<rect x="20" y="105" width="200" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="120.0" y="140.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Vorgänger</text>
<text x="120.0" y="170.5" font-size="24" fill="#1D1D1F" text-anchor="middle">bestätigt</text>
<rect x="290" y="105" width="200" height="85" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="390.0" y="140.5" font-size="24" fill="#1D1D1F" text-anchor="middle">A: Loadfehler</text>
<text x="390.0" y="170.5" font-size="24" fill="#1D1D1F" text-anchor="middle">kein Retire</text>
<rect x="560" y="105" width="210" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="665.0" y="140.5" font-size="24" fill="#1D1D1F" text-anchor="middle">B, C, D</text>
<text x="665.0" y="170.5" font-size="24" fill="#1D1D1F" text-anchor="middle">nicht bestätigen</text>
<rect x="835" y="105" width="145" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="907.5" y="140.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Trap</text>
<text x="907.5" y="170.5" font-size="24" fill="#1D1D1F" text-anchor="middle">bei A</text>
<line x1="220" y1="147" x2="285" y2="147" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="490" y1="147" x2="555" y2="147" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="770" y1="147" x2="830" y2="147" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Fehlervariante · A erreicht den Kopf mit einem Zugriffsfehler</text>
<text x="500" y="270" font-size="24" fill="#1D1D1F" text-anchor="middle">Architektur: t0 = 42, t1 = 9, t6 = 12 bleiben erhalten</text>
<text x="500" y="325" font-size="23" fill="#1D1D1F" text-anchor="middle">Fertige jüngere Werte dürfen intern existieren, ohne sichtbar zu werden</text>
</svg>
