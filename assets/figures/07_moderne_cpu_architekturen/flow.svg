<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="313" viewBox="0 0 1000 313" role="img" aria-labelledby="title">
<title id="title">Geordnete Vorbereitung, dynamischer Start und geordnete Bestätigung</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="313" fill="#FFFFFF"/>
<rect x="20" y="110" width="195" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="117.5" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Fetch / Decode</text>
<text x="117.5" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">geordnet</text>
<rect x="275" y="110" width="195" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="372.5" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Vorbereitung</text>
<text x="372.5" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Quellen / Ziele</text>
<rect x="530" y="110" width="195" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="627.5" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Auswahl / Execute</text>
<text x="627.5" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">nach Bereitschaft</text>
<rect x="785" y="110" width="195" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="882.5" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Retire</text>
<text x="882.5" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">geordnet</text>
<line x1="215" y1="160" x2="270" y2="160" stroke="#1D1D1F" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="470" y1="160" x2="525" y2="160" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="725" y1="160" x2="780" y2="160" stroke="#1D1D1F" stroke-width="3" marker-end="url(#arrow)"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Drei Rollen · Vorbereitung, dynamische Ausführung, Bestätigung</text>
<text x="500" y="285" font-size="23" fill="#1D1D1F" text-anchor="middle">Startreihenfolge darf sich ändern · sichtbare Wirkungen bleiben korrekt</text>
</svg>
