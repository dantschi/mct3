<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title">
<title id="title">Vier gespeicherte Quellversionen und vier getrennte neue Ziele</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="420" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Quellen aus alter Abbildung lesen · neues Ziel anschließend eintragen</text>
<text x="50" y="77" font-size="23" fill="#1D1D1F" text-anchor="start">Befehl</text>
<text x="290" y="77" font-size="23" fill="#1D1D1F" text-anchor="start">Quellen</text>
<text x="660" y="77" font-size="23" fill="#1D1D1F" text-anchor="start">neues Ziel</text>
<rect x="30" y="95" width="930" height="46" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="50" y="126" font-size="23" fill="#1D1D1F" text-anchor="start">A: Load t0</text>
<text x="290" y="126" font-size="23" fill="#1D1D1F" text-anchor="start">s1 → P9</text>
<text x="660" y="126" font-size="23" fill="#1D1D1F" text-anchor="start">t0 → P10</text>
<rect x="30" y="147" width="930" height="46" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="50" y="178" font-size="23" fill="#1D1D1F" text-anchor="start">B: Add t1</text>
<text x="290" y="178" font-size="23" fill="#1D1D1F" text-anchor="start">t0 → P10, t2 → P2</text>
<text x="660" y="178" font-size="23" fill="#1D1D1F" text-anchor="start">t1 → P11</text>
<rect x="30" y="199" width="930" height="46" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="50" y="230" font-size="23" fill="#1D1D1F" text-anchor="start">C: Sub t0</text>
<text x="290" y="230" font-size="23" fill="#1D1D1F" text-anchor="start">t4 → P4, t5 → P5</text>
<text x="660" y="230" font-size="23" fill="#1D1D1F" text-anchor="start">t0 → P12</text>
<rect x="30" y="251" width="930" height="46" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="50" y="282" font-size="23" fill="#1D1D1F" text-anchor="start">D: AND t6</text>
<text x="290" y="282" font-size="23" fill="#1D1D1F" text-anchor="start">t0 → P12, t3 → P3</text>
<text x="660" y="282" font-size="23" fill="#1D1D1F" text-anchor="start">t6 → P13</text>
<text x="20" y="345" font-size="23" fill="#1D1D1F" text-anchor="start">Aktuelle t0-Abbildung:</text>
<rect x="390" y="313" width="120" height="50" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="450.0" y="346.0" font-size="24" fill="#1D1D1F" text-anchor="middle">P7</text>
<rect x="590" y="313" width="120" height="50" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="650.0" y="346.0" font-size="24" fill="#1D1D1F" text-anchor="middle">P10</text>
<rect x="790" y="313" width="120" height="50" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="850.0" y="346.0" font-size="24" fill="#1D1D1F" text-anchor="middle">P12</text>
<line x1="510" y1="338" x2="585" y2="338" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="710" y1="338" x2="785" y2="338" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="552" y="393" font-size="22" fill="#1D1D1F" text-anchor="middle">A</text>
<text x="752" y="393" font-size="22" fill="#1D1D1F" text-anchor="middle">C</text>
</svg>
