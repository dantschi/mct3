<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
<rect width="1200" height="460" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">PRF-Modell. Map-Update beim Rename ist nicht der Commit. x0 bekommt kein Ziel.</text>
<text x="16" y="42" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Startmap: t0=P0 t1=P1=4 t2=P2=1 t3=P3 t4=P4=2 t5=P5=9 t6=P6=1. Frei: P10, P11, P13.</text>
<text x="16" y="78" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Instr</text>
<text x="200" y="78" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">log. Q</text>
<text x="340" y="78" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">phys. Q</text>
<text x="500" y="78" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">neues Ziel</text>
<text x="680" y="78" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Map danach</text>
<text x="900" y="78" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Wert</text>
<text x="16" y="108" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">A add t0,t1,t2</text>
<text x="200" y="108" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">t1,t2</text>
<text x="340" y="108" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">P1,P2</text>
<text x="500" y="108" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">P10</text>
<text x="680" y="108" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">t0->P10</text>
<text x="900" y="108" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">P10=5</text>
<text x="16" y="144" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">B add t3,t0,t4</text>
<text x="200" y="144" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">t0,t4</text>
<text x="340" y="144" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">P10,P4</text>
<text x="500" y="144" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">P13</text>
<text x="680" y="144" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">t3->P13</text>
<text x="900" y="144" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">P13=7</text>
<text x="16" y="180" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">C sub t0,t5,t6</text>
<text x="200" y="180" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">t5,t6</text>
<text x="340" y="180" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">P5,P6</text>
<text x="500" y="180" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">P11</text>
<text x="680" y="180" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">t0->P11</text>
<text x="900" y="180" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">P11=8</text>
<text x="16" y="216" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">E add t1,t0,t2</text>
<text x="200" y="216" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">t0,t2</text>
<text x="340" y="216" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">P11,P2</text>
<text x="500" y="216" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">P14</text>
<text x="680" y="216" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">t1->P14</text>
<text x="900" y="216" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">liest P11</text>
<text x="16" y="252" font-size="14" font-weight="600" fill="#00838F" text-anchor="start">F sub t0,t4,t5</text>
<text x="200" y="252" font-size="14" font-weight="600" fill="#00838F" text-anchor="start">t4,t5</text>
<text x="340" y="252" font-size="14" font-weight="600" fill="#00838F" text-anchor="start">P4,P5</text>
<text x="500" y="252" font-size="14" font-weight="600" fill="#00838F" text-anchor="start">P12</text>
<text x="680" y="252" font-size="14" font-weight="600" fill="#00838F" text-anchor="start">t0->P12</text>
<text x="900" y="252" font-size="14" font-weight="600" fill="#00838F" text-anchor="start">WAR weg</text>
<text x="16" y="300" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">B liest die alte Version P10=5. C schreibt die neue Version P11=8. B sieht P11 nicht.</text>
<text x="16" y="330" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">E liest t0 als P11. F erhaelt ein neues t0=P12. Das ist WAR, kein gemeinsames Ziel.</text>
<text x="16" y="362" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Freigabe des alten physischen Registers erst nach Commit, wenn kein aelterer Leser bleibt.</text>
<text x="16" y="392" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Recovery stellt die gueltige Map wieder her. Nicht alle physischen Werte werden geloescht.</text>
<text x="16" y="424" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Zwei freie ALUs sind zusaetzlich noetig. Renaming allein erzwingt kein gemeinsames Issue.</text>
<text x="16" y="448" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">P10/P11 bleiben die Versionsnamen in den folgenden Folien.</text>
</svg>
