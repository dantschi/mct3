<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="408" viewBox="0 0 1000 408" role="img" aria-labelledby="title">
<title id="title">Speicheralias und Wertfolge trotz verschiedener Registernamen</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="408" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Verschiedene Basisregisternamen garantieren keine verschiedenen Orte</text>
<text x="20" y="70" font-size="23" fill="#1D1D1F" text-anchor="start">a0 ≠ a1: verschiedene Speicherstellen</text>
<rect x="20" y="95" width="180" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="110.0" y="133.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Store via a0</text>
<rect x="285" y="95" width="160" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="365.0" y="133.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Ort A</text>
<rect x="540" y="95" width="160" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="620.0" y="133.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Ort B</text>
<rect x="790" y="95" width="190" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="885.0" y="133.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Load via a1</text>
<line x1="200" y1="125" x2="280" y2="125" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="700" y1="125" x2="785" y2="125" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="225" font-size="23" fill="#1D1D1F" text-anchor="start">a0 = a1: gleiche Speicherstelle</text>
<rect x="20" y="255" width="180" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="110.0" y="293.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Store via a0</text>
<rect x="395" y="255" width="210" height="60" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="500.0" y="293.0" font-size="24" fill="#1D1D1F" text-anchor="middle">gemeinsamer Ort</text>
<rect x="790" y="255" width="190" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="885.0" y="293.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Load via a1</text>
<line x1="200" y1="285" x2="390" y2="285" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="605" y1="285" x2="785" y2="285" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="380" font-size="22" fill="#1D1D1F" text-anchor="middle">Bei gleicher Adresse muss der jüngere Load den richtigen Storewert erhalten</text>
</svg>
