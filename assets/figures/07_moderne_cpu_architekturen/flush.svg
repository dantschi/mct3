<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="385" viewBox="0 0 1000 385" role="img" aria-labelledby="title">
<title id="title">Falscher Pfad, Verwerfen und erneute Lieferung des richtigen Pfads</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="385" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Schematische Zeit · keine gemessene Taktzahl</text>
<text x="20" y="109" font-size="23" fill="#1D1D1F" text-anchor="start">Branch geholt</text>
<text x="640" y="109" font-size="23" fill="#1D1D1F" text-anchor="start">Entscheidung</text>
<rect x="210" y="145" width="150" height="70" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="285.0" y="185" font-size="22" fill="#1D1D1F" text-anchor="middle">falscher Pfad 1</text>
<rect x="370" y="145" width="115" height="70" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="427.5" y="185" font-size="22" fill="#1D1D1F" text-anchor="middle">Pfad 2</text>
<rect x="500" y="145" width="115" height="70" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="557.5" y="185" font-size="22" fill="#1D1D1F" text-anchor="middle">Pfad 3</text>
<line x1="630" y1="125" x2="630" y2="283" stroke="#E2001A" stroke-width="3"/>
<rect x="670" y="235" width="300" height="55" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="820" y="271" font-size="23" fill="#1D1D1F" text-anchor="middle">richtiger Pfad wird gefüllt</text>
<line x1="210" y1="320" x2="970" y2="320" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="970" y="356" font-size="22" fill="#1D1D1F" text-anchor="end">Zeit →</text>
<text x="20" y="268" font-size="23" fill="#1D1D1F" text-anchor="start">jüngere Arbeit verwerfen</text>
</svg>
