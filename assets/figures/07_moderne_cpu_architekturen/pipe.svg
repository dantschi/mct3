<text x="16" y="250" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Stationaer ab Takt 5: ein WB je Takt. Davor Fuellung, danach Leerung.</text>
<text x="16" y="278" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">ALU-RAW ohne Forwarding, WB und ID im selben Takt: +2 Takte, 11 Takte, CPI = 2,2.</text>
<text x="16" y="310" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">IPC = retired ISA-Befehle / Takte des Fensters = 5/9. Nicht aus einem einzelnen WB schliessen.</text>
<text x="16" y="342" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">CPI = 1/IPC nur fuer denselben Zeitraum und dieselbe Zaehlbasis.</text>
<text x="16" y="374" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">T = N * CPI / f gilt bei konstanter Frequenz. Ein Compiler kann N aendern.</text>
<text x="16" y="406" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Micro-Ops zaehlen hier nicht als ISA-IPC.</text>
