<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="407" viewBox="0 0 1000 407" role="img" aria-labelledby="title">
<title id="title">Auswahl eines bereiten Kandidaten mit passender freier Einheit</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="407" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Vor A-Abschluss · ein freier ALU-Start · B und D warten</text>
<rect x="30" y="75" width="370" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="215.0" y="115.5" font-size="24" fill="#1D1D1F" text-anchor="middle">B: P10 fehlt</text>
<rect x="30" y="170" width="370" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="215.0" y="210.5" font-size="24" fill="#1D1D1F" text-anchor="middle">C: Quellen bereit</text>
<rect x="30" y="265" width="370" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="215.0" y="305.5" font-size="24" fill="#1D1D1F" text-anchor="middle">D: P12 fehlt</text>
<rect x="700" y="170" width="270" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="835.0" y="210.5" font-size="24" fill="#1D1D1F" text-anchor="middle">freie ALU</text>
<line x1="400" y1="202" x2="695" y2="202" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="550" y="173" font-size="23" fill="#1D1D1F" text-anchor="middle">C auswählen</text>
<text x="500" y="379" font-size="23" fill="#1D1D1F" text-anchor="middle">Nach C-Ende wird P12 bereit · D ist dann ein Kandidat</text>
</svg>
