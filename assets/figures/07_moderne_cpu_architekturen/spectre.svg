<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="348" viewBox="0 0 1000 348" role="img" aria-labelledby="title">
<title id="title">Wertabhängiger Probezugriff als mögliche Cache-Seitenkanalspur</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="348" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Spectre-v1-Prinzip · schematisch, ohne Angriffsausführung</text>
<rect x="20" y="110" width="195" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="117.5" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Bereichsprüfung</text>
<text x="117.5" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Pfad vorhergesagt</text>
<rect x="275" y="110" width="195" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="372.5" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Wert transient</text>
<text x="372.5" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">vorläufig gelesen</text>
<rect x="530" y="110" width="195" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="627.5" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Probeadresse</text>
<text x="627.5" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">vom Wert abhängig</text>
<rect x="785" y="110" width="195" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="882.5" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Cachezeile</text>
<text x="882.5" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">ggf. geladen</text>
<line x1="215" y1="160" x2="270" y2="160" stroke="#1D1D1F" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="470" y1="160" x2="525" y2="160" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="725" y1="160" x2="780" y2="160" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="882" y1="210" x2="882" y2="280" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="270" font-size="23" fill="#1D1D1F" text-anchor="middle">Squash: keine normale Bestätigung des falschen Pfads</text>
<text x="720" y="319" font-size="22" fill="#1D1D1F" text-anchor="middle">spätere Zeitbeobachtung kann Information tragen</text>
</svg>
