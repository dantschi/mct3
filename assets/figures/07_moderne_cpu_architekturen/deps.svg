<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<rect width="1200" height="360" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Dieselben IDs. RAW bleibt echt. WAR und WAW sind Namenskonflikte.</text>
<text x="40" y="58" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">RAW</text>
<rect x="20" y="80" width="200" height="40" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="28" y="106" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">I1 lw t0</text>
<rect x="20" y="180" width="220" height="40" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="28" y="206" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">I2 add t1,t0,t2</text>
<line x1="120" y1="120" x2="120" y2="180" stroke="#B71C1C" stroke-width="2"/>
<text x="120.0" y="144.0" font-size="12" font-weight="700" fill="#B71C1C" text-anchor="middle">RAW t0</text>
<text x="420" y="58" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">WAR</text>
<rect x="360" y="80" width="230" height="40" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="368" y="106" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">I2 liest t0</text>
<rect x="360" y="180" width="250" height="40" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="368" y="206" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">I3 sub t0,t4,t5</text>
<line x1="470" y1="120" x2="470" y2="180" stroke="#6A1B9A" stroke-width="2"/>
<text x="470.0" y="144.0" font-size="12" font-weight="700" fill="#6A1B9A" text-anchor="middle">WAR t0</text>
<text x="820" y="58" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">WAW</text>
<rect x="740" y="80" width="180" height="40" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="748" y="106" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">I1 schreibt t0</text>
<rect x="740" y="180" width="250" height="40" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="748" y="206" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">I3 schreibt t0 neu</text>
<line x1="860" y1="120" x2="860" y2="180" stroke="#00838F" stroke-width="2"/>
<text x="860.0" y="144.0" font-size="12" font-weight="700" fill="#00838F" text-anchor="middle">WAW t0</text>
<text x="16" y="260" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Forwarding kuerzt RAW-Wartezeit, hebt die Abhaengigkeit nicht auf.</text>
<text x="16" y="288" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Ein RAW-Paar hat ILP 1. Das ist nicht das ILP des ganzen Programms.</text>
<text x="16" y="320" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">RV32I/RV64I: 32 Integer-Architekturregister, x0 fest 0. RV32E ist ein anderes Profil.</text>
<text x="16" y="346" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Architekturregister sind Namen. Die physische Datei kann groesser sein. >100 ist keine Mindestzahl.</text>
</svg>
