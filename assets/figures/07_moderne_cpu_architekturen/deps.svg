<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="418" viewBox="0 0 1000 418" role="img" aria-labelledby="title">
<title id="title">Echte Abhängigkeiten und zwei Konflikte auf dem Namen t0</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="418" fill="#FFFFFF"/>
<rect x="40" y="90" width="330" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="205.0" y="133.0" font-size="24" fill="#1D1D1F" text-anchor="middle">A: Load → t0</text>
<rect x="40" y="265" width="330" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="205.0" y="308.0" font-size="24" fill="#1D1D1F" text-anchor="middle">B: t1 ← t0 + t2</text>
<rect x="620" y="90" width="330" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="785.0" y="133.0" font-size="24" fill="#1D1D1F" text-anchor="middle">C: t0 ← t4 − t5</text>
<rect x="620" y="265" width="330" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="785.0" y="308.0" font-size="24" fill="#1D1D1F" text-anchor="middle">D: t6 ← t0 AND t3</text>
<line x1="205" y1="160" x2="205" y2="260" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="215" y="214" font-size="22" fill="#E2001A" text-anchor="start">RAW</text>
<line x1="785" y1="160" x2="785" y2="260" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="795" y="214" font-size="22" fill="#E2001A" text-anchor="start">RAW</text>
<line x1="370" y1="125" x2="615" y2="125" stroke="#1D1D1F" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="493" y="106" font-size="22" fill="#1D1D1F" text-anchor="middle">WAW t0</text>
<line x1="370" y1="300" x2="615" y2="145" stroke="#1D1D1F" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="498" y="252" font-size="22" fill="#1D1D1F" text-anchor="middle">WAR t0</text>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Programmfolge A, B, C, D · Wertfluss und Namenskonflikte</text>
<text x="500" y="389" font-size="23" fill="#1D1D1F" text-anchor="middle">Rot: echte Werte · gestrichelt: gleiche Namen</text>
</svg>
