<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title">
<title id="title">Erster Unterschied entscheidet durch dominantes LOW</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="410" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Arbitration: A sendet A0, B plant D0 · MSB zuerst</text>
<text x="20" y="95" font-size="24" fill="#1D1D1F" text-anchor="start">A</text>
<polyline points="190.000,70.000 280.000,70.000 280.000,70.000 280.000,112.000 370.000,112.000 370.000,112.000 370.000,70.000 460.000,70.000 460.000,70.000 460.000,112.000 550.000,112.000 550.000,112.000 640.000,112.000 640.000,112.000 730.000,112.000 730.000,112.000 820.000,112.000 820.000,112.000 910.000,112.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<text x="20" y="185" font-size="24" fill="#1D1D1F" text-anchor="start">B</text>
<polyline points="190.000,160.000 280.000,160.000 280.000,160.000 370.000,160.000 370.000,160.000 460.000,160.000 460.000,160.000 550.000,160.000 550.000,160.000 640.000,160.000 640.000,160.000 730.000,160.000 730.000,160.000 820.000,160.000 820.000,160.000 910.000,160.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<text x="20" y="275" font-size="24" fill="#1D1D1F" text-anchor="start">Bus</text>
<polyline points="190.000,250.000 280.000,250.000 280.000,250.000 280.000,292.000 370.000,292.000 370.000,292.000 370.000,250.000 460.000,250.000 460.000,250.000 460.000,292.000 550.000,292.000 550.000,292.000 640.000,292.000 640.000,292.000 730.000,292.000 730.000,292.000 820.000,292.000 820.000,292.000 910.000,292.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<line x1="325" y1="55" x2="325" y2="310" stroke="#86868B" stroke-width="2" stroke-dasharray="6 5"/>
<text x="340" y="145" font-size="22" fill="#1D1D1F" text-anchor="start">B: wollte 1, liest 0 → verliert</text>
<text x="500" y="350" font-size="24" fill="#1D1D1F" text-anchor="middle">Entscheidung beim zweiten Bit, Stelle 6</text>
<text x="20" y="385" font-size="21" fill="#1D1D1F" text-anchor="start">Ab Verlust gibt B frei; seine übrigen Bits werden nicht gesendet</text>
