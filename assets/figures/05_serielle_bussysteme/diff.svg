<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<rect width="1200" height="480" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="17" font-weight="600" fill="#1D1D1F" text-anchor="start">Single-Ended gegen Bezug, differentiell als Differenz. Common Mode bleibt begrenzt.</text>
<rect x="16" y="46" width="250" height="70" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="24" y="68" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">Single-Ended</text>
<text x="24" y="88" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Pegel gegen GND</text>
<rect x="290" y="46" width="280" height="70" fill="#fff" stroke="#1B5E20" stroke-width="1.6"/>
<text x="298" y="68" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Differentiell</text>
<text x="298" y="88" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Vdiff = VA - VB</text>
<text x="600" y="74" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">Vcm = (VA + VB) / 2</text>
<text x="16" y="150" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Beispiel: VA = 2,5 V, VB = 0,5 V -&gt; Vdiff = 2,0 V, Vcm = 1,5 V</text>
<text x="16" y="178" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Dieselbe Stoerung +0,8 V: Vdiff bleibt 2,0 V, Vcm wird 2,3 V</text>
<text x="16" y="210" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Liegt 2,3 V noch im erlaubten Bereich des gewaehlten Transceivers? Das Datenblatt entscheidet.</text>
<rect x="16" y="230" width="560" height="90" fill="none" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="28" y="254" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">RS-485, Halbduplex</text>
<text x="28" y="278" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">UART -&gt; Transceiver -&gt; A/B, Stubs kurz</text>
<text x="28" y="302" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Terminierung an beiden physikalischen Enden, Driver Enable steuert die Richtung</text>
<rect x="600" y="230" width="560" height="90" fill="none" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="612" y="254" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">CAN separat</text>
<text x="612" y="278" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">CAN-Controller plus CAN-Transceiver</text>
<text x="612" y="302" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Dominant/rezessiv. Rezessiv ist nicht zwingend invertiert.</text>
<text x="16" y="360" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Twisted Pair naehert gleiche Einkopplung an. Unsymmetrie und reale Empfaenger bleiben.</text>
<text x="16" y="390" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Schichten: UART-Frame, dann RS-485-Transceiver, dann Leitung. Modbus liegt darueber.</text>
<text x="16" y="420" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">RS-485 liefert keine CAN-Arbitration. Masse, Schutz und Isolation bleiben Systemfragen.</text>
<text x="16" y="454" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Mehrere hundert Meter sind keine beliebige Bitrate. Reichweite und Geschwindigkeit zusammen nennen.</text>
</svg>
