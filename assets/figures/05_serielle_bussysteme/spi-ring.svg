<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-labelledby="title">
<title id="title">Gleichzeitiger Austausch in zwei Acht-Bit-Modellregistern</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="365" fill="#FFFFFF"/>
<rect x="25" y="35" width="235" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="142.5" y="78.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Controller</text>
<text x="142.5" y="108.0" font-size="24" fill="#1D1D1F" text-anchor="middle">0x96</text>
<rect x="740" y="35" width="235" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="857.5" y="78.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Target</text>
<text x="857.5" y="108.0" font-size="24" fill="#1D1D1F" text-anchor="middle">0x3C</text>
<line x1="260" y1="67" x2="735" y2="67" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="55" font-size="22" fill="#1D1D1F" text-anchor="middle">MOSI</text>
<line x1="740" y1="112" x2="265" y2="112" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="101" font-size="22" fill="#1D1D1F" text-anchor="middle">MISO</text>
<text x="170" y="180" font-size="24" fill="#1D1D1F" text-anchor="start">Takte</text>
<text x="480" y="180" font-size="24" fill="#1D1D1F" text-anchor="start">Controller</text>
<text x="780" y="180" font-size="24" fill="#1D1D1F" text-anchor="start">Target</text>
<text x="170" y="220" font-size="24" fill="#1D1D1F" text-anchor="start">0</text>
<text x="480" y="220" font-size="24" fill="#1D1D1F" text-anchor="start">0x96</text>
<text x="780" y="220" font-size="24" fill="#1D1D1F" text-anchor="start">0x3C</text>
<text x="170" y="260" font-size="24" fill="#1D1D1F" text-anchor="start">1</text>
<text x="480" y="260" font-size="24" fill="#1D1D1F" text-anchor="start">0x2C</text>
<text x="780" y="260" font-size="24" fill="#1D1D1F" text-anchor="start">0x79</text>
<text x="170" y="300" font-size="24" fill="#1D1D1F" text-anchor="start">4</text>
<text x="480" y="300" font-size="24" fill="#1D1D1F" text-anchor="start">0x63</text>
<text x="780" y="300" font-size="24" fill="#1D1D1F" text-anchor="start">0xC9</text>
<text x="170" y="340" font-size="24" fill="#1D1D1F" text-anchor="start">8</text>
<text x="480" y="340" font-size="24" fill="#1D1D1F" text-anchor="start">0x3C</text>
<text x="780" y="340" font-size="24" fill="#1D1D1F" text-anchor="start">0x96</text>
