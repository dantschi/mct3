<text x="16" y="370" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">Gefuellter Punkt = Sample. Datenwechsel liegt auf der anderen Flanke.</text>
<text x="16" y="398" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Register, Linksverschieben und Einschieben: Start 0x96 / 0x3C</text>
<text x="16" y="426" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">nach 4 Takten 0x63 / 0xC9, nach 8 Takten 0x3C / 0x96.</text>
<text x="16" y="456" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Lesen braucht oft ein Dummy-Byte. Volle FIFO beweist kein fertiges CS-Hold.</text>
<text x="16" y="484" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Full-Duplex gilt fuer dieses 4-Signal-Modell. 3-Draht, Dual und Quad sind Erweiterungen.</text>
<text x="16" y="508" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">CS-Setup vor der ersten Sample-Flanke, CS-Hold nach dem letzten Bit.</text>
</svg>
