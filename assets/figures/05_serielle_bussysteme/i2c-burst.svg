<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
<rect width="1200" height="460" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Burst-Read 0x3B bis 0x40. Kein STOP zwischen Zeiger und Read. Repeated Start haelt die Transaktion.</text>
<rect x="16" y="46" width="90" height="58" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="24" y="68" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">S</text>
<text x="24" y="88" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Start</text>
<line x1="106" y1="74" x2="120" y2="74" stroke="#1D1D1F" stroke-width="2"/><circle cx="120.0" cy="74.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="114" y="46" width="90" height="58" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="122" y="68" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">D0</text>
<text x="122" y="88" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Write ACK</text>
<line x1="204" y1="74" x2="218" y2="74" stroke="#1D1D1F" stroke-width="2"/><circle cx="218.0" cy="74.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="212" y="46" width="90" height="58" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="220" y="68" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">3B</text>
<text x="220" y="88" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Reg ACK</text>
<line x1="302" y1="74" x2="316" y2="74" stroke="#1D1D1F" stroke-width="2"/><circle cx="316.0" cy="74.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="310" y="46" width="90" height="58" fill="#fff" stroke="#6A1B9A" stroke-width="1.6"/>
<text x="318" y="68" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">Sr</text>
<text x="318" y="88" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">kein STOP</text>
<line x1="400" y1="74" x2="414" y2="74" stroke="#1D1D1F" stroke-width="2"/><circle cx="414.0" cy="74.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="408" y="46" width="90" height="58" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="416" y="68" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">D1</text>
<text x="416" y="88" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Read ACK</text>
<line x1="498" y1="74" x2="512" y2="74" stroke="#1D1D1F" stroke-width="2"/><circle cx="512.0" cy="74.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="506" y="46" width="90" height="58" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="514" y="68" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">10</text>
<text x="514" y="88" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">ACK</text>
<line x1="596" y1="74" x2="610" y2="74" stroke="#1D1D1F" stroke-width="2"/><circle cx="610.0" cy="74.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="604" y="46" width="90" height="58" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="612" y="68" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">00</text>
<text x="612" y="88" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">ACK</text>
<line x1="694" y1="74" x2="708" y2="74" stroke="#1D1D1F" stroke-width="2"/><circle cx="708.0" cy="74.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="702" y="46" width="90" height="58" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="710" y="68" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">E0</text>
<text x="710" y="88" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">ACK</text>
<line x1="792" y1="74" x2="806" y2="74" stroke="#1D1D1F" stroke-width="2"/><circle cx="806.0" cy="74.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="800" y="46" width="90" height="58" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="808" y="68" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">00</text>
<text x="808" y="88" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">ACK</text>
<line x1="890" y1="74" x2="904" y2="74" stroke="#1D1D1F" stroke-width="2"/><circle cx="904.0" cy="74.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="898" y="46" width="90" height="58" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="906" y="68" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">40</text>
<text x="906" y="88" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">ACK</text>
<line x1="988" y1="74" x2="1002" y2="74" stroke="#1D1D1F" stroke-width="2"/><circle cx="1002.0" cy="74.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="996" y="46" width="90" height="58" fill="#fff" stroke="#B71C1C" stroke-width="1.6"/>
<text x="1004" y="68" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">00</text>
<text x="1004" y="88" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">NACK</text>
<line x1="1086" y1="74" x2="1100" y2="74" stroke="#1D1D1F" stroke-width="2"/><circle cx="1100.0" cy="74.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="1094" y="46" width="90" height="58" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="1102" y="68" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">P</text>
<text x="1102" y="88" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Stop</text>
<text x="16" y="140" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">Controller bestaetigt Byte 1 bis 5 mit ACK und beendet Byte 6 mit NACK.</text>
<text x="16" y="176" font-size="18" font-weight="600" fill="#1565C0" text-anchor="start">Bytes: 10 00 | E0 00 | 40 00</text>
<text x="16" y="208" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">X = 0x1000 = 4096, Y = 0xE000 = -8192, Z = 0x4000 = 16384</text>
<text x="16" y="240" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">+/-2 g und 16384 LSB/g: +0,25 g, -0,5 g, +1 g. Rohwert, Einheit und Bereich getrennt halten.</text>
<text x="16" y="276" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">Tests: 0x0000 -&gt; 0, 0x7FFF -&gt; 32767, 0x8000 -&gt; -32768, 0xFFFF -&gt; -1</text>
<text x="16" y="312" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Unsigned zusammensetzen, dann als int16_t lesen. Kein Cast eines Bytepuffers auf int16_t*.</text>
<text x="16" y="348" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">9 Bytes * 9 SCL = 81 Pulse. 810 us bei 100 kHz, 202,5 us bei 400 kHz, ohne Stretching.</text>
<text x="16" y="380" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">Nutzdaten 48/81, etwa 59 Prozent. Ein einzelnes Byte ab 0x3B ist nur X-High.</text>
<text x="16" y="420" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Auto-Increment und ein gemeinsamer Snapshot sind Eigenschaften des Sensors, nicht von I2C allgemein.</text>
<text x="16" y="446" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Getrennte Transaktionen koennen drei Achsen aus verschiedenen Abtastungen mischen.</text>
</svg>
