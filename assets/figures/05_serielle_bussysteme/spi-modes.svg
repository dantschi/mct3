<text x="16" y="460" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Punkt = Sample. Quadrat = Datenwechsel. Bei CPHA = 0 steht Bit 0 schon vor der ersten Sample-Flanke.</text>
<text x="16" y="486" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Bei CPHA = 1 bereitet die erste Flanke das Bit fuer die folgende Sample-Flanke.</text>
<text x="16" y="514" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Gleicher SCK verhindert Bauddrift, nicht beliebig hohe Frequenz. Setup, Hold, Clock-to-Output und Leitung begrenzen das Auge.</text>
<text x="16" y="542" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Maximale SCK-Frequenz aus beiden Datenblaettern und dem Layout, nicht aus dem Modus allein.</text>
