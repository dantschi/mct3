<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title">
<title id="title">Bytewanderung in drei geeigneten Schiebestufen</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="400" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Geeignete 8-Bit-Stufen · Hexbytes 11 → 22 → 33</text>
<rect x="30" y="60" width="195" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="127.5" y="103.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Controller</text>
<rect x="280" y="60" width="195" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="377.5" y="103.0" font-size="24" fill="#1D1D1F" text-anchor="middle">A: nah</text>
<rect x="530" y="60" width="195" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="627.5" y="103.0" font-size="24" fill="#1D1D1F" text-anchor="middle">B</text>
<rect x="780" y="60" width="195" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="877.5" y="103.0" font-size="24" fill="#1D1D1F" text-anchor="middle">C: fern</text>
<line x1="225" y1="95" x2="275" y2="95" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="475" y1="95" x2="525" y2="95" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="725" y1="95" x2="775" y2="95" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="180" font-size="24" fill="#1D1D1F" text-anchor="start">Takte</text>
<text x="340" y="180" font-size="24" fill="#1D1D1F" text-anchor="start">A</text>
<text x="590" y="180" font-size="24" fill="#1D1D1F" text-anchor="start">B</text>
<text x="840" y="180" font-size="24" fill="#1D1D1F" text-anchor="start">C</text>
<text x="20" y="220" font-size="24" fill="#1D1D1F" text-anchor="start">8</text>
<text x="340" y="220" font-size="24" fill="#1D1D1F" text-anchor="start">0x11</text>
<text x="590" y="220" font-size="24" fill="#1D1D1F" text-anchor="start">0x00</text>
<text x="840" y="220" font-size="24" fill="#1D1D1F" text-anchor="start">0x00</text>
<text x="20" y="260" font-size="24" fill="#1D1D1F" text-anchor="start">16</text>
<text x="340" y="260" font-size="24" fill="#1D1D1F" text-anchor="start">0x22</text>
<text x="590" y="260" font-size="24" fill="#1D1D1F" text-anchor="start">0x11</text>
<text x="840" y="260" font-size="24" fill="#1D1D1F" text-anchor="start">0x00</text>
<text x="20" y="300" font-size="24" fill="#1D1D1F" text-anchor="start">24</text>
<text x="340" y="300" font-size="24" fill="#1D1D1F" text-anchor="start">0x33</text>
<text x="590" y="300" font-size="24" fill="#1D1D1F" text-anchor="start">0x22</text>
<text x="840" y="300" font-size="24" fill="#1D1D1F" text-anchor="start">0x11</text>
<line x1="280" y1="340" x2="975" y2="340" stroke="#86868B" stroke-width="2"/>
<text x="500" y="374" font-size="22" fill="#1D1D1F" text-anchor="middle">SCK und CS gemeinsam; Übernahme gerätespezifisch</text>
</svg>
