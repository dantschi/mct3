<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect width="1200" height="400" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="start">Getrennte TX- und RX-Pfade. FIFO und Schieberegister sind zwei Stufen.</text>
<text x="16" y="98" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">TX</text>
<rect x="70" y="70" width="150" height="48" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="78" y="92" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">CPU / MMIO</text>
<line x1="220" y1="94" x2="238" y2="94" stroke="#1D1D1F" stroke-width="2"/><circle cx="238.0" cy="94.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="246" y="70" width="150" height="48" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="254" y="92" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">TX-FIFO</text>
<line x1="396" y1="94" x2="414" y2="94" stroke="#1D1D1F" stroke-width="2"/><circle cx="414.0" cy="94.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="422" y="70" width="150" height="48" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="430" y="92" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">TX-Schiebereg.</text>
<line x1="572" y1="94" x2="590" y2="94" stroke="#1D1D1F" stroke-width="2"/><circle cx="590.0" cy="94.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="598" y="70" width="150" height="48" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="606" y="92" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Leitung</text>
<text x="16" y="208" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">RX</text>
<rect x="70" y="180" width="150" height="48" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="78" y="202" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Leitung</text>
<line x1="220" y1="204" x2="238" y2="204" stroke="#1D1D1F" stroke-width="2"/><circle cx="238.0" cy="204.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="246" y="180" width="150" height="48" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="254" y="202" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Sampling / Frame</text>
<line x1="396" y1="204" x2="414" y2="204" stroke="#1D1D1F" stroke-width="2"/><circle cx="414.0" cy="204.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="422" y="180" width="150" height="48" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="430" y="202" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">RX-Schiebereg.</text>
<line x1="572" y1="204" x2="590" y2="204" stroke="#1D1D1F" stroke-width="2"/><circle cx="590.0" cy="204.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="598" y="180" width="150" height="48" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="606" y="202" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">RX-FIFO</text>
<line x1="748" y1="204" x2="766" y2="204" stroke="#1D1D1F" stroke-width="2"/><circle cx="766.0" cy="204.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<rect x="774" y="180" width="150" height="48" fill="#fff" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="782" y="202" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">CPU / MMIO</text>
<text x="16" y="268" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">115200 Baud, 8N1: hoechstens 11520 Byte/s, Datenanteil 80 Prozent.</text>
<text x="16" y="296" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">RX-FIFO 16 Plaetze, Watermark 8. Acht Bytes etwa 694 us Spielraum, keine IRQ-Latenz.</text>
<text x="16" y="324" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">Kommen weniger als acht Bytes, braucht es Timeout oder Idle. Overflow ist ein eigener Fehler.</text>
<text x="16" y="352" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Platz im TX-Puffer heisst nicht: letztes Stop-Bit ist schon auf der Leitung.</text>
<text x="16" y="384" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Fuer RS-485-Richtung zaehlt das gesendete Stop-Bit, nicht nur das leere FIFO.</text>
</svg>
