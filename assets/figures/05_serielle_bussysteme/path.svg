<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
<rect width="1200" height="430" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="26" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="start">Vom Sensorregister zur CPU. Drei Adressarten, drei Verdrahtungen.</text>
<text x="16" y="48" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Lehrschema. GND gehoert dazu, zaehlt aber nicht als Signalleitung.</text>
<rect x="16" y="64" width="210" height="58" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="24" y="86" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">Sensorregister</text>
<text x="24" y="106" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">ACCEL ab 0x3B</text>
<rect x="250" y="64" width="210" height="58" fill="#fff" stroke="#E65100" stroke-width="1.6"/>
<text x="258" y="86" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Bitstrom</text>
<text x="258" y="106" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Protokollrahmen</text>
<rect x="470" y="64" width="210" height="58" fill="#fff" stroke="#6A1B9A" stroke-width="1.6"/>
<text x="478" y="86" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">Bus-Controller</text>
<text x="478" y="106" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">FIFO / Datenreg.</text>
<rect x="700" y="64" width="210" height="58" fill="#fff" stroke="#B71C1C" stroke-width="1.6"/>
<text x="708" y="86" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">MMIO-Load</text>
<text x="708" y="106" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">z. B. 0x4001....</text>
<rect x="930" y="64" width="210" height="58" fill="#fff" stroke="#1B5E20" stroke-width="1.6"/>
<text x="938" y="86" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">CPU-Register</text>
<text x="938" y="106" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">uint8_t / int16_t</text>
<line x1="226" y1="93" x2="248" y2="93" stroke="#1D1D1F" stroke-width="2"/><circle cx="248.0" cy="93.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<line x1="446" y1="93" x2="468" y2="93" stroke="#1D1D1F" stroke-width="2"/><circle cx="468.0" cy="93.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<line x1="680" y1="93" x2="702" y2="93" stroke="#1D1D1F" stroke-width="2"/><circle cx="702.0" cy="93.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<line x1="910" y1="93" x2="932" y2="93" stroke="#1D1D1F" stroke-width="2"/><circle cx="932.0" cy="93.0" r="3.2" fill="#1D1D1F" stroke="#1D1D1F" stroke-width="1.5"/>
<text x="16" y="154" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Getrennte Symbole: Quadrat = SoC-MMIO, Sechseck nur als Text: I2C-Adresse 0x68, gestrichelt = internes Register.</text>
<rect x="20" y="176" width="370" height="210" fill="none" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="32" y="202" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">UART 0/3,3 V, nicht isoliert</text>
<text x="36" y="232" font-size="16" font-weight="400" fill="#1D1D1F" text-anchor="start">TX1 ----- RX2</text>
<text x="36" y="264" font-size="16" font-weight="400" fill="#1D1D1F" text-anchor="start">RX1 ----- TX2</text>
<text x="36" y="296" font-size="16" font-weight="400" fill="#1D1D1F" text-anchor="start">GND ----- GND</text>
<text x="36" y="328" font-size="16" font-weight="400" fill="#B71C1C" text-anchor="start">Frame ist nicht RS-232.</text>
<line x1="36" y1="360" x2="360" y2="360" stroke="#546E7A" stroke-width="3"/>
<text x="36" y="378" font-size="13" font-weight="400" fill="#546E7A" text-anchor="start">gemeinsamer Bezug</text>
<rect x="410" y="176" width="370" height="210" fill="none" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="422" y="202" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">SPI Mode-0-Grundmodell</text>
<text x="426" y="232" font-size="16" font-weight="400" fill="#1D1D1F" text-anchor="start">SCK  ----- SCK</text>
<text x="426" y="264" font-size="16" font-weight="400" fill="#1D1D1F" text-anchor="start">MOSI ----- MOSI/SDI</text>
<text x="426" y="296" font-size="16" font-weight="400" fill="#1D1D1F" text-anchor="start">MISO ----- MISO/SDO</text>
<text x="426" y="328" font-size="16" font-weight="400" fill="#1D1D1F" text-anchor="start">CS   ----- CS, plus GND</text>
<line x1="426" y1="360" x2="750" y2="360" stroke="#546E7A" stroke-width="3"/>
<text x="426" y="378" font-size="13" font-weight="400" fill="#546E7A" text-anchor="start">gemeinsamer Bezug</text>
<rect x="800" y="176" width="370" height="210" fill="none" stroke="#1D1D1F" stroke-width="1.6"/>
<text x="812" y="202" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">I2C Open-Drain</text>
<text x="816" y="232" font-size="16" font-weight="400" fill="#1D1D1F" text-anchor="start">SDA -- Pull-up -- SDA</text>
<text x="816" y="264" font-size="16" font-weight="400" fill="#1D1D1F" text-anchor="start">SCL -- Pull-up -- SCL</text>
<text x="816" y="296" font-size="16" font-weight="400" fill="#1D1D1F" text-anchor="start">GND ----------- GND</text>
<text x="816" y="328" font-size="16" font-weight="400" fill="#1D1D1F" text-anchor="start">HIGH = loslassen</text>
<line x1="816" y1="360" x2="1140" y2="360" stroke="#546E7A" stroke-width="3"/>
<text x="816" y="378" font-size="13" font-weight="400" fill="#546E7A" text-anchor="start">gemeinsamer Bezug</text>
<text x="16" y="414" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">MPU6050-Beispiel: Beschleunigungsrohwerte. Neigung ist daraus nur unter Annahmen abgeleitet.</text>
</svg>
