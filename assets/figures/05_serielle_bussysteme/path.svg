<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="315" viewBox="0 0 1000 315" role="img" aria-labelledby="title">
<title id="title">Lokaler Gerätezugriff, Busadresse und Sensorregister</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="315" fill="#FFFFFF"/>
<rect x="20" y="70" width="220" height="105" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="130.0" y="115.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Prozessor</text>
<text x="130.0" y="145.5" font-size="24" fill="#1D1D1F" text-anchor="middle">lokale Register</text>
<rect x="330" y="70" width="270" height="105" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="465.0" y="115.5" font-size="24" fill="#1D1D1F" text-anchor="middle">I²C-Controller</text>
<text x="465.0" y="145.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Busprotokoll</text>
<rect x="705" y="70" width="275" height="105" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="842.5" y="115.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Sensor: Adresse 68</text>
<text x="842.5" y="145.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Registerindex 3B</text>
<line x1="240" y1="118" x2="325" y2="118" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="600" y1="118" x2="700" y2="118" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="35" font-size="24" fill="#1D1D1F" text-anchor="start">Drei Adressarten · Hexwerte 68 und 3B</text>
<text x="135" y="225" font-size="24" fill="#1D1D1F" text-anchor="middle">MMIO-Adresse</text>
<text x="465" y="225" font-size="24" fill="#1D1D1F" text-anchor="middle">Geräteadresse</text>
<text x="842" y="225" font-size="24" fill="#1D1D1F" text-anchor="middle">Register im Sensor</text>
<line x1="900" y1="275" x2="100" y2="275" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="265" font-size="24" fill="#1D1D1F" text-anchor="middle">Empfangene Bytes zurück zur Verarbeitung</text>
</svg>
