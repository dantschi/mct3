<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title">
<title id="title">Vier SPI-Signale mit getrenntem Rückpfad</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="370" fill="#FFFFFF"/>
<rect x="20" y="45" width="250" height="250" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="145.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Controller</text>
<rect x="730" y="45" width="250" height="250" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="855.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Target</text>
<line x1="270" y1="70" x2="725" y2="70" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="58" font-size="23" fill="#1D1D1F" text-anchor="middle">SCK</text>
<line x1="270" y1="130" x2="725" y2="130" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="118" font-size="23" fill="#1D1D1F" text-anchor="middle">MOSI</text>
<line x1="730" y1="210" x2="275" y2="210" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="198" font-size="23" fill="#1D1D1F" text-anchor="middle">MISO</text>
<line x1="270" y1="275" x2="725" y2="275" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="263" font-size="23" fill="#1D1D1F" text-anchor="middle">CS, Active-Low</text>
<text x="500" y="340" font-size="24" fill="#1D1D1F" text-anchor="middle">GND und Versorgung kommen zusätzlich hinzu</text>
</svg>
