<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title">
<title id="title">Gemeinsame SPI-Signale und getrennte Auswahl je Target</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="410" fill="#FFFFFF"/>
<rect x="20" y="120" width="240" height="105" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="140.0" y="165.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Controller</text>
<text x="140.0" y="195.5" font-size="24" fill="#1D1D1F" text-anchor="middle">SCK, MOSI, MISO</text>
<line x1="260" y1="172" x2="380" y2="172" stroke="#1D1D1F" stroke-width="2"/>
<line x1="380" y1="65" x2="380" y2="305" stroke="#1D1D1F" stroke-width="2"/>
<text x="20" y="35" font-size="24" fill="#1D1D1F" text-anchor="start">SCK / MOSI / MISO gemeinsam</text>
<text x="950" y="25" font-size="22" fill="#1D1D1F" text-anchor="end">CS vom Controller</text>
<rect x="505" y="30" width="270" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="640.0" y="73.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Target 1</text>
<line x1="380" y1="65" x2="500" y2="65" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="940" y1="65" x2="780" y2="65" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="850" y="52" font-size="22" fill="#1D1D1F" text-anchor="middle">CS1</text>
<rect x="505" y="150" width="270" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="640.0" y="193.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Target 2</text>
<line x1="380" y1="185" x2="500" y2="185" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="940" y1="185" x2="780" y2="185" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="850" y="172" font-size="22" fill="#1D1D1F" text-anchor="middle">CS2</text>
<rect x="505" y="270" width="270" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="640.0" y="313.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Target 3</text>
<line x1="380" y1="305" x2="500" y2="305" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="940" y1="305" x2="780" y2="305" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="850" y="292" font-size="22" fill="#1D1D1F" text-anchor="middle">CS3</text>
<text x="500" y="380" font-size="24" fill="#1D1D1F" text-anchor="middle">Drei Targets: 3 + 3 = 6 Signalpins</text>
</svg>
