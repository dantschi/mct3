<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
<rect width="1200" height="460" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Stern: SCK, MOSI, MISO gemeinsam, drei CS, zusaetzlich GND. Nur ein MISO-Treiber aktiv.</text>
<rect x="20" y="48" width="140" height="50" fill="#fff" stroke="#E65100" stroke-width="1.6"/>
<text x="28" y="70" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Controller</text>
<text x="28" y="90" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">CS0 CS1 CS2</text>
<rect x="280" y="120" width="200" height="52" fill="#fff" stroke="#1B5E20" stroke-width="1.6"/>
<text x="288" y="142" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">T0 selektiert</text>
<text x="288" y="162" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">MISO</text>
<line x1="160" y1="73" x2="280" y2="146" stroke="#1D1D1F" stroke-width="1.4"/>
<rect x="280" y="190" width="200" height="52" fill="#fff" stroke="#5F6368" stroke-width="1.6"/>
<text x="288" y="212" font-size="15" font-weight="600" fill="#5F6368" text-anchor="start">T1 hochohmig</text>
<text x="288" y="232" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">MISO Hi-Z</text>
<line x1="160" y1="73" x2="280" y2="216" stroke="#1D1D1F" stroke-width="1.4"/>
<rect x="280" y="260" width="200" height="52" fill="#fff" stroke="#5F6368" stroke-width="1.6"/>
<text x="288" y="282" font-size="15" font-weight="600" fill="#5F6368" text-anchor="start">T2 hochohmig</text>
<text x="288" y="302" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">MISO Hi-Z</text>
<line x1="160" y1="73" x2="280" y2="286" stroke="#1D1D1F" stroke-width="1.4"/>
<text x="520" y="80" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">Gemeinsame Netze: SCK, MOSI, MISO</text>
<text x="520" y="108" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Getrennt: CS0, CS1, CS2</text>
<text x="520" y="136" font-size="15" font-weight="600" fill="#546E7A" text-anchor="start">GND zwischen allen Bausteinen</text>
<rect x="520" y="160" width="640" height="70" fill="#fff" stroke="#B71C1C" stroke-width="1.6"/>
<text x="532" y="188" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Fehler: zwei Push-Pull-MISO-Treiber,</text>
<text x="532" y="212" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">unterschiedliche Pegel, ein Netz.</text>
<text x="16" y="350" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Daisy-Chain nur wenn das Geraet sie vorsieht. Start 00/00/00, Controller sendet 0x33, 0x22, 0x11.</text>
<text x="16" y="378" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Nach 8 Takten 33/00/00, nach 16: 22/33/00, nach 24: 11/22/33. Latch ist ein extra Ereignis.</text>
<text x="16" y="410" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Controller-SDO gehoert an Target-SDI. Gleicher Name heisst nicht gleiche Leitung.</text>
<text x="16" y="440" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Ein Sensor mit Kommando/Antwort ist keine Daisy-Chain und hat im Grundmodell kein ACK.</text>
</svg>
