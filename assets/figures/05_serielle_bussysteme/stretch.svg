<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title">
<title id="title">Zusätzliche LOW-Zeit trotz Freigabe des Controllers</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="350" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Freigabeabsicht und wirklicher Leitungspegel trennen</text>
<text x="20" y="92" font-size="22" fill="#1D1D1F" text-anchor="start">Controller</text>
<text x="20" y="121" font-size="22" fill="#1D1D1F" text-anchor="start">Sollpegel</text>
<polyline points="280.000,110.000 500.000,110.000 500.000,110.000 500.000,65.000 940.000,65.000" fill="none" stroke="#1D1D1F" stroke-width="3"/>
<text x="20" y="213" font-size="22" fill="#1D1D1F" text-anchor="start">SCL gemessen</text>
<polyline points="280.000,220.000 720.000,220.000 720.000,220.000 720.000,175.000 940.000,175.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<rect x="500" y="245" width="220" height="35" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="610" y="270" font-size="22" fill="#1D1D1F" text-anchor="middle">Stretching</text>
<line x1="500" y1="50" x2="500" y2="230" stroke="#86868B" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="720" y1="150" x2="720" y2="230" stroke="#86868B" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="280" y1="295" x2="940" y2="295" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="940" y="280" font-size="22" fill="#1D1D1F" text-anchor="end">Zeit, schematisch</text>
<text x="20" y="325" font-size="22" fill="#1D1D1F" text-anchor="start">Oben HIGH: Controller gibt frei; unten HIGH: Leitung ist gestiegen</text>
</svg>
