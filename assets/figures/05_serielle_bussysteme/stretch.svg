<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
<rect width="1200" height="460" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Stretching: der Controller gibt SCL frei, das Target haelt LOW, die Leitung bleibt LOW.</text>
<text x="16" y="70" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">geplant</text>
<text x="16" y="120" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Target</text>
<text x="16" y="170" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">Leitung</text>
<polyline points="120.0,80.0 156.0,80.0 156.0,80.0 192.0,80.0 192.0,48.0 228.0,48.0 228.0,48.0 264.0,48.0 264.0,48.0 300.0,48.0 300.0,48.0 336.0,48.0 336.0,48.0 372.0,48.0 372.0,48.0 408.0,48.0 408.0,80.0 444.0,80.0 444.0,80.0 480.0,80.0" fill="none" stroke="#E65100" stroke-width="2.4" stroke-linejoin="miter" stroke-linecap="square"/>
<polyline points="120.0,130.0 156.0,130.0 156.0,130.0 192.0,130.0 192.0,130.0 228.0,130.0 228.0,130.0 264.0,130.0 264.0,130.0 300.0,130.0 300.0,130.0 336.0,130.0 336.0,98.0 372.0,98.0 372.0,98.0 408.0,98.0 408.0,98.0 444.0,98.0 444.0,98.0 480.0,98.0" fill="none" stroke="#B71C1C" stroke-width="2.4" stroke-linejoin="miter" stroke-linecap="square"/>
<polyline points="120.0,180.0 156.0,180.0 156.0,180.0 192.0,180.0 192.0,180.0 228.0,180.0 228.0,180.0 264.0,180.0 264.0,180.0 300.0,180.0 300.0,180.0 336.0,180.0 336.0,148.0 372.0,148.0 372.0,148.0 408.0,148.0 408.0,180.0 444.0,180.0 444.0,180.0 480.0,180.0" fill="none" stroke="#1565C0" stroke-width="2.6" stroke-linejoin="miter" stroke-linecap="square"/>
<text x="16" y="220" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">Abtastung erst in der wirklichen HIGH-Phase, nicht beim Softwarebefehl HIGH.</text>
<text x="16" y="248" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Ob Stretching existiert und wie lange gewartet werden darf, steht im Controller, im Target und im Modell.</text>
<text x="16" y="284" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Arbitration, beide Write. A: 0x50 -&gt; 0xA0. B: 0x68 -&gt; 0xD0.</text>
<text x="16" y="312" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">MSB beide 1. Danach sendet A eine 0, B eine 1. Die Leitung wird 0, B verliert und treibt nicht weiter.</text>
<text x="16" y="348" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">A setzt 1 0 1 0 0 0 0 fort. B darf den Gewinn von A nicht mit einem STOP abbrechen.</text>
<text x="16" y="384" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Zustaende: frei, START, Adresse, Daten, Ende. Ausgaenge: NACK, Timeout, Arbitration Lost, Bus Error.</text>
<text x="16" y="416" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">0x00 und 0xFF sind gueltige Bytes. Neun Clocks loesen nur festgehaltenes SDA bei steuerbarem SCL.</text>
<text x="16" y="444" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Ein Watchdog-Reset der CPU setzt einen extern versorgten Sensor nicht automatisch zurueck.</text>
</svg>
