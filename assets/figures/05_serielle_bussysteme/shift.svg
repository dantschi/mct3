<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect width="1200" height="420" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="26" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="start">0x53 = 0101 0011 in MSB-Schreibweise. UART sendet d0 zuerst.</text>
<text x="16" y="58" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Parallel, b7 links bis b0 rechts. Ankunft versetzt, ein gemeinsames Fenster.</text>
<line x1="70" y1="78" x2="294" y2="78" stroke="#5F6368" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="90" y1="72" x2="90" y2="84" stroke="#1565C0" stroke-width="3"/>
<text x="40" y="82" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">b7=0</text>
<line x1="70" y1="96" x2="294" y2="96" stroke="#5F6368" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="112" y1="90" x2="112" y2="102" stroke="#1565C0" stroke-width="3"/>
<text x="40" y="100" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">b6=1</text>
<line x1="70" y1="114" x2="294" y2="114" stroke="#5F6368" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="134" y1="108" x2="134" y2="120" stroke="#1565C0" stroke-width="3"/>
<text x="40" y="118" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">b5=0</text>
<line x1="70" y1="132" x2="294" y2="132" stroke="#5F6368" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="156" y1="126" x2="156" y2="138" stroke="#1565C0" stroke-width="3"/>
<text x="40" y="136" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">b4=1</text>
<line x1="70" y1="150" x2="294" y2="150" stroke="#5F6368" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="178" y1="144" x2="178" y2="156" stroke="#1565C0" stroke-width="3"/>
<text x="40" y="154" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">b3=0</text>
<line x1="70" y1="168" x2="294" y2="168" stroke="#5F6368" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="200" y1="162" x2="200" y2="174" stroke="#1565C0" stroke-width="3"/>
<text x="40" y="172" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">b2=0</text>
<line x1="70" y1="186" x2="294" y2="186" stroke="#5F6368" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="222" y1="180" x2="222" y2="192" stroke="#1565C0" stroke-width="3"/>
<text x="40" y="190" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">b1=1</text>
<line x1="70" y1="204" x2="294" y2="204" stroke="#5F6368" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="244" y1="198" x2="244" y2="210" stroke="#1565C0" stroke-width="3"/>
<text x="40" y="208" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">b0=1</text>
<rect x="250" y="70" width="36" height="150" fill="none" stroke="#1B5E20" stroke-width="1.5"/>
<text x="292" y="150" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">gueltiges Fenster</text>
<text x="620" y="78" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Serielle Folge, LSB zuerst:</text>
<polyline points="620.0,100.0 672.0,100.0 672.0,100.0 724.0,100.0 724.0,150.0 776.0,150.0 776.0,150.0 828.0,150.0 828.0,100.0 880.0,100.0 880.0,150.0 932.0,150.0 932.0,100.0 984.0,100.0 984.0,150.0 1036.0,150.0" fill="none" stroke="#1565C0" stroke-width="2.6" stroke-linejoin="miter" stroke-linecap="square"/>
<text x="636" y="176" font-size="16" font-weight="700" fill="#1565C0" text-anchor="middle">1</text>
<text x="636" y="196" font-size="13" font-weight="400" fill="#5F6368" text-anchor="middle">d0</text>
<text x="688" y="176" font-size="16" font-weight="700" fill="#1565C0" text-anchor="middle">1</text>
<text x="688" y="196" font-size="13" font-weight="400" fill="#5F6368" text-anchor="middle">d1</text>
<text x="740" y="176" font-size="16" font-weight="700" fill="#1565C0" text-anchor="middle">0</text>
<text x="740" y="196" font-size="13" font-weight="400" fill="#5F6368" text-anchor="middle">d2</text>
<text x="792" y="176" font-size="16" font-weight="700" fill="#1565C0" text-anchor="middle">0</text>
<text x="792" y="196" font-size="13" font-weight="400" fill="#5F6368" text-anchor="middle">d3</text>
<text x="844" y="176" font-size="16" font-weight="700" fill="#1565C0" text-anchor="middle">1</text>
<text x="844" y="196" font-size="13" font-weight="400" fill="#5F6368" text-anchor="middle">d4</text>
<text x="896" y="176" font-size="16" font-weight="700" fill="#1565C0" text-anchor="middle">0</text>
<text x="896" y="196" font-size="13" font-weight="400" fill="#5F6368" text-anchor="middle">d5</text>
<text x="948" y="176" font-size="16" font-weight="700" fill="#1565C0" text-anchor="middle">1</text>
<text x="948" y="196" font-size="13" font-weight="400" fill="#5F6368" text-anchor="middle">d6</text>
<text x="1000" y="176" font-size="16" font-weight="700" fill="#1565C0" text-anchor="middle">0</text>
<text x="1000" y="196" font-size="13" font-weight="400" fill="#5F6368" text-anchor="middle">d7</text>
<text x="16" y="250" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Schieberegister, vereinfachtes Links-Modell nur fuer die sichtbaren Bits. UART schiebt faktisch LSB hinaus.</text>
<text x="16" y="278" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">Sender</text>
<text x="280" y="278" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">Leitung</text>
<text x="560" y="278" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Empfaenger</text>
<text x="16" y="300" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Start</text>
<text x="120" y="300" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">0101 0011</text>
<text x="280" y="300" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Leitung leer</text>
<text x="560" y="300" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">........</text>
<text x="16" y="332" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">nach d0,d1</text>
<text x="120" y="332" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">0101 00..</text>
<text x="280" y="332" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">1 dann 1</text>
<text x="560" y="332" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">..000011</text>
<text x="16" y="364" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">nach 8 Bit</text>
<text x="120" y="364" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">........</text>
<text x="280" y="364" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Frame fertig</text>
<text x="560" y="364" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">0101 0011</text>
<text x="16" y="408" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Seriell beseitigt Laufzeit nicht. USB/PCIe sind andere Kodierungen, kein On-Board-UART.</text>
</svg>
