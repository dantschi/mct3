<text x="16" y="22" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">I2C-Write, ein Controller. 7-Bit-Adresse 0x68, Write-Byte 0xD0, Register 0x6B, Daten 0x00.</text>
<text x="16" y="44" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">SDA wechselt bei Daten nur waehrend SCL LOW. Fallende SDA bei SCL HIGH = START, steigende = STOP.</text>
