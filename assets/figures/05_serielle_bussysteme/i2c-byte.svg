<text x="66.0" y="220" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="middle">S</text>
<text x="166.0" y="220" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="middle">0xD0 + ACK</text>
<text x="346.0" y="220" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="middle">0x6B + ACK</text>
<text x="526.0" y="220" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="middle">0x00 + ACK</text>
<text x="636.0" y="220" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="middle">P</text>
<text x="16" y="258" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">Neunte Clock: Sender gibt SDA frei, Target zieht fuer ACK auf LOW.</text>
<text x="16" y="286" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">Address-NACK: niemand zieht. Data-NACK: unerwartete Ablehnung.</text>
<text x="16" y="314" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">Controller-NACK nach dem letzten gelesenen Byte ist der normale Abschluss, kein fehlendes Geraet.</text>
<text x="16" y="348" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">0x68 &lt;&lt; 1 | 0 = 0xD0, 0x68 &lt;&lt; 1 | 1 = 0xD1. Eine API mit 7-Bit-Adresse schiebt intern. Nicht doppelt schieben.</text>
<text x="16" y="378" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Zwei Targets mit derselben Adresse trennt das Basisprotokoll nicht. AD0, Multiplexer oder getrennte Busse pruefen.</text>
<text x="16" y="408" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">128 Bitmuster sind nicht 128 freie Geraete. Reservierte Adressen und optionale 10-Bit-Adressierung bleiben.</text>
<text x="16" y="440" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Ein ACK bestaetigt den Empfang des Bytes, nicht den physikalischen Messwert.</text>
</svg>
