<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title">
<title id="title">Besondere Datenflanken bei hohem Taktpegel</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="350" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">START und STOP bei SCL HIGH · getrennte Ausschnitte</text>
<text x="330" y="70" font-size="24" fill="#1D1D1F" text-anchor="middle">START</text>
<text x="110" y="124" font-size="22" fill="#1D1D1F" text-anchor="start">SCL</text>
<text x="110" y="224" font-size="22" fill="#1D1D1F" text-anchor="start">SDA</text>
<polyline points="180.000,105.000 255.000,105.000 255.000,105.000 330.000,105.000 330.000,105.000 405.000,105.000 405.000,105.000 480.000,105.000" fill="none" stroke="#1D1D1F" stroke-width="3"/>
<polyline points="180.000,205.000 255.000,205.000 255.000,205.000 330.000,205.000 330.000,205.000 330.000,250.000 405.000,250.000 405.000,250.000 480.000,250.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<line x1="330" y1="85" x2="330" y2="265" stroke="#86868B" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="180" y1="285" x2="480" y2="285" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="770" y="70" font-size="24" fill="#1D1D1F" text-anchor="middle">STOP</text>
<text x="550" y="124" font-size="22" fill="#1D1D1F" text-anchor="start">SCL</text>
<text x="550" y="224" font-size="22" fill="#1D1D1F" text-anchor="start">SDA</text>
<polyline points="620.000,105.000 695.000,105.000 695.000,105.000 770.000,105.000 770.000,105.000 845.000,105.000 845.000,105.000 920.000,105.000" fill="none" stroke="#1D1D1F" stroke-width="3"/>
<polyline points="620.000,250.000 695.000,250.000 695.000,250.000 770.000,250.000 770.000,250.000 770.000,205.000 845.000,205.000 845.000,205.000 920.000,205.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<line x1="770" y1="85" x2="770" y2="265" stroke="#86868B" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="620" y1="285" x2="920" y2="285" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="325" font-size="24" fill="#1D1D1F" text-anchor="middle">Normale Datenwechsel erfolgen bei SCL LOW</text>
</svg>
