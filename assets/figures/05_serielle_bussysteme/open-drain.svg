<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<rect width="1200" height="480" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Open-Drain-Lehrrechnung. Vio = 3,3 V, Cb = 100 pF, IOL = 3 mA bei VOL,max = 0,4 V.</text>
<text x="16" y="46" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Annahme, keine Messung. tr = 0,8473 * Rp * Cb fuer 30 bis 70 Prozent.</text>
<text x="40" y="78" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">Vio</text>
<line x1="70" y1="86" x2="70" y2="120" stroke="#E65100" stroke-width="2"/>
<rect x="55" y="120" width="30" height="46" fill="#fff" stroke="#E65100" stroke-width="1.6"/>
<text x="60" y="148" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">Rp</text>
<line x1="70" y1="166" x2="70" y2="200" stroke="#1D1D1F" stroke-width="2"/>
<line x1="70" y1="200" x2="260" y2="200" stroke="#1565C0" stroke-width="2.4"/>
<text x="140" y="192" font-size="13" font-weight="400" fill="#1565C0" text-anchor="start">SDA oder SCL</text>
<line x1="260" y1="200" x2="260" y2="250" stroke="#5F6368" stroke-width="2"/>
<text x="268" y="230" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Cb</text>
<line x1="240" y1="250" x2="280" y2="250" stroke="#546E7A" stroke-width="2"/>
<line x1="120" y1="200" x2="120" y2="250" stroke="#1B5E20" stroke-width="2"/>
<line x1="180" y1="200" x2="180" y2="250" stroke="#B71C1C" stroke-width="2"/>
<text x="100" y="270" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">A</text>
<text x="168" y="270" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">B</text>
<line x1="90" y1="290" x2="210" y2="290" stroke="#546E7A" stroke-width="2"/>
<text x="230" y="288" font-size="14" font-weight="400" fill="#546E7A" text-anchor="start">GND</text>
<text x="340" y="100" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">beide los: HIGH</text>
<text x="340" y="128" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">nur A oder nur B: LOW</text>
<text x="340" y="156" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">beide ziehen: LOW</text>
<text x="340" y="184" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">HIGH heisst freigegeben, nicht aktiv getrieben.</text>
<text x="340" y="214" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Push-Pull HIGH gegen LOW ist ein Konflikt.</text>
<text x="340" y="242" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Open-Drain begrenzt diesen einen Fall, nicht jede Fehlverdrahtung.</text>
<text x="16" y="330" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Anstieg nach dem Loslassen, RC-Modell ab 0 V.</text>
