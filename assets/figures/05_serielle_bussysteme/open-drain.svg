<text x="224.5959206488904" y="383.0" font-size="13" font-weight="600" fill="#6A1B9A" text-anchor="start">70%</text>
<text x="560" y="360" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">4,7 kOhm: etwa 398 ns</text>
<text x="560" y="388" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">2,2 kOhm: etwa 186 ns</text>
<text x="560" y="416" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">Fast-Mode 300 ns: Rp,max etwa 3,54 kOhm</text>
<text x="560" y="444" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">Rp,min etwa 967 Ohm. 2,2 kOhm liegt dazwischen.</text>
<text x="16" y="472" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Zwei 4,7-kOhm-Modul-Pull-ups parallel: 2,35 kOhm. Standard-Mode-Grenze 1000 ns. Datenblattgrenzen extra pruefen.</text>
