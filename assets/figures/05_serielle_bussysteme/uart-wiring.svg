<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title">
<title id="title">UART-Sende- und Empfangspfade mit gemeinsamem Bezug</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="340" fill="#FFFFFF"/>
<rect x="30" y="55" width="235" height="195" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="147.5" y="160.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Endpunkt 1</text>
<rect x="735" y="55" width="235" height="195" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="852.5" y="160.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Endpunkt 2</text>
<text x="245" y="90" font-size="22" fill="#1D1D1F" text-anchor="end">TX</text>
<text x="755" y="90" font-size="22" fill="#1D1D1F" text-anchor="start">RX</text>
<text x="245" y="225" font-size="22" fill="#1D1D1F" text-anchor="end">RX</text>
<text x="755" y="225" font-size="22" fill="#1D1D1F" text-anchor="start">TX</text>
<line x1="265" y1="85" x2="730" y2="85" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="735" y1="220" x2="270" y2="220" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="55" font-size="22" fill="#1D1D1F" text-anchor="middle">Senden 1 → 2</text>
<text x="500" y="205" font-size="22" fill="#1D1D1F" text-anchor="middle">Senden 2 → 1</text>
<line x1="150" y1="280" x2="850" y2="280" stroke="#86868B" stroke-width="2"/>
<line x1="150" y1="250" x2="150" y2="280" stroke="#86868B" stroke-width="2"/>
<line x1="850" y1="250" x2="850" y2="280" stroke="#86868B" stroke-width="2"/>
<text x="500" y="315" font-size="24" fill="#1D1D1F" text-anchor="middle">Gemeinsamer GND-Bezug</text>
</svg>
