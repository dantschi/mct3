<text x="16" y="24" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="start">UART 8N1, 115200 Baud, Byte 0x53, LSB first. Ideales Modell.</text>
<text x="16" y="46" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Tbit = 1/115200 = 8,681 us. Tframe = 10 Tbit = 86,806 us. Even Parity von 0x53 ist 0.</text>
