<text x="162" y="214" font-size="13" font-weight="600" fill="#B71C1C" text-anchor="start">Startflanke</text>
<line x1="162" y1="70" x2="162" y2="160" stroke="#B71C1C" stroke-width="1" stroke-dasharray="4 3"/>
<text x="16" y="250" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Ein Datenbit, 16-fach, Beispiel mit drei Samples um die Mitte. Controller werten unterschiedlich viele.</text>
