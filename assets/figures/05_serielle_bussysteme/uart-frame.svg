<text x="264" y="368" font-size="14" font-weight="400" fill="#6A1B9A" text-anchor="middle">Mehrheit der markierten Samples, hier HIGH</text>
<text x="560" y="250" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Zwei Bitzeitraster laufen ueber den Frame auseinander.</text>
<text x="560" y="272" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Naechster gueltiger Start synchronisiert neu. Kein festes Toleranzlimit.</text>
<text x="560" y="304" font-size="13" font-weight="400" fill="#1565C0" text-anchor="start">Soll</text>
