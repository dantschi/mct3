<text x="16" y="410" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">0x53 hat vier Einsen. Even-Parity-Bit = 0. Ein einzelner Kipper faellt auf, zwei Kipper koennen bleiben.</text>
<text x="16" y="438" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Stop falsch = Framing-Fehler. Parity falsch = eigener Status. Beides ist noch kein Paketprotokoll.</text>
<text x="16" y="468" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Optional 8E1: 11 Symbole, Datenanteil 8/11 etwa 72,7 Prozent. Leitungsrate bleibt 115200 Baud.</text>
<text x="16" y="500" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Direkt 0/3,3 V nur bei gemeinsamem Bezug. Ein UART-Pin vertraegt deshalb noch keine RS-232-Pegel.</text>
</svg>
