<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 200" width="1100" height="200">
<rect width="1100" height="200" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="15" font-weight="400" fill="#5F6368">f_cnt = 1 MHz, berechnetes Modell, keine Messung.</text>
<text x="16" y="60" font-size="17" font-weight="600" fill="#1565C0">1 kHz: N = 1000, ARR = 999, Schritt 0,1 Prozent</text>
<text x="16" y="96" font-size="17" font-weight="600" fill="#E65100">4 kHz: N = 250, ARR = 249, Schritt 0,4 Prozent</text>
<text x="16" y="132" font-size="17" font-weight="600" fill="#6A1B9A">20 kHz: N = 50, ARR = 49, Schritt 2 Prozent</text>
<text x="16" y="176" font-size="16" font-weight="600" fill="#1D1D1F">Ein 16-Bit-Zaehler liefert bei kurzer Periode nicht 16 Bit Tastverhaeltnis.</text>
</svg>
