<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395" role="img" aria-labelledby="title">
<title id="title">Verspätete Softwareflanke im gewählten Wartezeitmodell</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="395" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">LOW-Wartezeit bleibt 50 µs · fallende Flanke 20 µs später</text>
<text x="20" y="104" font-size="24" fill="#1D1D1F" text-anchor="start">geplant</text>
<polyline points="220.000,65.000 510.000,65.000 510.000,65.000 510.000,115.000 800.000,115.000 800.000,115.000 800.000,65.000 916.000,65.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<text x="20" y="213" font-size="24" fill="#1D1D1F" text-anchor="start">verzögert</text>
<polyline points="220.000,175.000 626.000,175.000 626.000,175.000 626.000,225.000 916.000,225.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<line x1="510" y1="50" x2="510" y2="265" stroke="#86868B" stroke-width="1" stroke-dasharray="6 5"/>
<line x1="626" y1="165" x2="626" y2="265" stroke="#86868B" stroke-width="1" stroke-dasharray="6 5"/>
<line x1="220" y1="265" x2="916" y2="265" stroke="#86868B" stroke-width="2"/>
<text x="916" y="325" font-size="22" fill="#1D1D1F" text-anchor="end">Zeit / µs</text>
<line x1="220" y1="260" x2="220" y2="270" stroke="#86868B" stroke-width="2"/>
<text x="220" y="294" font-size="22" fill="#1D1D1F" text-anchor="middle">0</text>
<line x1="510" y1="260" x2="510" y2="270" stroke="#86868B" stroke-width="2"/>
<text x="510" y="294" font-size="22" fill="#1D1D1F" text-anchor="middle">50</text>
<line x1="626" y1="260" x2="626" y2="270" stroke="#86868B" stroke-width="2"/>
<text x="626" y="294" font-size="22" fill="#1D1D1F" text-anchor="middle">70</text>
<line x1="800" y1="260" x2="800" y2="270" stroke="#86868B" stroke-width="2"/>
<text x="800" y="294" font-size="22" fill="#1D1D1F" text-anchor="middle">100</text>
<line x1="916" y1="260" x2="916" y2="270" stroke="#86868B" stroke-width="2"/>
<text x="916" y="294" font-size="22" fill="#1D1D1F" text-anchor="middle">120</text>
<text x="500" y="365" font-size="24" fill="#1D1D1F" text-anchor="middle">HIGH: 70 µs · LOW: 50 µs · neue Periode: 120 µs</text>
</svg>
