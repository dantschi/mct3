<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title">
<title id="title">Programmstillstand, weiterlaufendes PWM-Muster und Resetdomänen</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="380" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Letzter Feed: 1 s · Hänger: 1,2 s · idealer Reset: 3 s</text>
<text x="20" y="106" font-size="24" fill="#1D1D1F" text-anchor="start">Hauptprogramm</text>
<rect x="260" y="75" width="228.0" height="45" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="270" y="106" font-size="22" fill="#1D1D1F" text-anchor="start">Fortschritt</text>
<text x="503.0" y="106" font-size="22" fill="#1D1D1F" text-anchor="start">hängt</text>
<text x="20" y="206" font-size="24" fill="#1D1D1F" text-anchor="start">Hardware-PWM</text>
<rect x="260" y="175" width="570" height="45" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="270" y="206" font-size="22" fill="#1D1D1F" text-anchor="start">letztes Signalmuster kann weiterlaufen</text>
<rect x="830" y="75" width="140" height="145" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="900" y="105" font-size="22" fill="#1D1D1F" text-anchor="middle">Zustand</text>
<text x="900" y="135" font-size="22" fill="#1D1D1F" text-anchor="middle">prüfen</text>
<line x1="488.0" y1="57" x2="488.0" y2="238" stroke="#86868B" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="830" y1="57" x2="830" y2="238" stroke="#E2001A" stroke-width="3"/>
<line x1="260" y1="245" x2="970" y2="245" stroke="#86868B" stroke-width="2"/>
<text x="970" y="305" font-size="22" fill="#1D1D1F" text-anchor="end">Zeit seit Start / s</text>
<line x1="260" y1="240" x2="260" y2="250" stroke="#86868B" stroke-width="2"/>
<text x="260" y="274" font-size="22" fill="#1D1D1F" text-anchor="middle">0</text>
<line x1="488.0" y1="240" x2="488.0" y2="250" stroke="#86868B" stroke-width="2"/>
<text x="488.0" y="274" font-size="22" fill="#1D1D1F" text-anchor="middle">1,2</text>
<line x1="830" y1="240" x2="830" y2="250" stroke="#86868B" stroke-width="2"/>
<text x="830" y="274" font-size="22" fill="#1D1D1F" text-anchor="middle">3</text>
<text x="500" y="350" font-size="23" fill="#1D1D1F" text-anchor="middle">Resetdomänen und externe Versorgung bestimmen den Ausgang</text>
</svg>
