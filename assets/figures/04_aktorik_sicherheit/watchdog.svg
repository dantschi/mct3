<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="308" viewBox="0 0 1000 308" role="img" aria-labelledby="title">
<title id="title">Feed-Zeitpunkte und Watchdogfrist bis zum idealen Reset</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="308" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Ideales Timeout: 2 s · jeder Feed startet die Frist neu</text>
<line x1="350" y1="155" x2="850" y2="155" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600.0" y="138" font-size="24" fill="#1D1D1F" text-anchor="middle">2 s ab letztem Feed</text>
<line x1="400.0" y1="95" x2="400.0" y2="238" stroke="#86868B" stroke-width="2" stroke-dasharray="6 5"/>
<text x="412.0" y="88" font-size="22" fill="#1D1D1F" text-anchor="start">Hänger ab 1,2 s</text>
<line x1="850" y1="60" x2="850" y2="238" stroke="#E2001A" stroke-width="3"/>
<text x="850" y="48" font-size="24" fill="#1D1D1F" text-anchor="middle">Reset</text>
<line x1="100" y1="180" x2="100" y2="230" stroke="#E2001A" stroke-width="3"/>
<text x="100" y="176" font-size="22" fill="#1D1D1F" text-anchor="middle">Feed</text>
<line x1="225.0" y1="180" x2="225.0" y2="230" stroke="#E2001A" stroke-width="3"/>
<text x="225.0" y="176" font-size="22" fill="#1D1D1F" text-anchor="middle">Feed</text>
<line x1="350" y1="180" x2="350" y2="230" stroke="#E2001A" stroke-width="3"/>
<text x="350" y="176" font-size="22" fill="#1D1D1F" text-anchor="middle">Feed</text>
<line x1="100" y1="238" x2="900" y2="238" stroke="#86868B" stroke-width="2"/>
<text x="900" y="298" font-size="22" fill="#1D1D1F" text-anchor="end">Zeit seit Start / s</text>
<line x1="100" y1="233" x2="100" y2="243" stroke="#86868B" stroke-width="2"/>
<text x="100" y="267" font-size="22" fill="#1D1D1F" text-anchor="middle">0</text>
<line x1="225.0" y1="233" x2="225.0" y2="243" stroke="#86868B" stroke-width="2"/>
<text x="225.0" y="267" font-size="22" fill="#1D1D1F" text-anchor="middle">0,5</text>
<line x1="350" y1="233" x2="350" y2="243" stroke="#86868B" stroke-width="2"/>
<text x="350" y="267" font-size="22" fill="#1D1D1F" text-anchor="middle">1</text>
<line x1="600" y1="233" x2="600" y2="243" stroke="#86868B" stroke-width="2"/>
<text x="600" y="267" font-size="22" fill="#1D1D1F" text-anchor="middle">2</text>
<line x1="850" y1="233" x2="850" y2="243" stroke="#86868B" stroke-width="2"/>
<text x="850" y="267" font-size="22" fill="#1D1D1F" text-anchor="middle">3</text>
</svg>
