<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="398" viewBox="0 0 1000 398" role="img" aria-labelledby="title">
<title id="title">Rechtecksignale mit 25, 50 und 75 Prozent HIGH</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="398" fill="#FFFFFF"/>
<text x="20" y="28" font-size="24" fill="#1D1D1F" text-anchor="start">Gleiche Pegel 0 / 3,3 V · gleiche Periode T = 1 ms</text>
<text x="20" y="88" font-size="24" fill="#1D1D1F" text-anchor="start">D = 25 %</text>
<polyline points="200.000,60.000 380.000,60.000 380.000,60.000 380.000,108.000 920.000,108.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<line x1="380.0" y1="60" x2="380.0" y2="330" stroke="#86868B" stroke-width="1" stroke-dasharray="6 5"/>
<text x="20" y="178" font-size="24" fill="#1D1D1F" text-anchor="start">D = 50 %</text>
<polyline points="200.000,150.000 560.000,150.000 560.000,150.000 560.000,198.000 920.000,198.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<line x1="560.0" y1="150" x2="560.0" y2="330" stroke="#86868B" stroke-width="1" stroke-dasharray="6 5"/>
<text x="20" y="268" font-size="24" fill="#1D1D1F" text-anchor="start">D = 75 %</text>
<polyline points="200.000,240.000 740.000,240.000 740.000,240.000 740.000,288.000 920.000,288.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<line x1="740.0" y1="240" x2="740.0" y2="330" stroke="#86868B" stroke-width="1" stroke-dasharray="6 5"/>
<line x1="200" y1="330" x2="920" y2="330" stroke="#86868B" stroke-width="2"/>
<text x="920" y="390" font-size="22" fill="#1D1D1F" text-anchor="end">Zeit / µs</text>
<line x1="200" y1="325" x2="200" y2="335" stroke="#86868B" stroke-width="2"/>
<text x="200" y="359" font-size="22" fill="#1D1D1F" text-anchor="middle">0</text>
<line x1="380" y1="325" x2="380" y2="335" stroke="#86868B" stroke-width="2"/>
<text x="380" y="359" font-size="22" fill="#1D1D1F" text-anchor="middle">250</text>
<line x1="560" y1="325" x2="560" y2="335" stroke="#86868B" stroke-width="2"/>
<text x="560" y="359" font-size="22" fill="#1D1D1F" text-anchor="middle">500</text>
<line x1="740" y1="325" x2="740" y2="335" stroke="#86868B" stroke-width="2"/>
<text x="740" y="359" font-size="22" fill="#1D1D1F" text-anchor="middle">750</text>
<line x1="920" y1="325" x2="920" y2="335" stroke="#86868B" stroke-width="2"/>
<text x="920" y="359" font-size="22" fill="#1D1D1F" text-anchor="middle">1000</text>
</svg>
