<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-labelledby="title">
<title id="title">Frühes, gültiges und abgelaufenes Watchdog-Zeitfenster</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="365" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Modell: 0,5 s &lt; Alter seit letztem Feed &lt; 2 s</text>
<rect x="295.0" y="90" width="525.0" height="115" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="557.5" y="123" font-size="24" fill="#1D1D1F" text-anchor="middle">zulässiges Fenster</text>
<line x1="190.0" y1="176" x2="190.0" y2="225" stroke="#E2001A" stroke-width="3"/>
<text x="190.0" y="166" font-size="22" fill="#1D1D1F" text-anchor="middle">zu früh</text>
<line x1="470" y1="176" x2="470" y2="225" stroke="#E2001A" stroke-width="3"/>
<text x="470" y="166" font-size="22" fill="#1D1D1F" text-anchor="middle">zeitlich gültig</text>
<line x1="855.0" y1="86" x2="855.0" y2="225" stroke="#E2001A" stroke-width="3"/>
<text x="855.0" y="76" font-size="22" fill="#1D1D1F" text-anchor="middle">abgelaufen</text>
<line x1="120" y1="230" x2="925" y2="230" stroke="#86868B" stroke-width="2"/>
<text x="925" y="290" font-size="22" fill="#1D1D1F" text-anchor="end">Alter / s</text>
<line x1="120" y1="225" x2="120" y2="235" stroke="#86868B" stroke-width="2"/>
<text x="120" y="259" font-size="22" fill="#1D1D1F" text-anchor="middle">0</text>
<line x1="295.0" y1="225" x2="295.0" y2="235" stroke="#86868B" stroke-width="2"/>
<text x="295.0" y="259" font-size="22" fill="#1D1D1F" text-anchor="middle">0,5</text>
<line x1="470" y1="225" x2="470" y2="235" stroke="#86868B" stroke-width="2"/>
<text x="470" y="259" font-size="22" fill="#1D1D1F" text-anchor="middle">1</text>
<line x1="820" y1="225" x2="820" y2="235" stroke="#86868B" stroke-width="2"/>
<text x="820" y="259" font-size="22" fill="#1D1D1F" text-anchor="middle">2</text>
<text x="500" y="335" font-size="24" fill="#1D1D1F" text-anchor="middle">Zeitlich gültig reicht nur mit frischem Fortschritt</text>
</svg>
