<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title">
<title id="title">Vorteiler, Zählwerk und Vergleich des PWM-Timers</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="270" fill="#FFFFFF"/>
<rect x="20" y="50" width="180" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="110.0" y="85.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Timereingang</text>
<text x="110.0" y="115.5" font-size="24" fill="#1D1D1F" text-anchor="middle">100 MHz</text>
<rect x="265" y="50" width="190" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="360.0" y="85.5" font-size="24" fill="#1D1D1F" text-anchor="middle">PSC = 99</text>
<text x="360.0" y="115.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Teiler = 100</text>
<rect x="520" y="50" width="210" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="625.0" y="85.5" font-size="24" fill="#1D1D1F" text-anchor="middle">CNT: Zählwerk</text>
<text x="625.0" y="115.5" font-size="24" fill="#1D1D1F" text-anchor="middle">1 MHz → 1 µs</text>
<rect x="790" y="50" width="190" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="885.0" y="85.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Vergleich</text>
<text x="885.0" y="115.5" font-size="24" fill="#1D1D1F" text-anchor="middle">CNT &lt; CCR</text>
<line x1="200" y1="93" x2="260" y2="93" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="455" y1="93" x2="515" y2="93" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="730" y1="93" x2="785" y2="93" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="625" y="192" font-size="24" fill="#1D1D1F" text-anchor="middle">ARR = 999: 0 … 999</text>
<line x1="625" y1="163" x2="625" y2="140" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="885" y="242" font-size="24" fill="#1D1D1F" text-anchor="middle">CCR = 250</text>
<line x1="885" y1="213" x2="885" y2="140" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="30" y="244" font-size="24" fill="#1D1D1F" text-anchor="start">PSC + 1 teilt den Eingangstakt</text>
</svg>
