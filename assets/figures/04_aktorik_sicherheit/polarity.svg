<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395" role="img" aria-labelledby="title">
<title id="title">Active-High und Active-Low bei gleichem aktiven Zeitanteil</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="395" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Aktiver Anteil = 25 % · gleiche Vergleichsbedingung</text>
<text x="20" y="90" font-size="24" fill="#1D1D1F" text-anchor="start">Active-High</text>
<polyline points="230.000,65.000 402.500,65.000 402.500,65.000 402.500,113.000 920.000,113.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<text x="316" y="53" font-size="22" fill="#1D1D1F" text-anchor="middle">aktive Zeit</text>
<text x="20" y="200" font-size="24" fill="#1D1D1F" text-anchor="start">Active-Low</text>
<polyline points="230.000,223.000 402.500,223.000 402.500,223.000 402.500,175.000 920.000,175.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<text x="316" y="163" font-size="22" fill="#1D1D1F" text-anchor="middle">aktive Zeit</text>
<line x1="230" y1="270" x2="920" y2="270" stroke="#86868B" stroke-width="2"/>
<text x="920" y="330" font-size="22" fill="#1D1D1F" text-anchor="end">Zeit / µs</text>
<line x1="230" y1="265" x2="230" y2="275" stroke="#86868B" stroke-width="2"/>
<text x="230" y="299" font-size="22" fill="#1D1D1F" text-anchor="middle">0</text>
<line x1="402.5" y1="265" x2="402.5" y2="275" stroke="#86868B" stroke-width="2"/>
<text x="402.5" y="299" font-size="22" fill="#1D1D1F" text-anchor="middle">250</text>
<line x1="920" y1="265" x2="920" y2="275" stroke="#86868B" stroke-width="2"/>
<text x="920" y="299" font-size="22" fill="#1D1D1F" text-anchor="middle">1000</text>
<text x="500" y="370" font-size="24" fill="#1D1D1F" text-anchor="middle">HIGH-Anteil: oben 25 %, unten 75 %</text>
</svg>
