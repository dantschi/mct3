<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375" viewBox="0 0 1000 375" role="img" aria-labelledby="title">
<title id="title">Drei Compare-Kanäle teilen ein Zählwerk und eine Periode</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="375" fill="#FFFFFF"/>
<rect x="25" y="105" width="285" height="105" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="167.5" y="150.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Ein CNT, ein ARR</text>
<text x="167.5" y="180.5" font-size="24" fill="#1D1D1F" text-anchor="middle">N = 1000 · f = 1 kHz</text>
<rect x="490" y="30" width="235" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="607.5" y="73.0" font-size="24" fill="#1D1D1F" text-anchor="middle">CCR1 = 250</text>
<line x1="365" y1="65" x2="485" y2="65" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="725" y1="65" x2="810" y2="65" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="830" y="73" font-size="24" fill="#1D1D1F" text-anchor="start">Rot</text>
<rect x="490" y="145" width="235" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="607.5" y="188.0" font-size="24" fill="#1D1D1F" text-anchor="middle">CCR2 = 500</text>
<line x1="365" y1="180" x2="485" y2="180" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="725" y1="180" x2="810" y2="180" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="830" y="188" font-size="24" fill="#1D1D1F" text-anchor="start">Grün</text>
<rect x="490" y="260" width="235" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="607.5" y="303.0" font-size="24" fill="#1D1D1F" text-anchor="middle">CCR3 = 0</text>
<line x1="365" y1="295" x2="485" y2="295" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="725" y1="295" x2="810" y2="295" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="830" y="303" font-size="24" fill="#1D1D1F" text-anchor="start">Blau</text>
<line x1="310" y1="157" x2="365" y2="157" stroke="#1D1D1F" stroke-width="2"/>
<line x1="365" y1="65" x2="365" y2="295" stroke="#1D1D1F" stroke-width="2"/>
<text x="25" y="345" font-size="24" fill="#1D1D1F" text-anchor="start">Je Kanal eigener Compare-Wert, aber gleiche Periode</text>
</svg>
