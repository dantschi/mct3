<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="397" viewBox="0 0 1000 397" role="img" aria-labelledby="title">
<title id="title">Servo-Kommandoimpulse bei 50 Hertz und einem MHz Zähltakt</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="397" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Gewähltes Servoformat · drei alternative Pulse · T = 20 ms</text>
<text x="20" y="91" font-size="24" fill="#1D1D1F" text-anchor="start">1 ms</text>
<polyline points="210.000,65.000 245.000,65.000 245.000,65.000 245.000,113.000 910.000,113.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<text x="430" y="90" font-size="22" fill="#1D1D1F" text-anchor="start">CCR = 1000</text>
<text x="20" y="181" font-size="24" fill="#1D1D1F" text-anchor="start">1,5 ms</text>
<polyline points="210.000,155.000 262.500,155.000 262.500,155.000 262.500,203.000 910.000,203.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<text x="430" y="180" font-size="22" fill="#1D1D1F" text-anchor="start">CCR = 1500</text>
<text x="20" y="271" font-size="24" fill="#1D1D1F" text-anchor="start">2 ms</text>
<polyline points="210.000,245.000 280.000,245.000 280.000,245.000 280.000,293.000 910.000,293.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<text x="430" y="270" font-size="22" fill="#1D1D1F" text-anchor="start">CCR = 2000</text>
<line x1="210" y1="330" x2="910" y2="330" stroke="#86868B" stroke-width="2"/>
<text x="910" y="390" font-size="22" fill="#1D1D1F" text-anchor="end">Zeit / ms</text>
<line x1="210" y1="325" x2="210" y2="335" stroke="#86868B" stroke-width="2"/>
<text x="210" y="359" font-size="22" fill="#1D1D1F" text-anchor="middle">0</text>
<line x1="560" y1="325" x2="560" y2="335" stroke="#86868B" stroke-width="2"/>
<text x="560" y="359" font-size="22" fill="#1D1D1F" text-anchor="middle">10</text>
<line x1="910" y1="325" x2="910" y2="335" stroke="#86868B" stroke-width="2"/>
<text x="910" y="359" font-size="22" fill="#1D1D1F" text-anchor="middle">20</text>
</svg>
