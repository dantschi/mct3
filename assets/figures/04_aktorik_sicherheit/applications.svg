<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250">
<rect width="1100" height="250" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="15" font-weight="400" fill="#5F6368">Drei Anwendungen, drei Perioden. RC ist kein Motortreiber.</text>
<text x="16" y="52" font-size="15" font-weight="600" fill="#1565C0">RC: 1 kOhm, 10 uF, 1 kHz, 25 Prozent. Tau 10 ms, fc etwa 15,9 Hz, Mittel 0,825 V.</text>
<text x="16" y="84" font-size="15" font-weight="600" fill="#1565C0">Unbelastete Welligkeit etwa 61,9 mV. 95 Prozent eines Sprungs etwa 30 ms.</text>
<text x="16" y="124" font-size="15" font-weight="600" fill="#E65100">Servo: 20 ms, Pulse 1,0 / 1,5 / 2,0 ms. ARR = 19999, CCR = 1000 / 1500 / 2000 bei 1 MHz.</text>
<text x="16" y="168" font-size="15" font-weight="600" fill="#6A1B9A">H-Bruecke: 3,3 V steuern, z. B. 12 V leisten. Keine komplementaeren Roh-Gates ohne Totzeit.</text>
<text x="16" y="214" font-size="15" font-weight="400" fill="#5F6368">Winkel und Wiederholrate sind servospezifisch.</text>
</svg>
