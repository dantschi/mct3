<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title">
<title id="title">Ladungsteilung, Verstärken und Wiederherstellen</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="410" fill="#FFFFFF"/>
<text x="500" y="32" font-size="25" fill="#1D1D1F" text-anchor="middle">BL: hoher und niedriger Zellfall als Alternativen</text>
<line x1="100" y1="160" x2="920" y2="160" stroke="#86868B" stroke-width="2" stroke-dasharray="6 5"/>
<text x="30" y="167" font-size="20" fill="#1D1D1F" text-anchor="start">½ VDD</text>
<polyline points="110.000,160.000 280.000,160.000 430.000,140.000 600.000,65.000 745.000,65.000 900.000,160.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<polyline points="110.000,160.000 280.000,160.000 430.000,180.000 600.000,255.000 745.000,255.000 900.000,160.000" fill="none" stroke="#86868B" stroke-width="3"/>
<text x="110" y="315" font-size="21" fill="#1D1D1F" text-anchor="middle">vorladen</text>
<text x="280" y="315" font-size="21" fill="#1D1D1F" text-anchor="middle">WL ↑</text>
<text x="430" y="315" font-size="21" fill="#1D1D1F" text-anchor="middle">teilen</text>
<text x="600" y="315" font-size="21" fill="#1D1D1F" text-anchor="middle">Sense / Restore</text>
<text x="745" y="315" font-size="21" fill="#1D1D1F" text-anchor="middle">WL ↓</text>
<text x="900" y="315" font-size="21" fill="#1D1D1F" text-anchor="middle">Precharge</text>
<text x="500" y="372" font-size="24" fill="#1D1D1F" text-anchor="middle">Restore: Zelle verbunden; Precharge: Zelle bereits getrennt.</text>
</svg>
