<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title">
<title id="title">Drei DRAM-Ausgangszustände und ihre Lesevorbereitung</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="405" fill="#FFFFFF"/>
<text x="20" y="80" font-size="24" fill="#1D1D1F" text-anchor="start">passende Zeile offen</text>
<rect x="345" y="30" width="185" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="437.5" y="78.0" font-size="24" fill="#1D1D1F" text-anchor="middle">READ</text>
<text x="20" y="180" font-size="24" fill="#1D1D1F" text-anchor="start">Bank geschlossen</text>
<rect x="345" y="130" width="185" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="437.5" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">ACTIVATE</text>
<rect x="555" y="130" width="185" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="647.5" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">READ</text>
<line x1="535" y1="170" x2="550" y2="170" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="280" font-size="24" fill="#1D1D1F" text-anchor="start">andere Zeile offen</text>
<rect x="345" y="230" width="185" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="437.5" y="278.0" font-size="24" fill="#1D1D1F" text-anchor="middle">PRECHARGE</text>
<rect x="555" y="230" width="185" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="647.5" y="278.0" font-size="24" fill="#1D1D1F" text-anchor="middle">ACTIVATE</text>
<line x1="535" y1="270" x2="550" y2="270" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="765" y="230" width="185" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="857.5" y="278.0" font-size="24" fill="#1D1D1F" text-anchor="middle">READ</text>
<line x1="745" y1="270" x2="760" y2="270" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="370" font-size="23" fill="#1D1D1F" text-anchor="middle">Reihenfolge ohne konkrete Befehlsabstände oder Latenzwerte</text>
</svg>
