<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220">
<rect width="1000" height="220" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">1 MiB = 8388608 Bit. Nur Zellbauelemente, keine Flaeche und keine Kosten.</text>
<text x="16" y="70" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">20T-Vergleich: 167772160 Transistoren</text>
<text x="16" y="110" font-size="18" font-weight="600" fill="#1565C0" text-anchor="start">6T-SRAM: 50331648 Transistoren</text>
<text x="16" y="150" font-size="18" font-weight="600" fill="#6A1B9A" text-anchor="start">1T1C: 8388608 Transistoren und 8388608 Kondensatoren</text>
<text x="16" y="200" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Peripherie, Leitungen und ECC fehlen. 20T ist eine Lehrannahme.</text>
</svg>
