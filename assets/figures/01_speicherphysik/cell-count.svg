<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title">
<title id="title">Kapazität und Zellbauteile für ein MiB</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="280" fill="#FFFFFF"/>
<text x="500" y="38" font-size="28" fill="#1D1D1F" text-anchor="middle">1 MiB = 1 048 576 Byte = 8 388 608 Bit</text>
<rect x="30" y="80" width="445" height="115" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="252.5" y="130.5" font-size="24" fill="#1D1D1F" text-anchor="middle">6T-SRAM</text>
<text x="252.5" y="160.5" font-size="24" fill="#1D1D1F" text-anchor="middle">50 331 648 Zelltransistoren</text>
<rect x="525" y="80" width="445" height="115" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="747.5" y="115.5" font-size="24" fill="#1D1D1F" text-anchor="middle">1T1C-DRAM</text>
<text x="747.5" y="145.5" font-size="24" fill="#1D1D1F" text-anchor="middle">8 388 608 Transistoren</text>
<text x="747.5" y="175.5" font-size="24" fill="#1D1D1F" text-anchor="middle">8 388 608 Kondensatoren</text>
<text x="500" y="247" font-size="22" fill="#1D1D1F" text-anchor="middle">Nur Zellbauteile; Decoder, Verstärker und weitere Peripherie fehlen.</text>
</svg>
