<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title">
<title id="title">Vier-Plätze-Ringpuffer mit expliziter Belegung</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="405" fill="#FFFFFF"/>
<text x="500" y="35" font-size="26" fill="#1D1D1F" text-anchor="middle">Nach A, B, C einlegen · A entnehmen · D, E einlegen</text>
<rect x="30" y="100" width="215" height="110" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="137.5" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Platz 0</text>
<text x="137.5" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">E</text>
<rect x="275" y="100" width="215" height="110" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="382.5" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Platz 1</text>
<text x="382.5" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">B</text>
<rect x="520" y="100" width="215" height="110" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="627.5" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Platz 2</text>
<text x="627.5" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">C</text>
<rect x="765" y="100" width="215" height="110" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="872.5" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Platz 3</text>
<text x="872.5" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">D</text>
<text x="382" y="255" font-size="27" fill="#E2001A" text-anchor="middle">r = w = 1</text>
<text x="500" y="320" font-size="25" fill="#1D1D1F" text-anchor="middle">count = 4 → voll; Entnahmereihenfolge B, C, D, E</text>
<text x="500" y="370" font-size="24" fill="#1D1D1F" text-anchor="middle">Anfangs r = w = 0, count = 0 → leer</text>
</svg>
