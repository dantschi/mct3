<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" width="980" height="280">
<rect width="980" height="280" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Ringpuffer, ein Taktbereich. Async-FIFO braucht extra Synchronisation.</text>
<rect x="40" y="70" width="70" height="50" fill="#FFF" stroke="#1D1D1F"/>
<text x="68" y="102" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">0</text>
<rect x="130" y="70" width="70" height="50" fill="#E3F2FD" stroke="#1D1D1F"/>
<text x="158" y="102" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">1</text>
<rect x="220" y="70" width="70" height="50" fill="#E3F2FD" stroke="#1D1D1F"/>
<text x="248" y="102" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">2</text>
<rect x="310" y="70" width="70" height="50" fill="#E3F2FD" stroke="#1D1D1F"/>
<text x="338" y="102" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">3</text>
<rect x="400" y="70" width="70" height="50" fill="#FFF" stroke="#1D1D1F"/>
<text x="428" y="102" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">4</text>
<rect x="490" y="70" width="70" height="50" fill="#FFF" stroke="#1D1D1F"/>
<text x="518" y="102" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">5</text>
<rect x="580" y="70" width="70" height="50" fill="#FFF" stroke="#1D1D1F"/>
<text x="608" y="102" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">6</text>
<rect x="670" y="70" width="70" height="50" fill="#FFF" stroke="#1D1D1F"/>
<text x="698" y="102" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">7</text>
<text x="120" y="150" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">R</text>
<text x="300" y="150" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">W</text>
<text x="16" y="200" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Push erhöht W, Pop erhöht R, beide mit Wraparound.</text>
<text x="16" y="228" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Empty: R=W. Full: nächster W würde R treffen (Konvention des Zählers).</text>
<text x="16" y="260" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">UART: Watermark löst einen Interrupt aus, nicht ein Interrupt pro Bit.</text>
</svg>
