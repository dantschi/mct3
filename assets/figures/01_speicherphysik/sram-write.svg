<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320">
<rect width="1100" height="320" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<rect x="16" y="10" width="16" height="8" fill="#1565C0"/>
<text x="38" y="19" font-size="16" font-weight="500" fill="#1565C0" text-anchor="start">Daten</text>
<rect x="106" y="10" width="16" height="8" fill="#E65100"/>
<text x="128" y="19" font-size="16" font-weight="500" fill="#E65100" text-anchor="start">Steuerung</text>
<rect x="246" y="10" width="16" height="8" fill="#6A1B9A"/>
<text x="268" y="19" font-size="16" font-weight="500" fill="#6A1B9A" text-anchor="start">Zustand/Ladung</text>
<text x="446" y="19" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start">schematisch, nicht maßstabsgetreu</text>
<rect x="16" y="40" width="344" height="260" rx="8" fill="#FAFAFB" stroke="#E5E5EA"/>
<text x="28" y="66" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">1  Treiber setzen</text>
<text x="36" y="100" font-size="20" font-weight="600" fill="#1565C0" text-anchor="start">BL = 1, BL = 0</text>
<text x="36" y="140" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Schreibtreiber staerker als Zell-Pull</text>
<text x="36" y="190" font-size="18" font-weight="600" fill="#6A1B9A" text-anchor="start">Beispiel Q: 0 → 1</text>
<text x="36" y="230" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">keine universelle Groessenregel</text>
<rect x="376" y="40" width="344" height="260" rx="8" fill="#FAFAFB" stroke="#E5E5EA"/>
<text x="388" y="66" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">2  WL = 1</text>
<text x="396" y="100" font-size="20" font-weight="600" fill="#1565C0" text-anchor="start">Zugriff offen</text>
<text x="396" y="140" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Q kippt von 0 auf 1</text>
<text x="396" y="190" font-size="18" font-weight="600" fill="#6A1B9A" text-anchor="start">Beispiel Q: 0 → 1</text>
<text x="396" y="230" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">keine universelle Groessenregel</text>
<rect x="736" y="40" width="344" height="260" rx="8" fill="#FAFAFB" stroke="#E5E5EA"/>
<text x="748" y="66" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">3  WL = 0</text>
<text x="756" y="100" font-size="20" font-weight="600" fill="#1565C0" text-anchor="start">Zelle isoliert</text>
<text x="756" y="140" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">neuer Zustand bleibt im Ring</text>
<text x="756" y="190" font-size="18" font-weight="600" fill="#6A1B9A" text-anchor="start">Beispiel Q: 0 → 1</text>
<text x="756" y="230" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">keine universelle Groessenregel</text>
</svg>
