<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title">
<title id="title">Lehr-Memory-Map mit expliziten Grenzen</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="380" fill="#FFFFFF"/>
<rect x="260" y="30" width="475" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="497.5" y="73.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Flash</text>
<text x="497.5" y="103.0" font-size="24" fill="#1D1D1F" text-anchor="middle">256 KiB</text>
<text x="20" y="65" font-size="23" fill="#1D1D1F" text-anchor="start">Start</text>
<text x="20" y="103" font-size="23" fill="#1D1D1F" text-anchor="start">0x00000000</text>
<text x="770" y="65" font-size="23" fill="#1D1D1F" text-anchor="start">Ende exklusiv</text>
<text x="770" y="103" font-size="23" fill="#1D1D1F" text-anchor="start">0x00040000</text>
<text x="500" y="167" font-size="24" fill="#1D1D1F" text-anchor="middle">Letztes Byte: 0x0003FFFF</text>
<rect x="260" y="205" width="475" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="497.5" y="248.0" font-size="24" fill="#1D1D1F" text-anchor="middle">SRAM</text>
<text x="497.5" y="278.0" font-size="24" fill="#1D1D1F" text-anchor="middle">64 KiB</text>
<text x="20" y="240" font-size="23" fill="#1D1D1F" text-anchor="start">Start</text>
<text x="20" y="278" font-size="23" fill="#1D1D1F" text-anchor="start">0x10000000</text>
<text x="770" y="240" font-size="23" fill="#1D1D1F" text-anchor="start">Ende exklusiv</text>
<text x="770" y="278" font-size="23" fill="#1D1D1F" text-anchor="start">0x10010000</text>
<text x="500" y="342" font-size="24" fill="#1D1D1F" text-anchor="middle">Letztes Byte: 0x1000FFFF</text>
</svg>
