<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460">
<rect width="1100" height="460" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start">Schematische MCU-Map — keine STM32-/SiFive-Adressen</text>
<rect x="30" y="40" width="280" height="360" fill="#FFF8E1" stroke="#E65100"/>
<text x="40" y="64" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">FLASH (LMA)</text>
<text x="40" y="110" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">.text   Code</text>
<text x="40" y="150" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">.rodata  table[]</text>
<text x="40" y="190" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">.data-Image  counter=3</text>
<text x="40" y="250" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">kein .bss-Array</text>
<rect x="400" y="40" width="300" height="360" fill="#E3F2FD" stroke="#1565C0"/>
<text x="410" y="64" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">RAM (VMA)</text>
<text x="410" y="120" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">.data  counter</text>
<text x="410" y="170" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">.bss   buffer[16]</text>
<text x="410" y="230" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Heap  ↑ Beispiel</text>
<text x="410" y="300" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Stack ↓ Beispiel</text>
<rect x="760" y="40" width="310" height="300" fill="#FFF" stroke="#1D1D1F"/>
<text x="776" y="70" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">Startup</text>
<text x="776" y="110" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">1 Stack-Pointer setzen</text>
<text x="776" y="150" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">2 .data Flash→RAM kopieren</text>
<text x="776" y="190" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">3 .bss auf 0 setzen</text>
<text x="776" y="230" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">4 main() aufrufen</text>
<text x="16" y="430" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">static const uint32_t table[]={1,2};  uint32_t counter=3;  uint32_t buffer[16];</text>
</svg>
