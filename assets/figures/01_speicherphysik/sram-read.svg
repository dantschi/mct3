<text x="420" y="66" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">2  WL an, kleine Differenz</text>
<text x="424" y="90" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">BL</text>
<text x="424" y="118" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">BL</text>
<line x1="478" y1="78" x2="658" y2="78" stroke="#1565C0" stroke-width="3"/>
<line x1="494" y1="64" x2="518" y2="64" stroke="#1565C0"/>
<line x1="478" y1="108" x2="658" y2="108" stroke="#1565C0" stroke-width="3"/>
<path d="M 498 78 Q 568 92 638 86" fill="none" stroke="#6A1B9A" stroke-width="2.5"/>
<text x="558" y="150" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="middle">delta V klein</text>
