<text x="446" y="19" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start">schematisch, nicht maßstabsgetreu</text>
<rect x="16" y="40" width="376" height="280" rx="8" fill="#FAFAFB" stroke="#E5E5EA"/>
<text x="28" y="66" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">1  BL und BL vorladen</text>
