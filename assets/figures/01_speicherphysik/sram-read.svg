<text x="166" y="74" font-size="16" font-weight="600" fill="#1565C0" text-anchor="middle">VDD</text>
<text x="166" y="104" font-size="16" font-weight="600" fill="#1565C0" text-anchor="middle">VDD</text>
<text x="32" y="250" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start">beide Leitungen hoch, Zelle isoliert</text>
