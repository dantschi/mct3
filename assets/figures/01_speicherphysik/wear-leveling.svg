<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title">
<title id="title">Verschleißverteilung als Modell physischer Löschzyklen</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="390" fill="#FFFFFF"/>
<text x="500" y="35" font-size="27" fill="#1D1D1F" text-anchor="middle">Sechs physische Löschzyklen auf drei Blöcken</text>
<text x="30" y="142" font-size="24" fill="#1D1D1F" text-anchor="start">einseitig</text>
<rect x="225" y="100" width="210" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="330.0" y="133.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Block 0</text>
<text x="330.0" y="163.0" font-size="24" fill="#1D1D1F" text-anchor="middle">6 Löschzyklen</text>
<rect x="470" y="100" width="210" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="575.0" y="133.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Block 1</text>
<text x="575.0" y="163.0" font-size="24" fill="#1D1D1F" text-anchor="middle">0 Löschzyklen</text>
<rect x="715" y="100" width="210" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="820.0" y="133.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Block 2</text>
<text x="820.0" y="163.0" font-size="24" fill="#1D1D1F" text-anchor="middle">0 Löschzyklen</text>
<text x="30" y="257" font-size="24" fill="#1D1D1F" text-anchor="start">verteilt</text>
<rect x="225" y="215" width="210" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="330.0" y="248.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Block 0</text>
<text x="330.0" y="278.0" font-size="24" fill="#1D1D1F" text-anchor="middle">2 Löschzyklen</text>
<rect x="470" y="215" width="210" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="575.0" y="248.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Block 1</text>
<text x="575.0" y="278.0" font-size="24" fill="#1D1D1F" text-anchor="middle">2 Löschzyklen</text>
<rect x="715" y="215" width="210" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="820.0" y="248.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Block 2</text>
<text x="820.0" y="278.0" font-size="24" fill="#1D1D1F" text-anchor="middle">2 Löschzyklen</text>
<text x="500" y="355" font-size="23" fill="#1D1D1F" text-anchor="middle">Gleiche Summe, geringerer Maximalwert; Mapping und Aufwand bleiben nötig.</text>
</svg>
