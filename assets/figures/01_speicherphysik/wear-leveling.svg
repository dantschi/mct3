<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300">
<rect width="980" height="300" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="start">Logischer Sektor 0 — drei Updates (schematisch)</text>
<rect x="80" y="70" width="150" height="80" rx="6" fill="#FFF" stroke="#6A1B9A" stroke-width="2"/>
<text x="92" y="105" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Block 4</text>
<text x="92" y="130" font-size="14" font-weight="400" fill="#6A1B9A" text-anchor="start">gültig</text>
<rect x="280" y="70" width="150" height="80" rx="6" fill="#FFF" stroke="#5F6368" stroke-width="2"/>
<text x="292" y="105" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Block 12</text>
<text x="292" y="130" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">alt/ungültig</text>
<rect x="480" y="70" width="150" height="80" rx="6" fill="#FFF" stroke="#1565C0" stroke-width="2"/>
<text x="492" y="105" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Block 27</text>
<text x="492" y="130" font-size="14" font-weight="400" fill="#1565C0" text-anchor="start">aktuell</text>
<rect x="700" y="70" width="150" height="80" rx="6" fill="#FFF" stroke="#1D1D1F" stroke-width="2"/>
<text x="712" y="105" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Block 40</text>
<text x="712" y="130" font-size="14" font-weight="400" fill="#1D1D1F" text-anchor="start">frei</text>
<text x="16" y="190" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">FTL: logische Adresse → physischer Block. P/E-Zähler je Block steigen ungleich.</text>
<text x="16" y="220" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Wear Leveling wählt einen wenig genutzten Block. Garbage Collection ist optional und getrennt.</text>
<text x="16" y="260" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start">Update 1→4, Update 2→12 (4 ungültig), Update 3→27 (12 ungültig).</text>
</svg>
