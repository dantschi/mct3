<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title">
<title id="title">Bank-, Zeilen-, Spalten- und Bytefelder im Lehrmodell</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="440" fill="#FFFFFF"/>
<text x="500" y="35" font-size="26" fill="#1D1D1F" text-anchor="middle">4 Banken × 128 Zeilen × 64 Spalten × 2 Byte = 64 KiB</text>
<rect x="20" y="85" width="160" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="100.0" y="123.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Bank [15:14]</text>
<text x="100.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">2 Bit</text>
<rect x="180" y="85" width="360" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="360.0" y="123.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Zeile [13:7]</text>
<text x="360.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">7 Bit</text>
<rect x="540" y="85" width="300" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="690.0" y="123.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Spalte [6:1]</text>
<text x="690.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">6 Bit</text>
<rect x="840" y="85" width="140" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="910.0" y="123.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Byte [0]</text>
<text x="910.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">1 Bit</text>
<rect x="35" y="235" width="425" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="247.5" y="278.0" font-size="24" fill="#1D1D1F" text-anchor="middle">aktivierte Zeile</text>
<text x="247.5" y="308.0" font-size="24" fill="#1D1D1F" text-anchor="middle">64 Spalten mit je 2 Byte</text>
<rect x="580" y="235" width="370" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="765.0" y="278.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Spalte auswählen</text>
<text x="765.0" y="308.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Byte 0 oder 1</text>
<line x1="460" y1="285" x2="575" y2="285" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="405" font-size="23" fill="#1D1D1F" text-anchor="middle">Frei gewählte Feldreihenfolge; kein universelles Controller-Mapping.</text>
</svg>
