<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title">
<title id="title">Getrennte DRAM-Zelle und vorgeladene Bitleitung</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="380" fill="#FFFFFF"/>
<rect x="35" y="90" width="250" height="130" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="160.0" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Zelle isoliert</text>
<text x="160.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">0 V oder 1,2 V</text>
<rect x="635" y="90" width="310" height="130" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="790.0" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">BL vorladen</text>
<text x="790.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Vpre = 0,6 V</text>
<line x1="285" y1="155" x2="430" y2="155" stroke="#86868B" stroke-width="2"/>
<line x1="430" y1="155" x2="475" y2="120" stroke="#86868B" stroke-width="2"/>
<line x1="500" y1="155" x2="635" y2="155" stroke="#86868B" stroke-width="2"/>
<text x="470" y="85" font-size="24" fill="#1D1D1F" text-anchor="middle">WL = 0</text>
<text x="500" y="295" font-size="26" fill="#1D1D1F" text-anchor="middle">Vorladung beenden → WL aktivieren → Ladung teilen</text>
<text x="500" y="345" font-size="23" fill="#1D1D1F" text-anchor="middle">Lehrmodell: Versorgung 1,2 V; Platte 0 V</text>
</svg>
