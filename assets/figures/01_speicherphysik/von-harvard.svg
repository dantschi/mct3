<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" role="img" aria-labelledby="title">
<title id="title">Gemeinsamer Port gegenüber getrennten Befehls- und Datenwegen</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="345" fill="#FFFFFF"/>
<text x="250" y="35" font-size="27" fill="#1D1D1F" text-anchor="middle">Ein-Port-Lehrmodell</text>
<text x="750" y="35" font-size="27" fill="#1D1D1F" text-anchor="middle">Getrennte I-/D-Wege</text>
<rect x="35" y="90" width="130" height="110" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="100.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">CPU</text>
<rect x="285" y="90" width="180" height="110" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="375.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Code + Daten</text>
<line x1="165" y1="145" x2="285" y2="145" stroke="#86868B" stroke-width="2"/>
<text x="225" y="235" font-size="23" fill="#1D1D1F" text-anchor="middle">ein Port</text>
<rect x="535" y="90" width="130" height="110" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="600.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">CPU</text>
<rect x="800" y="70" width="175" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="887.5" y="115.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Befehle</text>
<rect x="800" y="175" width="175" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="887.5" y="220.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Daten</text>
<polyline points="665.000,120.000 730.000,120.000 730.000,107.000 800.000,107.000" fill="none" stroke="#86868B" stroke-width="3"/>
<polyline points="665.000,170.000 730.000,170.000 730.000,212.000 800.000,212.000" fill="none" stroke="#86868B" stroke-width="3"/>
<text x="500" y="310" font-size="22" fill="#1D1D1F" text-anchor="middle">Adressraum, Portzahl und physische Speicher sind getrennte Eigenschaften.</text>
</svg>
