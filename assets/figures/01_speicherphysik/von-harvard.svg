<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340">
<rect width="1100" height="340" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<rect x="10" y="10" width="520" height="310" rx="8" fill="#FAFAFB" stroke="#E5E5EA"/>
<text x="22" y="36" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">Von-Neumann: ein physischer Pfad</text>
<rect x="40" y="80" width="120" height="60" rx="6" fill="#FFF" stroke="#1D1D1F"/>
<text x="70" y="116" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="start">CPU</text>
<rect x="300" y="80" width="180" height="70" rx="6" fill="#FFF" stroke="#1565C0" stroke-width="2"/>
<text x="330" y="122" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Code+Daten</text>
<line x1="160" y1="110" x2="300" y2="110" stroke="#1565C0" stroke-width="4"/>
<text x="170" y="100" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">ein Bus</text>
<text x="30" y="200" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Gemeinsamer Adressraum und</text>
<text x="30" y="224" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">ein Port: Fetch und Load streiten.</text>
<rect x="550" y="10" width="530" height="310" rx="8" fill="#FAFAFB" stroke="#E5E5EA"/>
<text x="562" y="36" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">Modified Harvard</text>
<rect x="580" y="70" width="100" height="50" fill="#FFF" stroke="#1D1D1F"/>
<text x="600" y="100" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">CPU</text>
<rect x="720" y="50" width="120" height="36" fill="#FFF" stroke="#E65100"/>
<text x="740" y="74" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">L1-I</text>
<rect x="720" y="110" width="120" height="36" fill="#FFF" stroke="#1565C0"/>
<text x="740" y="134" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">L1-D</text>
<rect x="880" y="78" width="160" height="50" fill="#FFF" stroke="#1D1D1F"/>
<text x="900" y="108" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">gemeinsamer RAM</text>
<line x1="680" y1="80" x2="720" y2="68" stroke="#E65100" stroke-width="2"/>
<line x1="680" y1="110" x2="720" y2="128" stroke="#1565C0" stroke-width="2"/>
<line x1="840" y1="68" x2="880" y2="90" stroke="#1D1D1F"/>
<line x1="840" y1="128" x2="880" y2="110" stroke="#1D1D1F"/>
<text x="570" y="200" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Getrennte L1-Pfade, darunter</text>
<text x="570" y="224" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">ein Speicher. Adressraum kann</text>
<text x="570" y="248" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">trotzdem gemeinsam sein.</text>
</svg>
