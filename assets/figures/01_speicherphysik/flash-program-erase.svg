<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="425" viewBox="0 0 1000 425" role="img" aria-labelledby="title">
<title id="title">Erlaubte Bitänderungen und Löschbedarf</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="425" fill="#FFFFFF"/>
<text x="500" y="35" font-size="27" fill="#1D1D1F" text-anchor="middle">Logisches Flash-Lehrmodell: gelöscht = FF</text>
<rect x="30" y="70" width="310" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="185.0" y="110.5" font-size="24" fill="#1D1D1F" text-anchor="middle">FF · 11111111</text>
<rect x="460" y="70" width="310" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="615.0" y="110.5" font-size="24" fill="#1D1D1F" text-anchor="middle">A5 · 10100101</text>
<line x1="345" y1="102" x2="450" y2="102" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="795" y="108" font-size="21" fill="#1D1D1F" text-anchor="start">nur 1 → 0</text>
<rect x="30" y="165" width="310" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="185.0" y="205.5" font-size="24" fill="#1D1D1F" text-anchor="middle">A5 · 10100101</text>
<rect x="460" y="165" width="310" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="615.0" y="205.5" font-size="24" fill="#1D1D1F" text-anchor="middle">81 · 10000001</text>
<line x1="345" y1="197" x2="450" y2="197" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="795" y="203" font-size="21" fill="#1D1D1F" text-anchor="start">nur weitere 1 → 0</text>
<rect x="30" y="260" width="310" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="185.0" y="300.5" font-size="24" fill="#1D1D1F" text-anchor="middle">A5 · 10100101</text>
<rect x="460" y="260" width="310" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="615.0" y="300.5" font-size="24" fill="#1D1D1F" text-anchor="middle">AF · 10101111</text>
<line x1="345" y1="292" x2="450" y2="292" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="795" y="298" font-size="21" fill="#E2001A" text-anchor="start">0 → 1: vorher löschen</text>
<text x="500" y="390" font-size="23" fill="#1D1D1F" text-anchor="middle">Löschen betrifft den ganzen Modellblock; benötigte Nachbarbytes sichern.</text>
</svg>
