<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
<rect width="1000" height="260" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<rect x="16" y="10" width="310" height="220" rx="8" fill="#FAFAFB" stroke="#E5E5EA"/>
<text x="28" y="36" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">gelöscht</text>
<text x="46" y="100" font-size="32" font-weight="700" fill="#6A1B9A" text-anchor="start">1 1 1 1</text>
<text x="36" y="160" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Block auf 1 (Modell)</text>
<rect x="342" y="10" width="310" height="220" rx="8" fill="#FAFAFB" stroke="#E5E5EA"/>
<text x="354" y="36" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">programmieren</text>
<text x="372" y="100" font-size="32" font-weight="700" fill="#6A1B9A" text-anchor="start">1 0 1 0</text>
<text x="362" y="160" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">nur 1→0, feiner</text>
<rect x="668" y="10" width="310" height="220" rx="8" fill="#FAFAFB" stroke="#E5E5EA"/>
<text x="680" y="36" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">erneut löschen</text>
<text x="698" y="100" font-size="32" font-weight="700" fill="#6A1B9A" text-anchor="start">1 1 1 1</text>
<text x="688" y="160" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">nur blockweise zurück</text>
<text x="16" y="250" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">SLC-Modellkonvention: Programmieren 1→0, Erase zurück auf 1. Keine universelle Page-/Blockgröße.</text>
</svg>
