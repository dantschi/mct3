<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="385" viewBox="0 0 1000 385" role="img" aria-labelledby="title">
<title id="title">Zwei Zugriffsports zu gemeinsamen Speicherinhalten</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="385" fill="#FFFFFF"/>
<rect x="25" y="100" width="230" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="140.0" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Port A</text>
<text x="140.0" y="173.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Adresse / Daten</text>
<rect x="370" y="75" width="260" height="150" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">gemeinsamer</text>
<text x="500.0" y="173.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Speicherinhalt</text>
<rect x="745" y="100" width="230" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="860.0" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Port B</text>
<text x="860.0" y="173.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Adresse / Daten</text>
<line x1="255" y1="150" x2="370" y2="150" stroke="#86868B" stroke-width="2"/>
<line x1="630" y1="150" x2="745" y2="150" stroke="#86868B" stroke-width="2"/>
<text x="500" y="300" font-size="25" fill="#1D1D1F" text-anchor="middle">Gleiche Adresse / Schreiben: Ergebnis laut Spezifikation.</text>
<text x="500" y="350" font-size="24" fill="#1D1D1F" text-anchor="middle">Ports, Zellbauart und Synchronisation getrennt prüfen.</text>
</svg>
