<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
<rect width="1000" height="300" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<rect x="360" y="70" width="280" height="140" rx="8" fill="#FFF" stroke="#1D1D1F" stroke-width="2"/>
<text x="430" y="150" font-size="22" font-weight="600" fill="#1D1D1F" text-anchor="start">DPRAM</text>
<text x="40" y="90" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">Port A</text>
<text x="40" y="120" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Adresse A</text>
<text x="40" y="146" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Daten A</text>
<text x="40" y="172" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">Steuerung A</text>
<text x="760" y="90" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">Port B</text>
<text x="760" y="120" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Adresse B</text>
<text x="760" y="146" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Daten B</text>
<text x="760" y="172" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">Steuerung B</text>
<line x1="180" y1="120" x2="360" y2="120" stroke="#1565C0" stroke-width="2"/>
<line x1="640" y1="120" x2="750" y2="120" stroke="#1565C0" stroke-width="2"/>
<text x="16" y="240" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Verschiedene Adressen: konfliktfrei. Dieselbe Adresse: Verhalten implementierungsabhängig.</text>
<text x="16" y="270" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start">Keine feste „8T“-Zelle. Arbitration nur, wenn der Baustein sie vorsieht.</text>
</svg>
