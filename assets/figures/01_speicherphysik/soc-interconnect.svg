<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340">
<rect width="1000" height="340" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Schematischer MCU-SoC — DRAM nicht zwingend auf demselben Die</text>
<rect x="40" y="50" width="640" height="250" rx="10" fill="none" stroke="#1D1D1F" stroke-dasharray="6 4"/>
<text x="52" y="72" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Silizium-Die</text>
<rect x="70" y="110" width="130" height="48" rx="6" fill="#FFF" stroke="#1D1D1F"/>
<text x="82" y="140" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">CPU</text>
<rect x="220" y="90" width="130" height="48" rx="6" fill="#FFF" stroke="#1565C0"/>
<text x="232" y="120" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">L1-I/D</text>
<rect x="220" y="160" width="130" height="48" rx="6" fill="#FFF" stroke="#1565C0"/>
<text x="232" y="190" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">SRAM</text>
<rect x="400" y="90" width="130" height="48" rx="6" fill="#FFF" stroke="#1565C0"/>
<text x="412" y="120" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">NOR-Flash</text>
<rect x="400" y="160" width="130" height="48" rx="6" fill="#FFF" stroke="#1D1D1F"/>
<text x="412" y="190" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">MMIO</text>
<line x1="200" y1="134" x2="220" y2="114" stroke="#E65100" stroke-width="2"/>
<line x1="200" y1="134" x2="220" y2="184" stroke="#1565C0" stroke-width="2"/>
<line x1="350" y1="114" x2="400" y2="114" stroke="#1D1D1F"/>
<line x1="350" y1="184" x2="400" y2="184" stroke="#1D1D1F"/>
<text x="70" y="230" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Interconnect on-chip</text>
<rect x="740" y="120" width="200" height="60" rx="6" fill="#FFF" stroke="#6A1B9A"/>
<text x="760" y="155" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">DRAM off-chip</text>
<line x1="680" y1="150" x2="740" y2="150" stroke="#6A1B9A" stroke-dasharray="5 3"/>
<text x="740" y="210" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">nur wenn das System</text>
<text x="740" y="230" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Hauptspeicher braucht</text>
</svg>
