<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title">
<title id="title">Verantwortung des Startcodes vor der C-Anwendung</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="500" fill="#FFFFFF"/>
<rect x="205" y="20" width="590" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="58.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Reset-Einstieg</text>
<line x1="500" y1="80" x2="500" y2="95" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="205" y="100" width="590" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="138.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Prozessor / Stack vorbereiten</text>
<line x1="500" y1="160" x2="500" y2="175" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="205" y="180" width="590" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="218.0" font-size="24" fill="#1D1D1F" text-anchor="middle">.data kopieren</text>
<line x1="500" y1="240" x2="500" y2="255" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="205" y="260" width="590" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="298.0" font-size="24" fill="#1D1D1F" text-anchor="middle">.bss nullsetzen</text>
<line x1="500" y1="320" x2="500" y2="335" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="205" y="340" width="590" height="60" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="378.0" font-size="24" fill="#1D1D1F" text-anchor="middle">main aufrufen</text>
<text x="500" y="465" font-size="23" fill="#1D1D1F" text-anchor="middle">Vereinfachte Folge; zusätzliche Zielinitialisierung ist plattformabhängig.</text>
</svg>
