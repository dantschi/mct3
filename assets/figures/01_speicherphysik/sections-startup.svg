<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515" role="img" aria-labelledby="title">
<title id="title">Ladebild und Laufzeitbereiche im typischen Firmwaremodell</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="515" fill="#FFFFFF"/>
<text x="260" y="35" font-size="27" fill="#1D1D1F" text-anchor="middle">Flash: Ladebild</text>
<text x="760" y="35" font-size="27" fill="#1D1D1F" text-anchor="middle">RAM: Laufzeitobjekte</text>
<rect x="65" y="80" width="365" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="247.5" y="133.0" font-size="24" fill="#1D1D1F" text-anchor="middle">.text + .rodata</text>
<rect x="65" y="205" width="365" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="247.5" y="253.0" font-size="24" fill="#1D1D1F" text-anchor="middle">.data-Anfangswerte</text>
<rect x="580" y="205" width="350" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="755.0" y="253.0" font-size="24" fill="#1D1D1F" text-anchor="middle">.data: veränderbar</text>
<rect x="580" y="315" width="350" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="755.0" y="363.0" font-size="24" fill="#1D1D1F" text-anchor="middle">.bss: nullsetzen</text>
<rect x="580" y="425" width="350" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="755.0" y="465.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Stack: reservieren</text>
<line x1="430" y1="245" x2="575" y2="245" stroke="#E2001A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="503" y="219" font-size="22" fill="#1D1D1F" text-anchor="middle">kopieren</text>
<text x="60" y="365" font-size="25" fill="#1D1D1F" text-anchor="start">Keine .bss-Nullbytes</text>
<text x="60" y="403" font-size="25" fill="#1D1D1F" text-anchor="start">im Ladebild nötig</text>
</svg>
