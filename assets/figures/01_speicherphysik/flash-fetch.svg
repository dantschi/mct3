<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="295" viewBox="0 0 1000 295" role="img" aria-labelledby="title">
<title id="title">Execute-in-Place als Eigenschaft des System-Lesewegs</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="295" fill="#FFFFFF"/>
<rect x="25" y="60" width="150" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="100.0" y="113.0" font-size="24" fill="#1D1D1F" text-anchor="middle">CPU Fetch</text>
<rect x="235" y="60" width="230" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="350.0" y="98.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Adressabbildung</text>
<text x="350.0" y="128.0" font-size="24" fill="#1D1D1F" text-anchor="middle">und Controller</text>
<rect x="525" y="60" width="200" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="625.0" y="113.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Flash-Leseweg</text>
<rect x="790" y="60" width="185" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="882.5" y="113.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Codebytes</text>
<line x1="175" y1="105" x2="230" y2="105" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="465" y1="105" x2="520" y2="105" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="725" y1="105" x2="785" y2="105" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="215" font-size="24" fill="#1D1D1F" text-anchor="middle">XIP: Codeadresse ist über einen ausführbaren Leseweg erreichbar.</text>
<text x="500" y="260" font-size="23" fill="#1D1D1F" text-anchor="middle">Cachetreffer können Zugriffe bedienen, ohne erneut Flash zu lesen.</text>
</svg>
