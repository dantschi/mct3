<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
<rect width="1000" height="420" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<polygon points="360,40 640,40 600,92 400,92" fill="#FDECEA" stroke="#1D1D1F"/>
<text x="500.0" y="64" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="middle">Register</text>
<text x="500.0" y="84" font-size="14" font-weight="400" fill="#5F6368" text-anchor="middle">klein, schnell</text>
<polygon points="280,100 720,100 680,152 320,152" fill="#FFF3E0" stroke="#1D1D1F"/>
<text x="500.0" y="124" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="middle">L1/L2 SRAM</text>
<text x="500.0" y="144" font-size="14" font-weight="400" fill="#5F6368" text-anchor="middle">Cache</text>
<polygon points="180,170 820,170 780,222 220,222" fill="#E3F2FD" stroke="#1D1D1F"/>
<text x="500.0" y="194" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="middle">DRAM</text>
<text x="500.0" y="214" font-size="14" font-weight="400" fill="#5F6368" text-anchor="middle">großer SoC</text>
<polygon points="80,240 920,240 880,292 120,292" fill="#E8F5E9" stroke="#1D1D1F"/>
<text x="500.0" y="264" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="middle">Flash / Massenspeicher</text>
<text x="500.0" y="284" font-size="14" font-weight="400" fill="#5F6368" text-anchor="middle">MCU: oft statt DRAM nur SRAM</text>
<text x="20" y="330" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">↑ Zugriffszeit, Kosten/Bit nach oben kleiner werdende Kapazität</text>
<text x="20" y="360" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">MCU-Beispiel: Flash + SRAM. Großer SoC: Cache, DRAM, Massenspeicher.</text>
<text x="20" y="392" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Zeiten in der Vorlesung nur als Größenordnung, nicht austauschbare Ebenen.</text>
</svg>
