<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title">
<title id="title">Speicherhierarchie als Zuordnung typischer Aufgaben</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="460" fill="#FFFFFF"/>
<rect x="340.0" y="20" width="320" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="60.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Register</text>
<rect x="250.0" y="98" width="500" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="138.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Caches: oft SRAM</text>
<rect x="160.0" y="176" width="680" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="216.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Arbeitsspeicher: oft DRAM</text>
<rect x="60.0" y="254" width="880" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="294.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Dauerhafte Ablage: z. B. Flash</text>
<text x="20" y="390" font-size="24" fill="#1D1D1F" text-anchor="start">Typisch nach unten: mehr Kapazität, längere Zugriffswege</text>
<text x="20" y="429" font-size="22" fill="#1D1D1F" text-anchor="start">Keine universellen Geschwindigkeitswerte aus dem Zellnamen ableiten.</text>
</svg>
