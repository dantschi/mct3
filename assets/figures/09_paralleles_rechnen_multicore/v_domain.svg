<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<rect width="1200" height="360" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Kohaerente Harts links. DMA nur mit Plattformvertrag in der Domaene.</text>
<rect x="40" y="70" width="200" height="70" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="52" y="100" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Hart 0</text>
<text x="52" y="124" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">L1-D privat</text>
<rect x="40" y="180" width="200" height="70" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="52" y="210" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">Hart 1</text>
<text x="52" y="234" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">L1-D privat</text>
<rect x="360" y="120" width="220" height="80" fill="#fff" stroke="#6A1B9A" stroke-width="1.4"/>
<text x="372" y="154" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">Koordinator</text>
<text x="372" y="178" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Snoop oder Directory</text>
<line x1="240" y1="105" x2="360" y2="150" stroke="#1565C0" stroke-width="2"/>
<line x1="240" y1="215" x2="360" y2="170" stroke="#E65100" stroke-width="2"/>
<rect x="700" y="120" width="180" height="80" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="712" y="154" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">Memory</text>
<text x="712" y="178" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">unterer Stand</text>
<line x1="580" y1="160" x2="700" y2="160" stroke="#1B5E20" stroke-width="2"/>
<rect x="960" y="70" width="200" height="70" fill="#fff" stroke="#B71C1C" stroke-width="1.4"/>
<text x="972" y="100" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">DMA</text>
<text x="972" y="124" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Vertrag offen</text>
<line x1="1060" y1="140" x2="880" y2="160" stroke="#B71C1C" stroke-width="1.4"/>
<text x="16" y="290" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">CPU-Kohaerenz, DMA-Maintenance, atomare RMW und MMIO-Ordnung sind verschiedene Pflichten.</text>
<text x="16" y="322" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Gemeinsames L2 allein beweist die Domaene nicht. L1-I ist hier nicht der Datenpfad.</text>
</svg>
