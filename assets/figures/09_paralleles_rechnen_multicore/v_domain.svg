<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title">
<title id="title">Teilnehmergrenze der Kopienkoordination</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="430" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Beispiel einer Kohärenzdomäne · Gerätepfad separat prüfen</text>
<rect x="35" y="65" width="610" height="270" rx="8" fill="#FFFFFF" stroke="#E2001A"/>
<rect x="70" y="85" width="240" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="190.0" y="118.0" font-size="24" fill="#1D1D1F" text-anchor="middle">CPU 0</text>
<text x="190.0" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">privater Datencache</text>
<rect x="370" y="85" width="240" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="490.0" y="118.0" font-size="24" fill="#1D1D1F" text-anchor="middle">CPU 1</text>
<text x="490.0" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">privater Datencache</text>
<rect x="100" y="225" width="470" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="335.0" y="268.0" font-size="24" fill="#1D1D1F" text-anchor="middle">kohärenter Interconnect</text>
<line x1="190" y1="173" x2="190" y2="215" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="490" y1="173" x2="490" y2="215" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="750" y="95" width="200" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="850.0" y="140.5" font-size="24" fill="#1D1D1F" text-anchor="middle">DMA-Gerät</text>
<rect x="750" y="255" width="200" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="850.0" y="290.5" font-size="24" fill="#1D1D1F" text-anchor="middle">untere Ebene</text>
<text x="850.0" y="320.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Speicher</text>
<line x1="580" y1="260" x2="740" y2="290" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="850" y1="180" x2="850" y2="245" stroke="#86868B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="500" y="399" font-size="23" fill="#1D1D1F" text-anchor="middle">CPU-Kohärenz ist kein automatischer DMA-Maintenance-Vertrag</text>
</svg>
