<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="378" viewBox="0 0 1000 378" role="img" aria-labelledby="title">
<title id="title">Tag, Index und Byteoffset einer konkreten Adresse</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="378" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">4-KiB-Lehrcache · direkt abgebildet · 64-Byte-Line · 32-Bit-Adresse</text>
<rect x="20" y="100" width="596" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="320.0" y="144" font-size="24" fill="#1D1D1F" text-anchor="middle">Tag: 20 Bit</text>
<rect x="620" y="100" width="176" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="710.0" y="144" font-size="24" fill="#1D1D1F" text-anchor="middle">Index: 6 Bit</text>
<rect x="800" y="100" width="176" height="70" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="890.0" y="144" font-size="24" fill="#1D1D1F" text-anchor="middle">Offset: 6 Bit</text>
<text x="500" y="232" font-size="26" fill="#1D1D1F" text-anchor="middle">Adresse 0x20001084</text>
<text x="500" y="284" font-size="24" fill="#1D1D1F" text-anchor="middle">Tag 0x20001 · Index 2 · Offset 4 · Linebasis 0x20001080</text>
<text x="500" y="346" font-size="23" fill="#1D1D1F" text-anchor="middle">64 Sätze · Metadaten sind keine Nutzdatenbytes</text>
</svg>
