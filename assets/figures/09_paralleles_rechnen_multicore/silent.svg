<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="249" viewBox="0 0 1000 249" role="img" aria-labelledby="title">
<title id="title">Ein lokaler Write auf E benötigt keine fremde Invalidierung</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="249" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Ein lokaler Write auf E benötigt keine fremde Invalidierung</text>
<text x="28" y="82" font-size="23" fill="#1D1D1F" text-anchor="start">Schritt</text>
<text x="388" y="82" font-size="23" fill="#1D1D1F" text-anchor="start">Kern 0</text>
<text x="618" y="82" font-size="23" fill="#1D1D1F" text-anchor="start">Kern 1</text>
<text x="848" y="82" font-size="23" fill="#1D1D1F" text-anchor="start">L</text>
<rect x="20" y="100" width="356" height="56" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="28" y="136" font-size="23" fill="#1D1D1F" text-anchor="start">vor Write</text>
<rect x="380" y="100" width="226" height="56" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="388" y="136" font-size="23" fill="#1D1D1F" text-anchor="start">E:0</text>
<rect x="610" y="100" width="226" height="56" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="618" y="136" font-size="23" fill="#1D1D1F" text-anchor="start">I</text>
<rect x="840" y="100" width="136" height="56" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="848" y="136" font-size="23" fill="#1D1D1F" text-anchor="start">0</text>
<rect x="20" y="162" width="356" height="56" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="28" y="198" font-size="23" fill="#1D1D1F" text-anchor="start">Write x = 5</text>
<rect x="380" y="162" width="226" height="56" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="388" y="198" font-size="23" fill="#1D1D1F" text-anchor="start">M:5</text>
<rect x="610" y="162" width="226" height="56" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="618" y="198" font-size="23" fill="#1D1D1F" text-anchor="start">I</text>
<rect x="840" y="162" width="136" height="56" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="848" y="198" font-size="23" fill="#1D1D1F" text-anchor="start">0</text>
</svg>
