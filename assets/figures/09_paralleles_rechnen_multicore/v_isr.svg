<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="372" viewBox="0 0 1000 372" role="img" aria-labelledby="title">
<title id="title">Selbstdeadlock durch blockierte Interrupt-Rückkehr</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="372" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Derselbe Hart · unterbrochener Besitzer kann während der ISR nicht freigeben</text>
<rect x="20" y="105" width="280" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="160.0" y="163.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Kontext hält L</text>
<rect x="355" y="105" width="280" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="495.0" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">IRQ / ISR</text>
<text x="495.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">spinnt auf L</text>
<rect x="700" y="105" width="280" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="840.0" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Kontext wartet</text>
<text x="840.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">auf ISR-Rückkehr</text>
<line x1="300" y1="155" x2="350" y2="155" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="635" y1="155" x2="695" y2="155" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="285" font-size="24" fill="#1D1D1F" text-anchor="middle">ISR wartet auf Release · Release wartet auf Rückkehr der ISR</text>
<text x="500" y="340" font-size="23" fill="#1D1D1F" text-anchor="middle">Lokale IRQ-Sperre schließt andere Harts nicht aus</text>
</svg>
