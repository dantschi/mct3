<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
<rect width="1200" height="260" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Ein Hart. Die ISR unterbricht den Halter desselben Schlosses.</text>
<rect x="16" y="60" width="200" height="44" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="28" y="88" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Haelt L</text>
<line x1="216" y1="82" x2="246" y2="82" stroke="#1D1D1F" stroke-width="1.6"/>
<rect x="246" y="60" width="200" height="44" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="258" y="88" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">IRQ</text>
<line x1="446" y1="82" x2="476" y2="82" stroke="#1D1D1F" stroke-width="1.6"/>
<rect x="476" y="60" width="200" height="44" fill="#fff" stroke="#B71C1C" stroke-width="1.4"/>
<text x="488" y="88" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">ISR spinnt</text>
<line x1="676" y1="82" x2="706" y2="82" stroke="#1D1D1F" stroke-width="1.6"/>
<rect x="706" y="60" width="200" height="44" fill="#fff" stroke="#B71C1C" stroke-width="1.4"/>
<text x="718" y="88" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">kein Resume</text>
<line x1="906" y1="82" x2="936" y2="82" stroke="#1D1D1F" stroke-width="1.6"/>
<rect x="936" y="60" width="200" height="44" fill="#fff" stroke="#B71C1C" stroke-width="1.4"/>
<text x="948" y="88" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">kein Release</text>
<text x="16" y="150" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">IRQ-Sperre auf diesem Hart haelt andere Harts nicht fern.</text>
<text x="16" y="182" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Konzept: kurze Meldung, Arbeit spaeter. Keine konkrete RTOS-Funktion.</text>
<text x="16" y="220" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Zusaetzliche Atomizitaet loest den Selbstdeadlock nicht. Timeout gibt L nicht frei.</text>
</svg>
