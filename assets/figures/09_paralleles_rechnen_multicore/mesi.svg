<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="398" viewBox="0 0 1000 398" role="img" aria-labelledby="title">
<title id="title">MESI-Gültigkeit, Sauberkeit und Schreibrecht</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="398" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">MESI: stabile Rechte einer ganzen Cachezeile · Modell K</text>
<rect x="20" y="100" width="210" height="155" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="125.0" y="155.5" font-size="24" fill="#1D1D1F" text-anchor="middle">M: Modified</text>
<text x="125.0" y="185.5" font-size="24" fill="#1D1D1F" text-anchor="middle">gültig, geändert</text>
<text x="125.0" y="215.5" font-size="24" fill="#1D1D1F" text-anchor="middle">exklusiv</text>
<rect x="270" y="100" width="210" height="155" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="375.0" y="155.5" font-size="24" fill="#1D1D1F" text-anchor="middle">E: Exclusive</text>
<text x="375.0" y="185.5" font-size="24" fill="#1D1D1F" text-anchor="middle">gültig, sauber</text>
<text x="375.0" y="215.5" font-size="24" fill="#1D1D1F" text-anchor="middle">exklusiv</text>
<rect x="520" y="100" width="210" height="155" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="625.0" y="155.5" font-size="24" fill="#1D1D1F" text-anchor="middle">S: Shared</text>
<text x="625.0" y="185.5" font-size="24" fill="#1D1D1F" text-anchor="middle">gültig, sauber</text>
<text x="625.0" y="215.5" font-size="24" fill="#1D1D1F" text-anchor="middle">teilbar</text>
<rect x="770" y="100" width="210" height="155" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="875.0" y="155.5" font-size="24" fill="#1D1D1F" text-anchor="middle">I: Invalid</text>
<text x="875.0" y="185.5" font-size="24" fill="#1D1D1F" text-anchor="middle">lokal ungültig</text>
<text x="875.0" y="215.5" font-size="24" fill="#1D1D1F" text-anchor="middle">kein Treffer</text>
<text x="500" y="322" font-size="23" fill="#1D1D1F" text-anchor="middle">M oder E: keine weitere gültige Kopie · S-Kopien stimmen überein</text>
<text x="500" y="367" font-size="23" fill="#1D1D1F" text-anchor="middle">S kann allein übrig bleiben · I muss alte Bits nicht löschen</text>
</svg>
