<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
<rect width="1200" height="460" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Vereinfachtes Write-Back-MESI. Transiente Zustaende ausgeblendet. 64 B nur Beispiel.</text>
<rect x="40" y="48" width="140" height="44" fill="#fff" stroke="#B71C1C" stroke-width="1.4"/>
<text x="110" y="76" font-size="18" font-weight="700" fill="#B71C1C" text-anchor="middle">I</text>
<rect x="300" y="48" width="140" height="44" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="370" y="76" font-size="18" font-weight="700" fill="#1565C0" text-anchor="middle">E</text>
<rect x="560" y="48" width="140" height="44" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="630" y="76" font-size="18" font-weight="700" fill="#1B5E20" text-anchor="middle">S</text>
<rect x="860" y="48" width="140" height="44" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="930" y="76" font-size="18" font-weight="700" fill="#E65100" text-anchor="middle">M</text>
<text x="16" y="130" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">I + lokaler Read, keine Kopie -> E, Speicher liefert</text>
<text x="16" y="156" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">I + lokaler Read, andere saubere Kopie -> S</text>
<text x="16" y="182" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">I + lokaler Read, Owner M -> Daten  vom Owner, dann S</text>
<text x="16" y="208" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">E + lokaler Write -> M, still</text>
<text x="16" y="234" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">E + Fremdread -> S, Daten teilen</text>
<text x="16" y="260" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">S + eigener Write -> erst Ownership, Invalidates, dann M</text>
<text x="16" y="286" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">S + Fremdwrite -> I</text>
<text x="16" y="312" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">M + Fremdread -> aktuelle Daten liefern, dann S</text>
<text x="16" y="338" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">M + Fremdwrite -> Daten liefern, dann I</text>
<text x="16" y="364" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Eviction von M schreibt zurueck. Eviction von S kann S woanders lassen.</text>
<text x="16" y="410" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">S heisst sauber und teilbar, nicht nachweislich mehrere Kopien.</text>
<text x="16" y="438" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">I heisst lokal ungueltig, nicht zwingend geloeschte Bits. M und E sind exklusiv.</text>
</svg>
