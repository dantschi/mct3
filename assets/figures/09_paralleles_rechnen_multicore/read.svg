<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="311" viewBox="0 0 1000 311" role="img" aria-labelledby="title">
<title id="title">Read-Miss: drei getrennte Ausgangslagen, jeweils abgeschlossener Schritt</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="311" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Read-Miss: drei getrennte Ausgangslagen, jeweils abgeschlossener Schritt</text>
<text x="28" y="82" font-size="23" fill="#1D1D1F" text-anchor="start">vorher beim anderen</text>
<text x="308" y="82" font-size="23" fill="#1D1D1F" text-anchor="start">Antwort</text>
<text x="548" y="82" font-size="23" fill="#1D1D1F" text-anchor="start">danach Leser / anderer</text>
<text x="868" y="82" font-size="23" fill="#1D1D1F" text-anchor="start">L</text>
<rect x="20" y="100" width="276" height="56" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="28" y="136" font-size="23" fill="#1D1D1F" text-anchor="start">I, keine Kopie</text>
<rect x="300" y="100" width="236" height="56" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="308" y="136" font-size="23" fill="#1D1D1F" text-anchor="start">aus L</text>
<rect x="540" y="100" width="316" height="56" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="548" y="136" font-size="23" fill="#1D1D1F" text-anchor="start">E / I</text>
<rect x="860" y="100" width="116" height="56" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="868" y="136" font-size="23" fill="#1D1D1F" text-anchor="start">gleich</text>
<rect x="20" y="162" width="276" height="56" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="28" y="198" font-size="23" fill="#1D1D1F" text-anchor="start">E oder S, sauber</text>
<rect x="300" y="162" width="236" height="56" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="308" y="198" font-size="23" fill="#1D1D1F" text-anchor="start">sauberer Wert</text>
<rect x="540" y="162" width="316" height="56" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="548" y="198" font-size="23" fill="#1D1D1F" text-anchor="start">S / S</text>
<rect x="860" y="162" width="116" height="56" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="868" y="198" font-size="23" fill="#1D1D1F" text-anchor="start">gleich</text>
<rect x="20" y="224" width="276" height="56" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="28" y="260" font-size="23" fill="#1D1D1F" text-anchor="start">M:5, L war 0</text>
<rect x="300" y="224" width="236" height="56" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="308" y="260" font-size="23" fill="#1D1D1F" text-anchor="start">aktuelle 5</text>
<rect x="540" y="224" width="316" height="56" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="548" y="260" font-size="23" fill="#1D1D1F" text-anchor="start">S:5 / S:5</text>
<rect x="860" y="224" width="116" height="56" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="868" y="260" font-size="23" fill="#1D1D1F" text-anchor="start">5</text>
</svg>
