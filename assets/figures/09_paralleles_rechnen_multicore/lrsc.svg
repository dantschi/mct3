<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<rect width="1200" height="480" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">LR setzt eine Reservation auf eine Granule, kein gehaltenes Mutex. SC-Erfolg liefert 0.</text>
<text x="16" y="52" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Hart</text>
<text x="160" y="52" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Gelesen</text>
<text x="360" y="52" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Reservation</text>
<text x="620" y="52" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">SC</text>
<text x="860" y="52" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Speicher</text>
<text x="16" y="84" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">0 LR</text>
<text x="160" y="84" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">0</text>
<text x="360" y="84" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">gesetzt</text>
<text x="620" y="84" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">-</text>
<text x="860" y="84" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">0</text>
<text x="16" y="116" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">1 LR</text>
<text x="160" y="116" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">0</text>
<text x="360" y="116" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">gesetzt</text>
<text x="620" y="116" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">-</text>
<text x="860" y="116" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">0</text>
<text x="16" y="148" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">0 SC</text>
<text x="160" y="148" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">0</text>
<text x="360" y="148" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">endet</text>
<text x="620" y="148" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">Status 0</text>
<text x="860" y="148" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">1</text>
<text x="16" y="180" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">1 SC</text>
<text x="160" y="180" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">0</text>
<text x="360" y="180" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">endet</text>
<text x="620" y="180" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Status ungleich 0</text>
<text x="860" y="180" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">1</text>
<text x="16" y="212" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">1 LR neu</text>
<text x="160" y="212" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">1</text>
<text x="360" y="212" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">gesetzt</text>
<text x="620" y="212" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">kein SC</text>
<text x="860" y="212" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">1</text>
<text x="16" y="244" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">0 Release</text>
<text x="160" y="244" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">-</text>
<text x="360" y="244" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">keine</text>
<text x="620" y="244" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">-</text>
<text x="860" y="244" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">0</text>
<text x="16" y="276" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">1 LR/SC</text>
<text x="160" y="276" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">0</text>
<text x="360" y="276" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">endet</text>
<text x="620" y="276" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Status 0</text>
<text x="860" y="276" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">1</text>
<text x="16" y="340" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Schlosswerte nur 0 oder 1. Status 0 ist Erfolg, ungleich 0 ist Fehlschlag ohne Store.</text>
<text x="16" y="372" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Liest der neue LR 1, gibt es keinen SC. Nach Release 0 kann Hart 1 erneut erwerben.</text>
<text x="16" y="404" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Ein SC darf auch ohne fremden Write scheitern. Keine Fairness je Hart.</text>
<text x="16" y="436" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Beobachtete Geraetewrites auf die gelesenen Bytes duerfen nicht ignoriert werden.</text>
<text x="16" y="464" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Granule ist nicht automatisch eine 64-Byte-Line. Kritischer Abschnitt erst nach Status 0.</text>
</svg>
