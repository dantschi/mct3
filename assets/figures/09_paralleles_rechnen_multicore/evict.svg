<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="402" viewBox="0 0 1000 402" role="img" aria-labelledby="title">
<title id="title">M-Auswurf und verbleibende saubere S-Kopie</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="402" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Auswerfen ist ein eigenes Ereignis · keine verlorenen geänderten Daten</text>
<rect x="30" y="100" width="310" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="185.0" y="140.5" font-size="24" fill="#1D1D1F" text-anchor="middle">M:5, L:0</text>
<rect x="640" y="100" width="310" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="795.0" y="140.5" font-size="24" fill="#1D1D1F" text-anchor="middle">I, L:5</text>
<line x1="350" y1="132" x2="630" y2="132" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="204" font-size="23" fill="#1D1D1F" text-anchor="middle">geänderte Daten vorher nach unten</text>
<rect x="30" y="260" width="310" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="185.0" y="300.5" font-size="24" fill="#1D1D1F" text-anchor="middle">S:5 / S:5</text>
<rect x="640" y="260" width="310" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="795.0" y="300.5" font-size="24" fill="#1D1D1F" text-anchor="middle">I / S:5</text>
<line x1="350" y1="292" x2="630" y2="292" stroke="#1D1D1F" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="364" font-size="23" fill="#1D1D1F" text-anchor="middle">verbleibende Kopie kann S bleiben</text>
</svg>
