<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title">
<title id="title">Zwei unabhängig veröffentlichte Teilergebnisse und anschließende Zusammenführung</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#656D76"/></marker></defs>
<rect width="1000" height="440" fill="#FFFFFF"/>
<text x="500" y="32" font-size="27" fill="#1D1D1F" text-anchor="middle">Ergebnisse gehören erst nach ihrer Veröffentlichung dem Sammler</text>
<text x="260" y="81" font-size="26" fill="#1D1D1F" text-anchor="middle">W0: getrennt rechnen</text>
<rect x="60" y="104" width="195" height="74" rx="8" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="157" y="136" font-size="24" fill="#1D1D1F" text-anchor="middle">teil schreiben</text>
<text x="157" y="165" font-size="25" fill="#E2001A" text-anchor="middle">4</text>
<line x1="267" y1="140" x2="315" y2="140" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="330" y="104" width="150" height="74" rx="8" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="405" y="135" font-size="24" fill="#1D1D1F" text-anchor="middle">fertig = 1</text>
<text x="405" y="165" font-size="22" fill="#E2001A" text-anchor="middle">Release</text>
<text x="395" y="210" font-size="20" fill="#656D76" text-anchor="end">beobachtet</text>
<line x1="405" y1="191" x2="405" y2="234" stroke="#656D76" stroke-width="2.5"/>
<line x1="405" y1="234" x2="390" y2="234" stroke="#656D76" stroke-width="2.5"/>
<line x1="390" y1="234" x2="390" y2="253" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="740" y="81" font-size="26" fill="#1D1D1F" text-anchor="middle">W1: getrennt rechnen</text>
<rect x="540" y="104" width="195" height="74" rx="8" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="637" y="136" font-size="24" fill="#1D1D1F" text-anchor="middle">teil schreiben</text>
<text x="637" y="165" font-size="25" fill="#E2001A" text-anchor="middle">12</text>
<line x1="747" y1="140" x2="795" y2="140" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="810" y="104" width="150" height="74" rx="8" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="885" y="135" font-size="24" fill="#1D1D1F" text-anchor="middle">fertig = 1</text>
<text x="885" y="165" font-size="22" fill="#E2001A" text-anchor="middle">Release</text>
<text x="875" y="210" font-size="20" fill="#656D76" text-anchor="end">beobachtet</text>
<line x1="885" y1="191" x2="885" y2="234" stroke="#656D76" stroke-width="2.5"/>
<line x1="885" y1="234" x2="610" y2="234" stroke="#656D76" stroke-width="2.5"/>
<line x1="610" y1="234" x2="610" y2="253" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="290" y="256" width="420" height="79" rx="8" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="500" y="288" font-size="24" fill="#1D1D1F" text-anchor="middle">Sammler: beide 1 mit Acquire gelesen</text>
<text x="500" y="319" font-size="26" fill="#E2001A" text-anchor="middle">danach teil[0] + teil[1] = 16</text>
<text x="500" y="382" font-size="23" fill="#656D76" text-anchor="middle">Ein Durchlauf, kein erneutes Überschreiben; Pfeile geben logische Ordnung an.</text>
<text x="500" y="416" font-size="21" fill="#656D76" text-anchor="middle">Eine frühe Fertigmeldung erlaubt kein Lesen des noch nicht freigegebenen Ergebnisses.</text>
</svg>
