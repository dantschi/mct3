<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
<rect width="1200" height="280" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Lehrline 64 B. int hier 4 B. Basis 0x20001000 ist ausgerichtet.</text>
<rect x="16" y="50" width="520" height="48" fill="#fff" stroke="#B71C1C" stroke-width="1.4"/>
<rect x="16" y="50" width="32" height="48" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<rect x="48" y="50" width="32" height="48" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="16" y="130" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">a[0] und a[1] liegen beide in 0x20001000-3F.</text>
<rect x="620" y="50" width="250" height="48" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<rect x="900" y="50" width="250" height="48" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="620" y="130" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Records bei +0 und +64: Lines 0x20001000 und 0x20001040.</text>
<text x="16" y="180" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Sprachlich getrennte Variablen koennen trotzdem dieselbe Ownership teilen.</text>
<text x="16" y="212" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Padding trennt Layout. Es ersetzt keine Atomizitaet eines gemeinsamen Zaehlers.</text>
<text x="16" y="248" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Keine gemessene Verlangsamung. 64 Byte sind keine universelle Line.</text>
</svg>
