<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
<rect width="1200" height="340" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">S nach M ist mehr als ein Broadcast. Erst Ownership und Bestaetigung, dann der Write.</text>
<rect x="16" y="56" width="190" height="40" fill="#fff" stroke="#6A1B9A" stroke-width="1.4"/>
<text x="28" y="82" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Request</text>
<rect x="236" y="56" width="190" height="40" fill="#fff" stroke="#6A1B9A" stroke-width="1.4"/>
<text x="248" y="82" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Invalidate</text>
<rect x="456" y="56" width="190" height="40" fill="#fff" stroke="#6A1B9A" stroke-width="1.4"/>
<text x="468" y="82" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Ack</text>
<rect x="676" y="56" width="190" height="40" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="688" y="82" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Write M</text>
<text x="16" y="130" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Fremdread einer M-Line: Owner liefert 5, wird S, Empfaenger wird S, RAM wird 5.</text>
<text x="16" y="164" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Dirty-Shared oder Owned gehoeren nicht zu diesem MESI.</text>
<text x="16" y="198" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Ein Broadcast ohne abgeschlossene Invalidates ist noch kein Write.</text>
<text x="16" y="232" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Studierende pruefen die Tabelle: nach Schritt 3 ist RAM noch 0, nach Schritt 4 ist er 5.</text>
<text x="16" y="270" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Mehrstufige Hierarchien sind hier auf L1 plus unteren Stand vereinfacht.</text>
<text x="16" y="304" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Sauber heisst: Uebereinstimmung mit dem kohaerenten unteren Stand, nicht magisch mit jedem RAM-Takt.</text>
</svg>
