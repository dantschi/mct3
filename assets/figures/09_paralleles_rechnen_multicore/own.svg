<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title">
<title id="title">Schreibrechtsübernahme mit Invalidierung und Bestätigung</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="310" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Write auf Shared · Zeit nach rechts · nur stabile Endzustände benannt</text>
<rect x="20" y="110" width="220" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="130.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Start</text>
<text x="130.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">S:0 / S:0</text>
<rect x="260" y="110" width="220" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="370.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Kern 0</text>
<text x="370.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">fordert Rechte</text>
<rect x="500" y="110" width="220" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="610.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Kern 1</text>
<text x="610.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">I + Bestätigung</text>
<rect x="740" y="110" width="220" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="850.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Abschluss</text>
<text x="850.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">M:5 / I</text>
<line x1="240" y1="160" x2="255" y2="160" stroke="#1D1D1F" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="480" y1="160" x2="495" y2="160" stroke="#1D1D1F" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="720" y1="160" x2="735" y2="160" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="280" font-size="24" fill="#1D1D1F" text-anchor="middle">Anfrage ist noch kein Abschluss · unterer Stand L bleibt 0</text>
</svg>
