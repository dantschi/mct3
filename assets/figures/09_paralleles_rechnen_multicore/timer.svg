<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="427" viewBox="0 0 1000 427" role="img" aria-labelledby="title">
<title id="title">Zählertakte und PWM-Periode</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="427" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Lehrtimer · Zähler 0–999 · High bei 0–249</text>
<line x1="100.0" y1="300" x2="900.0" y2="300" stroke="#86868B" stroke-width="2"/>
<line x1="100.0" y1="295" x2="100.0" y2="305" stroke="#86868B" stroke-width="2"/>
<text x="100.0" y="336" font-size="22" fill="#1D1D1F" text-anchor="middle">0</text>
<line x1="300.0" y1="295" x2="300.0" y2="305" stroke="#86868B" stroke-width="2"/>
<text x="300.0" y="336" font-size="22" fill="#1D1D1F" text-anchor="middle">250</text>
<line x1="500.0" y1="295" x2="500.0" y2="305" stroke="#86868B" stroke-width="2"/>
<text x="500.0" y="336" font-size="22" fill="#1D1D1F" text-anchor="middle">500</text>
<line x1="700.0" y1="295" x2="700.0" y2="305" stroke="#86868B" stroke-width="2"/>
<text x="700.0" y="336" font-size="22" fill="#1D1D1F" text-anchor="middle">750</text>
<line x1="900.0" y1="295" x2="900.0" y2="305" stroke="#86868B" stroke-width="2"/>
<text x="900.0" y="336" font-size="22" fill="#1D1D1F" text-anchor="middle">1000</text>
<polyline points="100.000,250.000 100.000,130.000 300.000,130.000 300.000,250.000 900.000,250.000" fill="none" stroke="#E2001A" stroke-width="3"/>
<text x="200" y="108" font-size="24" fill="#1D1D1F" text-anchor="middle">250 High-Takte</text>
<text x="650" y="227" font-size="24" fill="#1D1D1F" text-anchor="middle">750 Low-Takte</text>
<text x="500" y="395" font-size="24" fill="#1D1D1F" text-anchor="middle">1 MHz / 10 / 1000 = 100 Hz · aktive Zeit 25 %</text>
