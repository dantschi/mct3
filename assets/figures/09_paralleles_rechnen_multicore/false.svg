<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="397" viewBox="0 0 1000 397" role="img" aria-labelledby="title">
<title id="title">False Sharing trotz verschiedener Datenobjekte</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="397" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">64-Byte-Zeile ab 0x20001000 · zwei verschiedene Vier-Byte-Objekte</text>
<rect x="30" y="105" width="940" height="95" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
<rect x="30" y="105" width="60" height="95" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="60" y="165" font-size="26" fill="#1D1D1F" text-anchor="middle">a</text>
<rect x="90" y="105" width="60" height="95" rx="8" fill="#F5F5F7" stroke="#1D1D1F"/>
<text x="120" y="165" font-size="26" fill="#1D1D1F" text-anchor="middle">b</text>
<text x="30" y="242" font-size="23" fill="#1D1D1F" text-anchor="start">0x20001000</text>
<text x="970" y="242" font-size="23" fill="#1D1D1F" text-anchor="end">…103F</text>
<text x="100" y="295" font-size="24" fill="#1D1D1F" text-anchor="start">Kern 0 schreibt a</text>
<text x="590" y="295" font-size="24" fill="#1D1D1F" text-anchor="start">Kern 1 schreibt b</text>
<text x="500" y="365" font-size="23" fill="#1D1D1F" text-anchor="middle">Verschiedene Wörter verlangen Schreibrecht derselben ganzen Zeile</text>
</svg>
