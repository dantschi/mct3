<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<rect width="1200" height="360" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Line beispielhaft 64 B, Basis 0x20001000. Keine Zeitmessung.</text>
<rect x="16" y="48" width="520" height="80" fill="#fff" stroke="#B71C1C" stroke-width="1.4"/>
<text x="28" y="74" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">False Sharing</text>
<text x="28" y="100" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">temp1 bei +0, temp2 bei +4, gleiche Line</text>
<rect x="580" y="48" width="580" height="80" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="592" y="74" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Getrennt</text>
<text x="592" y="100" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">temp2 bei +64 = 0x20001040</text>
<text x="16" y="160" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Jeder Write holt die Ownership der ganzen Line. Der andere Kern verliert sie.</text>
<text x="16" y="190" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">True Sharing waere ein gemeinsamer Zaehler, nicht zwei eigene Variablen.</text>
<text x="16" y="220" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Padding hilft nur mit Basis, Groesse und echter Line. Array-Alignment allein reicht nicht.</text>
<text x="16" y="250" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Preis: mehr Speicher und manchmal schlechtere Lokalitaet.</text>
<text x="16" y="284" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Messung: Threads pinnen, Arbeit gleich, mehrfach, Optimierung nicht wegwerfen.</text>
<text x="16" y="318" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Ein Simulator ohne Kohaerenzzeit belegt keine Verlangsamung.</text>
</svg>
