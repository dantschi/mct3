<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<rect width="1200" height="360" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Analytisch, fester Workload, kein Overhead. s=0,2 p=0,8.</text>
<text x="16" y="52" font-size="18" font-weight="600" fill="#1565C0" text-anchor="start">S(4) = 1/0,4 = 2,5</text>
<text x="16" y="84" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">S(100) = 1/0,208 = 4,8077</text>
<text x="16" y="116" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">Grenze 1/s = 5. Effizienz S(100)/100 = 4,81 Prozent.</text>
<text x="16" y="156" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">4,8 liegt nahe an 5. Die Parallel-Effizienz ist trotzdem sehr klein.</text>
<text x="16" y="190" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Ideal ohne seriellen Anteil waere S(N)=N. Die Kurve ist keine Messung.</text>
<text x="16" y="224" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Optional T(N)/T(1)=s+p/N+o(N). Ohne genannte o(N) bleibt der Overhead draussen.</text>
<text x="16" y="258" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Eine groessere Aufgabe ist eine andere Frage und widerlegt Amdahl nicht.</text>
<text x="16" y="292" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Annahmen: feste Arbeit, serieller Anteil der Ein-Kern-Zeit, ideale Balance.</text>
<text x="16" y="324" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Mehr DLP loest die Memory Wall nicht allein. Lokalitaet und Transfers bleiben.</text>
</svg>
