<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
<rect width="1200" height="320" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Hardwaremotiv, keine C11-Ergebnisliste. volatile aendert die Teilung nicht.</text>
<text x="16" y="60" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">Hart 0</text>
<text x="120" y="60" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">liest 0</text>
<text x="280" y="60" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">schreibt 1</text>
<text x="480" y="60" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Abschnitt</text>
<text x="16" y="100" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">Hart 1</text>
<text x="120" y="100" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">liest 0</text>
<text x="280" y="100" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">schreibt 1</text>
<text x="480" y="100" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Abschnitt</text>
<text x="16" y="150" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Beide sind gleichzeitig im Abschnitt, weil Check und Set getrennt sind.</text>
<rect x="16" y="180" width="1140" height="70" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="28" y="210" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Atomare Uebernahme: nur ein SC mit Status 0 betritt den Abschnitt.</text>
<text x="28" y="236" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Der andere liest 1 und wartet bis zum Release auf 0.</text>
<text x="16" y="290" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Das ist kein Zaehler-RMW. Der Schlosswert bleibt 0 oder 1.</text>
</svg>
