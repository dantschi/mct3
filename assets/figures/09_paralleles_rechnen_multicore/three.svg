<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="356" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Kopien · Update · Veröffentlichung: unterschiedliche Anforderungen</text>
<rect x="20" y="100" width="280" height="160" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="160.0" y="158.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Kohärenz</text>
<text x="160.0" y="188.0" font-size="24" fill="#1D1D1F" text-anchor="middle">eine Adresse</text>
<text x="160.0" y="218.0" font-size="24" fill="#1D1D1F" text-anchor="middle">gültige Kopien</text>
<rect x="355" y="100" width="280" height="160" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="495.0" y="158.0" font-size="24" fill="#1D1D1F" text-anchor="middle">atomare RMW</text>
<text x="495.0" y="188.0" font-size="24" fill="#1D1D1F" text-anchor="middle">ein Update</text>
<text x="495.0" y="218.0" font-size="24" fill="#1D1D1F" text-anchor="middle">unteilbar</text>
<rect x="700" y="100" width="280" height="160" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="840.0" y="158.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Acquire / Release</text>
