<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect width="1200" height="400" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Kohaerenz, Konsistenz und Atomizitaet sind drei Fragen.</text>
<rect x="16" y="44" width="560" height="90" fill="#fff" stroke="#B71C1C" stroke-width="1.4"/>
<text x="28" y="70" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Write-Through ohne Invalidation</text>
<text x="28" y="96" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">RAM wird 5. Core1-L1 kann weiter 0 halten.</text>
<rect x="620" y="44" width="540" height="90" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="632" y="70" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Koordinierte Kohaerenz</text>
<text x="632" y="96" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Fremde Kopie wird ungueltig oder mit 5 versorgt.</text>
<text x="16" y="160" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">MESI</text>
<text x="220" y="160" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Writes einer Adresse</text>
<text x="620" y="160" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">kein i++ und kein Flag</text>
<text x="16" y="208" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">Atomic-RMW</text>
<text x="220" y="208" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">ein RMW unteilbar</text>
<text x="620" y="208" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">keine Publikationsordnung</text>
<text x="16" y="256" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">Acquire/Release</text>
<text x="220" y="256" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Ordnung um ein Datum</text>
<text x="620" y="256" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">keine Kohaerenz allein</text>
<text x="16" y="330" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Ohne Hardware-Kohaerenz bleiben non-cacheable Speicher und Ownership moeglich, oft in AMP.</text>
<text x="16" y="358" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Fuer cachebares SMP-Sharing ist das aufwendig. DMA-Maintenance ist nicht selten per Definition.</text>
<text x="16" y="386" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Nicht jede RAM-Kopie muss in jedem Takt den neuesten Wert halten.</text>
</svg>
