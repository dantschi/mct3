<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
<rect width="1200" height="380" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">SMP-Lehrmodell: gleiche Kerne, ein OS, gemeinsamer Speicher. L2 ist Beispiel, keine Definition.</text>
<rect x="16" y="50" width="250" height="70" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="28" y="78" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">Core0 + privates L1</text>
<text x="28" y="100" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Task UI</text>
<rect x="300" y="50" width="250" height="70" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="312" y="78" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Core1 + privates L1</text>
<text x="312" y="100" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Task Arbeit</text>
<rect x="620" y="50" width="250" height="70" fill="#fff" stroke="#6A1B9A" stroke-width="1.4"/>
<text x="632" y="78" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">Interconnect</text>
<text x="632" y="100" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Kohaerenzdomaene</text>
<rect x="900" y="50" width="260" height="70" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="912" y="78" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">L2 beispielhaft</text>
<text x="912" y="100" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">dann DRAM</text>
<text x="16" y="160" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Migration nur, wenn Scheduler, Port und Affinity es erlauben.</text>
<text x="16" y="188" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Engpaesse: Interconnect, L2, DRAM, Locks. Mehr Kerne beschleunigen einen Thread nicht automatisch.</text>
<text x="16" y="220" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">SMP: ein OS, gleicher Zugriff. AMP: getrennte Software, oft ohne diese Kohaerenz.</text>
<text x="16" y="252" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">FreeRTOS-SMP gilt nur fuer passende Ports und Konfigurationen.</text>
<text x="16" y="284" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Heterogene Kerne sind hier ausgeblendet.</text>
<text x="16" y="320" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">TLP kann Aufgaben und Datenarbeit betreffen. DLP bleibt zusaetzlich moeglich.</text>
<text x="16" y="352" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Block 8 hat keine gemessene Memory Wall aus Renode geliefert.</text>
</svg>
