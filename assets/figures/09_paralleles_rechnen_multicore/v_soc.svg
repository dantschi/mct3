<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<rect width="1200" height="360" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Konzept-SoC. Behandelt, optional oder im Target nicht belegt.</text>
<rect x="16" y="50" width="200" height="70" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="26" y="80" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">Harts</text>
<text x="26" y="104" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">behandelt als Idee</text>
<rect x="230" y="50" width="200" height="70" fill="#fff" stroke="#6A1B9A" stroke-width="1.4"/>
<text x="240" y="80" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">Cache/MESI</text>
<text x="240" y="104" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Lehrmodell</text>
<rect x="460" y="50" width="200" height="70" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="470" y="80" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Memory</text>
<text x="470" y="104" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">behandelt</text>
<rect x="690" y="50" width="200" height="70" fill="#fff" stroke="#E65100" stroke-width="1.4"/>
<text x="700" y="80" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">DMA</text>
<text x="700" y="104" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">behandelt</text>
<rect x="920" y="50" width="200" height="70" fill="#fff" stroke="#1D1D1F" stroke-width="1.4"/>
<text x="930" y="80" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">UART SPI I2C</text>
<text x="930" y="104" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">behandelt</text>
<rect x="16" y="160" width="200" height="70" fill="#fff" stroke="#5F6368" stroke-width="1.4"/>
<text x="26" y="190" font-size="14" font-weight="600" fill="#5F6368" text-anchor="start">CLINT/PLIC</text>
<text x="26" y="214" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Beispiel, nicht jeder SoC</text>
<rect x="360" y="160" width="200" height="70" fill="#fff" stroke="#1565C0" stroke-width="1.4"/>
<text x="370" y="190" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">Timer/PWM</text>
<text x="370" y="214" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Lehrrechnung</text>
<rect x="680" y="160" width="200" height="70" fill="#fff" stroke="#B71C1C" stroke-width="1.4"/>
<text x="690" y="190" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">RVV/NPU</text>
<text x="690" y="214" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">optional, nicht belegt</text>
<text x="16" y="270" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Ein Sample: Bus, Puffer, CPU-Rechnung, Completion. Interrupt meldet, DMA bewegt.</text>
<text x="16" y="304" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">OoO, kohaerentes SMP, RVV und NPU sind hier keine vorhandene Laborplattform.</text>
<text x="16" y="338" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">AMAT und PWM stehen auf den Wiederholungsfolien, nicht als Boardmessung.</text>
</svg>
