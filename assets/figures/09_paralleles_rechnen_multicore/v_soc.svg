<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="413" viewBox="0 0 1000 413" role="img" aria-labelledby="title">
<title id="title">Sensortransfer und gemeinsame Rechenarbeit</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="413" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Konzeptweg, kein vorhandenes Labor-SoC · Datenfluss und Zuständigkeit</text>
<rect x="20" y="100" width="280" height="95" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="160.0" y="140.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Sensor</text>
<text x="160.0" y="170.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Peripherie</text>
<rect x="355" y="100" width="280" height="95" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="495.0" y="140.5" font-size="24" fill="#1D1D1F" text-anchor="middle">DMA</text>
<text x="495.0" y="170.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Puffer</text>
<rect x="700" y="100" width="280" height="95" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="840.0" y="140.5" font-size="24" fill="#1D1D1F" text-anchor="middle">CPU-Threads</text>
<text x="840.0" y="170.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Ergebnis</text>
<line x1="300" y1="147" x2="350" y2="147" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="635" y1="147" x2="695" y2="147" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="265" font-size="23" fill="#1D1D1F" text-anchor="middle">Abschluss / IRQ → Puffer übernehmen → Daten korrekt synchronisieren</text>
<text x="500" y="326" font-size="23" fill="#1D1D1F" text-anchor="middle">Kopienkoordination und DMA-Maintenance separat prüfen</text>
<text x="500" y="381" font-size="23" fill="#1D1D1F" text-anchor="middle">DLP oder NPU sind optionale Rechenwege innerhalb des Systemvertrags</text>
</svg>
