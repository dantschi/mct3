<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title">
<title id="title">Softwareablauf und Hardware-Ausführungsinstanz</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="410" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Lehrmodell: ein Hart je Kern · Thread ist Software, Hart ist Hardware</text>
<rect x="100" y="90" width="250" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="225.0" y="133.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Softwarethread 0</text>
<line x1="225" y1="165" x2="225" y2="220" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="100" y="230" width="250" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="225.0" y="268.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Kern 0</text>
<text x="225.0" y="298.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Hart 0</text>
<rect x="650" y="90" width="250" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="775.0" y="133.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Softwarethread 1</text>
<line x1="775" y1="165" x2="775" y2="220" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="650" y="230" width="250" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="775.0" y="268.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Kern 1</text>
<text x="775.0" y="298.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Hart 1</text>
<text x="500" y="200" font-size="23" fill="#1D1D1F" text-anchor="middle">Zuordnung durch Scheduler</text>
<text x="500" y="380" font-size="23" fill="#1D1D1F" text-anchor="middle">Mehr Threads bedeuten nicht automatisch mehr gleichzeitig arbeitende Harts</text>
</svg>
