<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
<rect width="1200" height="320" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Deadlock ist ein Wartezyklus. Starvation ist Warten ohne Zyklus. Livelock ist Betrieb ohne Fortschritt.</text>
<rect x="16" y="52" width="520" height="110" fill="#fff" stroke="#B71C1C" stroke-width="1.4"/>
<text x="28" y="78" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Zyklus</text>
<text x="28" y="106" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Core0 haelt A, will B</text>
<text x="28" y="132" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Core1 haelt B, will A</text>
<rect x="580" y="52" width="560" height="110" fill="#fff" stroke="#1B5E20" stroke-width="1.4"/>
<text x="592" y="78" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Ordnung A vor B</text>
<text x="592" y="106" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">beide erwerben A, dann B</text>
<text x="592" y="132" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">kein Zyklus</text>
<text x="16" y="200" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Timeout allein stellt keinen gueltigen Datenzustand her.</text>
<text x="16" y="232" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Frage: Die ISR spinnt auf ein Schloss, das der unterbrochene Kern haelt. Was folgt?</text>
<text x="16" y="264" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Antwort in den Notizen: Selbstdeadlock. Atomics ersetzen keine Prioritaetsvererbung.</text>
<text x="16" y="296" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Das Schloss nicht blind freigeben, waehrend der Besitzer noch schreibt.</text>
</svg>
