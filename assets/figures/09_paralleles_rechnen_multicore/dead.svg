<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364" role="img" aria-labelledby="title">
<title id="title">Zyklisches Warten und feste Lockreihenfolge</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="364" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Wartekreis trotz korrekter atomarer Sperrprimitive</text>
<rect x="80" y="100" width="330" height="100" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="245.0" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Kern 0 hält A</text>
<text x="245.0" y="173.0" font-size="24" fill="#1D1D1F" text-anchor="middle">will B</text>
<rect x="590" y="100" width="330" height="100" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="755.0" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Kern 1 hält B</text>
<text x="755.0" y="173.0" font-size="24" fill="#1D1D1F" text-anchor="middle">will A</text>
<line x1="420" y1="130" x2="580" y2="130" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="580" y1="170" x2="420" y2="170" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="281" font-size="24" fill="#1D1D1F" text-anchor="middle">Einheitliche Reihenfolge A vor B verhindert diesen Kreis</text>
<text x="500" y="332" font-size="23" fill="#1D1D1F" text-anchor="middle">Timeout darf keine fremde aktive Sperre einfach löschen</text>
</svg>
