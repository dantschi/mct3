<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="415" viewBox="0 0 1000 415" role="img" aria-labelledby="title">
<title id="title">Ordnung über die passende Sperrübergabe</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="415" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Passende Übergabe ordnet geschützte Daten · zwei Threadabläufe</text>
<text x="20" y="140" font-size="24" fill="#1D1D1F" text-anchor="start">Besitzer 0</text>
<text x="20" y="290" font-size="24" fill="#1D1D1F" text-anchor="start">Besitzer 1</text>
<rect x="215" y="100" width="275" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="352.5" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Nutzdaten schreiben</text>
<rect x="570" y="100" width="290" height="70" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="715.0" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Release: freigeben</text>
<rect x="215" y="250" width="275" height="70" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="352.5" y="293.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Acquire: übernehmen</text>
<rect x="570" y="250" width="290" height="70" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="715.0" y="293.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Nutzdaten lesen</text>
<line x1="500" y1="135" x2="560" y2="135" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="500" y1="285" x2="560" y2="285" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="715" y1="180" x2="715" y2="208" stroke="#E2001A" stroke-width="3"/>
<line x1="352" y1="208" x2="715" y2="208" stroke="#E2001A" stroke-width="3"/>
<line x1="352" y1="208" x2="352" y2="240" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="383" font-size="23" fill="#1D1D1F" text-anchor="middle">Passende Release-/Acquire-Beobachtung verbindet die beiden Phasen</text>
</svg>
