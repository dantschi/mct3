<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="354" viewBox="0 0 1000 354" role="img" aria-labelledby="title">
<title id="title">Atomare Einzelobjekte und geordnete Einmalveröffentlichung</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="354" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Einmalpublikation · links beide Objekte atomar, rechts passende Synchronisation</text>
<rect x="20" y="90" width="430" height="160" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="235.0" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">relaxed data = 42</text>
<text x="235.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">relaxed ready = 1</text>
<text x="235.0" y="208.0" font-size="22" fill="#1D1D1F" text-anchor="middle">Leser kann ready 1, data 0 sehen</text>
<rect x="550" y="90" width="430" height="160" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="765.0" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">gewöhnliche data = 42</text>
<text x="765.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Release ready = 1</text>
<text x="765.0" y="208.0" font-size="22" fill="#1D1D1F" text-anchor="middle">Acquire dieser 1 → data 42</text>
<text x="500" y="322" font-size="23" fill="#1D1D1F" text-anchor="middle">Kein späteres Überschreiben · kein automatischer Vertrag für eine neue Runde</text>
</svg>
