<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
<rect width="1200" height="340" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Start 0. Gewoehnliche Writes bleiben kohaerent und verlieren trotzdem ein Update.</text>
<text x="16" y="56" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">Core0</text>
<text x="120" y="56" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Read 0    Add 1    Write 1</text>
<text x="16" y="96" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">Core1</text>
<text x="120" y="96" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">Read 0    Add 1    Write 1</text>
<text x="16" y="140" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Speicher endet bei 1. MESI hat beide Writes geordnet, die Rechnung nicht.</text>
<text x="16" y="176" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Zwei atomare Fetch-Adds: alte Werte 0 und 1, Ende 2. Reihenfolge der Alten offen.</text>
<text x="16" y="214" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Ungeschuetztes C-int ist ein Data Race und in C11 undefiniert. Das Bild ist nur Motivation.</text>
<text x="16" y="248" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">i++ ist eine Quelltextoperation, keine garantierte Atomic-RMW.</text>
<text x="16" y="282" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">AMO kann das RMW in einer Instruktion ausdruecken. Intern bleibt ein Datenpfad.</text>
<text x="16" y="316" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">volatile erzwingt Compilerzugriffe und schafft weder Atomizitaet noch Ordnung.</text>
</svg>
