<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title">
<title id="title">Übernahme, Nutzdaten und geordnete Freigabe</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="280" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Drei Phasen für gewöhnlichen Speicher · kein Cacheflush</text>
<rect x="20" y="85" width="280" height="95" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="160.0" y="125.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Übernahme</text>
<text x="160.0" y="155.5" font-size="20" fill="#1D1D1F" text-anchor="middle">lr.w.aq / erfolgreicher SC</text>
<rect x="355" y="85" width="280" height="95" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="495.0" y="125.5" font-size="24" fill="#1D1D1F" text-anchor="middle">kritischer Abschnitt</text>
<text x="495.0" y="155.5" font-size="20" fill="#1D1D1F" text-anchor="middle">geschützte Reads / Writes</text>
<rect x="700" y="85" width="280" height="95" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="840.0" y="125.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Freigabe</text>
<text x="840.0" y="155.5" font-size="20" fill="#1D1D1F" text-anchor="middle">fence rw,w dann sw 0</text>
<line x1="300" y1="133" x2="350" y2="133" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="635" y1="133" x2="695" y2="133" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="248" font-size="23" fill="#1D1D1F" text-anchor="middle">Die Freigabeordnung steht vor dem Store des freien Schlosswerts</text>
</svg>
