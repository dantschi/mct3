<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title">
<title id="title">Unveränderliche Eingabe und je Worker private Teilsumme</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#656D76"/></marker></defs>
<rect width="1000" height="430" fill="#FFFFFF"/>
<text x="500" y="32" font-size="28" fill="#1D1D1F" text-anchor="middle">Eine gemeinsame Eingabe, getrennte Schreibzuständigkeiten</text>
<rect x="300" y="65" width="100" height="60" rx="8" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="350" y="105" font-size="29" fill="#1D1D1F" text-anchor="middle">1</text>
<text x="350" y="150" font-size="22" fill="#656D76" text-anchor="middle">x[0]</text>
<rect x="400" y="65" width="100" height="60" rx="8" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="450" y="105" font-size="29" fill="#1D1D1F" text-anchor="middle">3</text>
<text x="450" y="150" font-size="22" fill="#656D76" text-anchor="middle">x[1]</text>
<rect x="500" y="65" width="100" height="60" rx="8" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="550" y="105" font-size="29" fill="#1D1D1F" text-anchor="middle">5</text>
<text x="550" y="150" font-size="22" fill="#656D76" text-anchor="middle">x[2]</text>
<rect x="600" y="65" width="100" height="60" rx="8" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="650" y="105" font-size="29" fill="#1D1D1F" text-anchor="middle">7</text>
<text x="650" y="150" font-size="22" fill="#656D76" text-anchor="middle">x[3]</text>
<text x="500" y="190" font-size="23" fill="#656D76" text-anchor="middle">x bleibt während beider Rechnungen unverändert</text>
<line x1="350" y1="207" x2="240" y2="238" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="650" y1="207" x2="760" y2="238" stroke="#656D76" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="80" y="248" width="320" height="88" rx="8" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="240" y="279" font-size="25" fill="#1D1D1F" text-anchor="middle">Worker 0: x[0] + x[1]</text>
<text x="240" y="315" font-size="24" fill="#E2001A" text-anchor="middle">lokaler Akkumulator → 4</text>
<rect x="600" y="248" width="320" height="88" rx="8" fill="#F5F5F7" stroke="#656D76" stroke-width="2"/>
<text x="760" y="279" font-size="25" fill="#1D1D1F" text-anchor="middle">Worker 1: x[2] + x[3]</text>
<text x="760" y="315" font-size="24" fill="#E2001A" text-anchor="middle">lokaler Akkumulator → 12</text>
<text x="500" y="391" font-size="23" fill="#1D1D1F" text-anchor="middle">Getrennte Ergebnisse: teil[0] nur von W0, teil[1] nur von W1 geschrieben.</text>
</svg>
