<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="431" viewBox="0 0 1000 431" role="img" aria-labelledby="title">
<title id="title">Veraltete Fremdkopie ohne Kohärenz</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="431" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Absichtliches Gegenmodell: Write-Through ohne fremde Kopienkoordination</text>
<rect x="80" y="100" width="240" height="95" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="200.0" y="140.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Kern 0 Cache</text>
<text x="200.0" y="170.5" font-size="24" fill="#1D1D1F" text-anchor="middle">neuer Wert 5</text>
<rect x="680" y="100" width="240" height="95" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="800.0" y="140.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Kern 1 Cache</text>
<text x="800.0" y="170.5" font-size="24" fill="#1D1D1F" text-anchor="middle">alte Kopie 0</text>
<rect x="370" y="265" width="260" height="80" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="500.0" y="313.0" font-size="24" fill="#1D1D1F" text-anchor="middle">unterer Stand 5</text>
<line x1="200" y1="205" x2="200" y2="305" stroke="#1D1D1F" stroke-width="2"/>
<line x1="200" y1="305" x2="360" y2="305" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="800" y="275" font-size="23" fill="#1D1D1F" text-anchor="middle">weiter als gültig gelesen</text>
<text x="500" y="400" font-size="23" fill="#1D1D1F" text-anchor="middle">Ein Schreibweg nach unten aktualisiert nicht jede schon gecachte Fremdkopie</text>
</svg>
