<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="1100" height="240">
<rect width="1100" height="240" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="17" font-weight="600" fill="#1D1D1F" text-anchor="start">64-Byte-Grenzen. Dezimaladresse 1000 liegt in Line 960–1023, Offset 40.</text>
<rect x="40" y="40" width="900" height="36" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="48" y="64" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">960</text>
<text x="860" y="64" font-size="16" font-weight="600" fill="#1565C0" text-anchor="end">1023</text>
<line x1="640" y1="40" x2="640" y2="76" stroke="#B71C1C" stroke-width="3"/>
<text x="620" y="100" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="middle">1000</text>
<text x="16" y="140" font-size="17" font-weight="600" fill="#1D1D1F" text-anchor="start">Ausgerichtetes uint32_t-Array, Basis mod 64 = 0: eine Line = 16 Elemente.</text>
<text x="16" y="176" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Weitere Elemente derselben gültigen Line sind Hits, solange sie nicht verdrängt oder invalidiert wird.</text>
<text x="16" y="214" font-size="18" font-weight="600" fill="#B71C1C" text-anchor="start">Ein Miss lädt 960–1023, nicht 1000–1063.</text>
</svg>
