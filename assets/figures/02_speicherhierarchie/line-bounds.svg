<rect width="1000" height="280" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="30" font-size="26" text-anchor="start" fill="#1D1D1F">Dezimaladressen · Blockgröße 64 Byte</text>
