<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" width="1100" height="260">
<rect width="1100" height="260" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="start">Array: aufeinanderfolgende uint32_t in einer 64-Byte-Line</text>
<rect x="16" y="40" width="66" height="40" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="28" y="66" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">+0</text>
<rect x="86" y="40" width="66" height="40" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="98" y="66" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">+4</text>
<rect x="156" y="40" width="66" height="40" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="168" y="66" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">+8</text>
<rect x="226" y="40" width="66" height="40" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="238" y="66" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">+12</text>
<rect x="296" y="40" width="66" height="40" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="308" y="66" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">+16</text>
<rect x="366" y="40" width="66" height="40" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="378" y="66" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">+20</text>
<rect x="436" y="40" width="66" height="40" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="448" y="66" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">+24</text>
<rect x="506" y="40" width="66" height="40" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="518" y="66" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">+28</text>
<text x="16" y="110" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Line 0x1000–0x103F nutzt hier 32 von 64 Byte (8 Wörter gezeichnet).</text>
<text x="16" y="150" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="start">Liste: ein mögliches verstreutes Layout, nicht jedes Listenlayout</text>
<rect x="16" y="168" width="140" height="40" rx="6" fill="#FFF3E0" stroke="#E65100"/>
<text x="28" y="194" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">0x2000</text>
<rect x="220" y="168" width="140" height="40" rx="6" fill="#FFF3E0" stroke="#E65100"/>
<text x="232" y="194" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">0x8040</text>
<rect x="480" y="168" width="140" height="40" rx="6" fill="#FFF3E0" stroke="#E65100"/>
<text x="492" y="194" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">0x4010</text>
<rect x="760" y="168" width="140" height="40" rx="6" fill="#FFF3E0" stroke="#E65100"/>
<text x="772" y="194" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">0x9000</text>
<text x="16" y="240" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Jede Adresse kann eine eigene Line füllen. Nachbarn der Liste liegen dann nicht in der Line.</text>
</svg>
