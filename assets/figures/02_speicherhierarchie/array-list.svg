<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img">
<title>Zusammenhängende Arrayelemente und verteilte per Zeiger verbundene Listenknoten.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="280" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="30" font-size="26" text-anchor="start" fill="#1D1D1F">Array: benachbarte 4-Byte-Elemente</text>
<rect x="20" y="55" width="110" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="75" y="97" font-size="26" text-anchor="middle" fill="#1D1D1F">+0</text>
