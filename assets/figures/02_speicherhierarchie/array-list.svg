<text x="299" y="97" font-size="26" text-anchor="middle" fill="#1D1D1F">+8</text>
<rect x="356" y="55" width="110" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="411" y="97" font-size="26" text-anchor="middle" fill="#1D1D1F">+12</text>
<rect x="468" y="55" width="110" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="523" y="97" font-size="26" text-anchor="middle" fill="#1D1D1F">+16</text>
<rect x="580" y="55" width="110" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="635" y="97" font-size="26" text-anchor="middle" fill="#1D1D1F">+20</text>
<rect x="692" y="55" width="110" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="747" y="97" font-size="26" text-anchor="middle" fill="#1D1D1F">+24</text>
<rect x="804" y="55" width="110" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="859" y="97" font-size="26" text-anchor="middle" fill="#1D1D1F">+28</text>
<text x="20" y="165" font-size="26" text-anchor="start" fill="#1D1D1F">Liste: ein mögliches Streulayout</text>
<rect x="20" y="190" width="200" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="120" y="232" font-size="26" text-anchor="middle" fill="#1D1D1F">0x2000</text>
<path d="M220,222 H270 V222" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="270" y="190" width="200" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="370" y="232" font-size="26" text-anchor="middle" fill="#1D1D1F">0x8040</text>
<path d="M470,222 H520 V222" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="520" y="190" width="200" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
