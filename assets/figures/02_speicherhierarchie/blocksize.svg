<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img">
<title>Gleiche Adressen innerhalb kleiner und großer Cache-Blöcke; zwei gegenüber einem Fill.</title>
