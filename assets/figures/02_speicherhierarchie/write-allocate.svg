<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="1100" height="240">
<rect width="1100" height="240" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Zwei getrennte Entscheidungen, nicht fest gekoppelt.</text>
<rect x="16" y="48" width="500" height="80" rx="6" fill="#fff" stroke="#6A1B9A"/>
<text x="28" y="78" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">Weitergabe: Write-Through oder Write-Back</text>
<rect x="540" y="48" width="530" height="80" rx="6" fill="#fff" stroke="#E65100"/>
<text x="552" y="78" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">Store-Miss: Allocate oder No-Allocate</text>
<text x="16" y="160" font-size="17" font-weight="600" fill="#1D1D1F" text-anchor="start">Allocate: Block laden, Store ausführen, Zustand setzen.</text>
<text x="16" y="192" font-size="17" font-weight="600" fill="#1D1D1F" text-anchor="start">No-Allocate: Store an die nächste Ebene, keinen neuen Eintrag anlegen.</text>
<text x="16" y="224" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start">Matrix-Nullsetzen unten nur eindeutig, wenn die Store-Miss-Policy genannt ist.</text>
</svg>
