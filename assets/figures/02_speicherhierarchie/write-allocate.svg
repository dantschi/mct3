<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img">
<title>Weitergabe und Anlegen einer Line bei Store-Miss sind getrennte Entscheidungen.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="240" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="30" font-size="26" text-anchor="start" fill="#1D1D1F">Zwei Fragen an eine Schreibstrategie</text>
<rect x="20" y="65" width="460" height="150" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<rect x="520" y="65" width="460" height="150" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="250" y="105" font-size="27" text-anchor="middle" fill="#1D1D1F">Änderung weitergeben?</text>
<text x="250" y="155" font-size="25" text-anchor="middle" fill="#1D1D1F">Write-Through</text>
<text x="250" y="190" font-size="25" text-anchor="middle" fill="#1D1D1F">oder Write-Back</text>
<text x="750" y="105" font-size="27" text-anchor="middle" fill="#1D1D1F">Bei Store-Miss laden?</text>
<text x="750" y="155" font-size="25" text-anchor="middle" fill="#1D1D1F">Write-Allocate</text>
<text x="750" y="190" font-size="25" text-anchor="middle" fill="#1D1D1F">oder No-Write-Allocate</text>
</svg>
