<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="305" viewBox="0 0 1000 305" role="img">
<title>Gleich skalierte Balken: hundert Takte Prüfung und fünfhundert Takte zusätzliche Miss-Kosten.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="305" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="30" font-size="26" text-anchor="start" fill="#1D1D1F">100 Zugriffe: Prüfung + zusätzliche Miss-Kosten</text>
<text x="20" y="80" font-size="24" text-anchor="start" fill="#1D1D1F">100 × 1 = 100 Takte</text>
<rect x="20" y="95" width="160" height="40" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="20" y="180" font-size="24" text-anchor="start" fill="#1D1D1F">5 × 100 = 500 Takte zusätzlich</text>
<rect x="20" y="195" width="800" height="40" rx="10" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="20" y="280" font-size="26" text-anchor="start" fill="#1D1D1F">Gesamt: 600 Takte / 100 Zugriffe = 6 Takte pro Zugriff</text>
</svg>
