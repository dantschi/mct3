<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300">
<rect width="1100" height="300" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">100 Zugriffe, Hit Time 1, zusätzliche Miss Penalty 100 (berechnetes Modell)</text>
<rect x="16" y="40" width="760" height="28" rx="6" fill="#E8F5E9" stroke="#1B5E20"/>
<text x="24" y="60" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">100 × 1 Takt Hit Time</text>
<rect x="16" y="78" width="38" height="28" rx="6" fill="#FFEBEE" stroke="#B71C1C"/>
<text x="64" y="98" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">5 × 100 Takte extra</text>
<text x="16" y="140" font-size="20" font-weight="600" fill="#1D1D1F" text-anchor="start">95×1 + 5×(1+100) = 600 Takte;  600/100 = 6 Takte/Zugriff</text>
<text x="16" y="176" font-size="18" font-weight="600" fill="#6A1B9A" text-anchor="start">AMAT = 1 + MissRate×100</text>
<text x="16" y="210" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Kurve (Modell): Miss Rate 0 → 1;  5 % → 6;  10 % → 11;  50 % → 51</text>
<text x="16" y="246" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start">6 Takte sind mittlere Zugriffszeit. 100/6 ist kein gemessener Programm-Speedup.</text>
<text x="16" y="278" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start">Ohne Cache im selben Modell: jeder Zugriff 100 Takte, nicht 1+100.</text>
</svg>
