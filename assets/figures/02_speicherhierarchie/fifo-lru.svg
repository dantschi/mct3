<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360">
<rect width="1100" height="360" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Ein kaltes 4-Way-Set. Alt links, neu rechts. Nur Loads.</text>
<text x="16" y="56" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">FIFO nach A B C D A</text>
<text x="560" y="56" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">LRU nach A B C D A</text>
<rect x="16" y="72" width="110" height="44" rx="6" fill="#FFEBEE" stroke="#B71C1C"/>
<text x="28" y="100" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">A alt</text>
<rect x="136" y="72" width="110" height="44" rx="6" fill="#FFEBEE" stroke="#B71C1C"/>
<text x="148" y="100" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">B</text>
<rect x="256" y="72" width="110" height="44" rx="6" fill="#FFEBEE" stroke="#B71C1C"/>
<text x="268" y="100" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">C</text>
<rect x="376" y="72" width="110" height="44" rx="6" fill="#FFEBEE" stroke="#B71C1C"/>
<text x="388" y="100" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">D neu</text>
<rect x="560" y="72" width="110" height="44" rx="6" fill="#E8F5E9" stroke="#1B5E20"/>
<text x="572" y="100" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">B alt</text>
<rect x="680" y="72" width="110" height="44" rx="6" fill="#E8F5E9" stroke="#1B5E20"/>
<text x="692" y="100" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">C</text>
<rect x="800" y="72" width="110" height="44" rx="6" fill="#E8F5E9" stroke="#1B5E20"/>
<text x="812" y="100" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">D</text>
<rect x="920" y="72" width="110" height="44" rx="6" fill="#E8F5E9" stroke="#1B5E20"/>
<text x="932" y="100" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">A neu</text>
<rect x="16" y="150" width="500" height="80" rx="6" fill="#FFEBEE" stroke="#B71C1C"/>
<text x="28" y="182" font-size="18" font-weight="600" fill="#B71C1C" text-anchor="start">E verdrängt FIFO-A</text>
<text x="28" y="210" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Hit auf A aendert FIFO nicht</text>
<rect x="560" y="150" width="500" height="80" rx="6" fill="#E8F5E9" stroke="#1B5E20"/>
<text x="572" y="182" font-size="18" font-weight="600" fill="#1B5E20" text-anchor="start">E verdrängt LRU-B</text>
<text x="572" y="210" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">A wurde zuletzt benutzt</text>
<text x="16" y="270" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Danach: FIFO B C D E,  LRU C D A E.</text>
<text x="16" y="310" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start">LRU kennt die Zukunft nicht. Pseudo-LRU naehert die Reihenfolge an.</text>
</svg>
