<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img">
<title>FIFO behält die Ladereihenfolge; LRU verjüngt A und verdrängt B.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="300" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="30" font-size="26" text-anchor="start" fill="#1D1D1F">Nach A, B, C, D, A · alt links, neu rechts</text>
<text x="20" y="125" font-size="27" text-anchor="start" fill="#1D1D1F">FIFO</text>
<rect x="150" y="90" width="105" height="60" rx="10" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="202" y="129" font-size="28" text-anchor="middle" fill="#1D1D1F">A</text>
<rect x="275" y="90" width="105" height="60" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="327" y="129" font-size="28" text-anchor="middle" fill="#1D1D1F">B</text>
<rect x="400" y="90" width="105" height="60" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="452" y="129" font-size="28" text-anchor="middle" fill="#1D1D1F">C</text>
<rect x="525" y="90" width="105" height="60" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="577" y="129" font-size="28" text-anchor="middle" fill="#1D1D1F">D</text>
<text x="700" y="128" font-size="26" text-anchor="start" fill="#1D1D1F">E verdrängt A</text>
<text x="20" y="245" font-size="27" text-anchor="start" fill="#1D1D1F">LRU</text>
<rect x="150" y="210" width="105" height="60" rx="10" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="202" y="249" font-size="28" text-anchor="middle" fill="#1D1D1F">B</text>
<rect x="275" y="210" width="105" height="60" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="327" y="249" font-size="28" text-anchor="middle" fill="#1D1D1F">C</text>
<rect x="400" y="210" width="105" height="60" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="452" y="249" font-size="28" text-anchor="middle" fill="#1D1D1F">D</text>
<rect x="525" y="210" width="105" height="60" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="577" y="249" font-size="28" text-anchor="middle" fill="#1D1D1F">A</text>
<text x="700" y="248" font-size="26" text-anchor="start" fill="#1D1D1F">E verdrängt B</text>
</svg>
