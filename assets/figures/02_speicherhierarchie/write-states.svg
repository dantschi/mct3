<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300">
<rect width="1100" height="300" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="20" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Ein Wort, Start Cache=0, nächste Ebene=0. Stores 5, dann 7. Ein-Level-Modell.</text>
<rect x="16" y="40" width="1060" height="60" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="28" y="66" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">Write-Through ohne Puffer</text>
<text x="28" y="90" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Cache 5 dann 7, Ebene sofort 5 dann 7</text>
<rect x="16" y="110" width="1060" height="60" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="28" y="136" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">Write-Through mit Puffer</text>
<text x="28" y="160" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Cache schon 5/7; Puffer hält Updates; voller Puffer → Stall</text>
<rect x="16" y="180" width="1060" height="60" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="28" y="206" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">Write-Back</text>
<text x="28" y="230" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Cache 5/7, Dirty=1; nächste Ebene bleibt 0 bis Writeback</text>
<text x="16" y="270" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Dirty=0: Line verwerfen. Dirty=1: im einfachen Modell erst Writeback, dann Refill.</text>
<text x="16" y="294" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Die Penalty verdoppelt sich nicht universell; Puffer und Überlappung ändern das.</text>
</svg>
