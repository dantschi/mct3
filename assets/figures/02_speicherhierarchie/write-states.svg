<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="325" viewBox="0 0 1000 325" role="img">
<title>Gleiche Stores, getrennte Weitergabestrategien und Zustände.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="325" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="30" font-size="26" text-anchor="start" fill="#1D1D1F">Store-Hits: 0 → 5 → 7</text>
<text x="20" y="98" font-size="23" text-anchor="start" fill="#1D1D1F">Write-Through</text>
<rect x="290" y="60" width="280" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<rect x="650" y="60" width="330" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="430" y="100" font-size="24" text-anchor="middle" fill="#1D1D1F">Cache 7</text>
<text x="815" y="100" font-size="22" text-anchor="middle" fill="#1D1D1F">nächste Ebene 7</text>
<path d="M570,92 H650 V92" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="183" font-size="23" text-anchor="start" fill="#1D1D1F">mit Schreibpuffer</text>
<rect x="290" y="145" width="280" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<rect x="650" y="145" width="330" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="430" y="185" font-size="24" text-anchor="middle" fill="#1D1D1F">Cache 7</text>
<text x="815" y="185" font-size="22" text-anchor="middle" fill="#1D1D1F">Updates ggf. ausstehend</text>
<path d="M570,177 H650 V177" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="268" font-size="23" text-anchor="start" fill="#1D1D1F">Write-Back</text>
<rect x="290" y="230" width="280" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<rect x="650" y="230" width="330" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="430" y="270" font-size="24" text-anchor="middle" fill="#1D1D1F">Cache 7, Dirty 1</text>
<text x="815" y="270" font-size="22" text-anchor="middle" fill="#1D1D1F">nächste Ebene noch 0</text>
</svg>
