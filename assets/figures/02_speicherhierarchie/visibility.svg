<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="1100" height="240">
<rect width="1100" height="240" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<rect x="16" y="16" width="320" height="90" rx="6" fill="#F3E5F5" stroke="#6A1B9A"/>
<text x="28" y="48" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">Kern, Dirty-Kopie 5</text>
<text x="28" y="76" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">regulärer Write-Back</text>
<rect x="360" y="16" width="320" height="90" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="372" y="48" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Untere Ebene noch 0</text>
<text x="372" y="76" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">kein Kohärenzfehler</text>
<rect x="16" y="130" width="500" height="80" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="28" y="162" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Kohärenter zweiter Kern: aktueller Wert über das Protokoll,</text>
<text x="28" y="188" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">DRAM muss nicht jederzeit 5 enthalten. Details: Block 9.</text>
<rect x="540" y="130" width="530" height="80" rx="6" fill="#FFF3E0" stroke="#E65100"/>
<text x="552" y="162" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Nicht kohärentes DMA: Maintenance am</text>
<text x="552" y="188" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">gemeinsamen Punkt. Kein Zicbom für jedes RV32I.</text>
</svg>
