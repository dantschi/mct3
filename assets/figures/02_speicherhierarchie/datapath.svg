<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340">
<rect width="1100" height="340" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1D1D1F"/></marker></defs>
<text x="16" y="24" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Direct-Mapped-Leseweg. Ein Miss geht zur naechsten Ebene, nicht immer zum DRAM.</text>
<rect x="16" y="48" width="140" height="44" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="26" y="76" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Adresse</text>
<rect x="190" y="48" width="140" height="44" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="200" y="76" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Index</text>
<rect x="360" y="48" width="140" height="44" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="370" y="76" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Tag + Valid</text>
<rect x="560" y="48" width="140" height="44" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="570" y="76" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Vergleich</text>
<rect x="760" y="48" width="140" height="44" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="770" y="76" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Offset-MUX</text>
<rect x="940" y="48" width="140" height="44" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="950" y="76" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">CPU</text>
<line x1="156" y1="70" x2="186" y2="70" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arr)"/>
<line x1="330" y1="70" x2="360" y2="70" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arr)"/>
<line x1="500" y1="70" x2="530" y2="70" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arr)"/>
<line x1="700" y1="70" x2="730" y2="70" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arr)"/>
<line x1="900" y1="70" x2="930" y2="70" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arr)"/>
<rect x="190" y="130" width="310" height="70" rx="6" fill="#F3E5F5" stroke="#6A1B9A"/>
<text x="204" y="158" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">gespeichertes Tag</text>
<text x="204" y="184" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">Valid = 1 und Tag gleich</text>
<rect x="560" y="130" width="300" height="70" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="574" y="158" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Datenarray, ein Way</text>
<text x="574" y="184" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">Offset waehlt das Wort</text>
<line x1="345" y1="130" x2="345" y2="96" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arr)"/>
<line x1="700" y1="130" x2="830" y2="96" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arr)"/>
<rect x="16" y="230" width="500" height="80" rx="6" fill="#FFEBEE" stroke="#B71C1C"/>
<text x="28" y="260" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">Miss: Fill von der naechsten Ebene</text>
<text x="28" y="288" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">alte Dirty-Line zuerst sichern</text>
<rect x="540" y="230" width="530" height="80" rx="6" fill="#E8F5E9" stroke="#1B5E20"/>
<text x="552" y="260" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">4-Way: vier Kandidaten, ein Hit-Way</text>
<text x="552" y="288" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Decoder, SRAM, Vergleich brauchen Zeit</text>
</svg>
