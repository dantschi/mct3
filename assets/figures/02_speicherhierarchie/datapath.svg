<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300">
<rect width="1100" height="300" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Direct Mapped: ein Way. 4-Way: vier Vergleiche, gleicher Datenumfang.</text>
<rect x="16" y="40" width="200" height="50" rx="6" fill="#FFF3E0" stroke="#E65100"/>
<text x="28" y="70" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">Index → Decoder</text>
<rect x="240" y="40" width="200" height="50" rx="6" fill="#F3E5F5" stroke="#6A1B9A"/>
<text x="252" y="70" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">Tag-Speicher</text>
<rect x="460" y="40" width="180" height="50" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="476" y="70" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Valid</text>
<rect x="660" y="40" width="200" height="50" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="676" y="70" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">Datenarray</text>
<rect x="240" y="120" width="220" height="44" rx="6" fill="#fff" stroke="#1B5E20"/>
<text x="252" y="148" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Tag gleich und Valid</text>
<rect x="500" y="120" width="220" height="44" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="512" y="148" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">Offset wählt Wort</text>
<rect x="760" y="120" width="140" height="44" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="790" y="148" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">zur CPU</text>
<text x="16" y="200" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">4-Way: vier Ways des Sets, vier Komparatoren, ein Daten-MUX.</text>
<text x="16" y="232" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Tag-Vergleiche können parallel sein. Der Gesamtzugriff hat trotzdem Laufzeit.</text>
<text x="16" y="270" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start">Kein Dividierer für den Index. Decoder, SRAM, Vergleich und MUX brauchen Zeit.</text>
</svg>
