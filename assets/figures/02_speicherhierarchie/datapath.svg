<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" role="img">
<title>Index liest den Eintrag; gespeichertes und angefragtes Tag werden geprüft; Offset wählt Daten.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="345" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<rect x="20" y="20" width="170" height="60" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="105.0" y="58" font-size="25" text-anchor="middle" fill="#1D1D1F">Index</text>
<rect x="20" y="140" width="170" height="60" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="105.0" y="178" font-size="25" text-anchor="middle" fill="#1D1D1F">Anfrage-Tag</text>
<rect x="20" y="260" width="170" height="60" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="105.0" y="298" font-size="25" text-anchor="middle" fill="#1D1D1F">Offset</text>
<rect x="270" y="20" width="330" height="85" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="435.0" y="58" font-size="25" text-anchor="middle" fill="#1D1D1F">Cache-Eintrag</text>
<rect x="680" y="135" width="270" height="65" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="815.0" y="173" font-size="25" text-anchor="middle" fill="#1D1D1F">Tag-Vergleich</text>
<rect x="350" y="260" width="250" height="60" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="475.0" y="298" font-size="25" text-anchor="middle" fill="#1D1D1F">Offset-MUX</text>
<text x="435" y="87" font-size="22" text-anchor="middle" fill="#1D1D1F">Tag · Valid · Daten</text>
<path d="M190,50 H270 V50" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M190,170 H680 V170" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600,50 H815 V135" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600,90 H640 V240" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M640,240 H475 V260" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M190,290 H350 V290" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600,290 H900 V290" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="910" y="298" font-size="22" text-anchor="start" fill="#1D1D1F">Daten</text>
<text x="815" y="230" font-size="22" text-anchor="middle" fill="#E2001A">Valid = 1 und Tag gleich → Hit</text>
</svg>
