<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420">
<rect width="1100" height="420" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Miniatur: 16 Zeilen, je eine 64-Byte-Line. 8 DM-Plaetze. Nicht 1000x1000.</text>
<rect x="16" y="40" width="28" height="16" rx="6" fill="#E8F5E9" stroke="#1D1D1F"/>
<text x="48" y="53" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 00  Set 0</text>
<rect x="16" y="58" width="28" height="16" rx="6" fill="#E8F5E9" stroke="#1D1D1F"/>
<text x="48" y="71" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 01  Set 1</text>
<rect x="16" y="76" width="28" height="16" rx="6" fill="#E8F5E9" stroke="#1D1D1F"/>
<text x="48" y="89" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 02  Set 2</text>
<rect x="16" y="94" width="28" height="16" rx="6" fill="#E8F5E9" stroke="#1D1D1F"/>
<text x="48" y="107" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 03  Set 3</text>
<rect x="16" y="112" width="28" height="16" rx="6" fill="#E8F5E9" stroke="#1D1D1F"/>
<text x="48" y="125" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 04  Set 4</text>
<rect x="16" y="130" width="28" height="16" rx="6" fill="#E8F5E9" stroke="#1D1D1F"/>
<text x="48" y="143" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 05  Set 5</text>
<rect x="16" y="148" width="28" height="16" rx="6" fill="#E8F5E9" stroke="#1D1D1F"/>
<text x="48" y="161" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 06  Set 6</text>
<rect x="16" y="166" width="28" height="16" rx="6" fill="#E8F5E9" stroke="#1D1D1F"/>
<text x="48" y="179" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 07  Set 7</text>
<rect x="16" y="184" width="28" height="16" rx="6" fill="#FFEBEE" stroke="#1D1D1F"/>
<text x="48" y="197" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 08  Set 0</text>
<rect x="16" y="202" width="28" height="16" rx="6" fill="#FFEBEE" stroke="#1D1D1F"/>
<text x="48" y="215" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 09  Set 1</text>
<rect x="16" y="220" width="28" height="16" rx="6" fill="#FFEBEE" stroke="#1D1D1F"/>
<text x="48" y="233" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 10  Set 2</text>
<rect x="16" y="238" width="28" height="16" rx="6" fill="#FFEBEE" stroke="#1D1D1F"/>
<text x="48" y="251" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 11  Set 3</text>
<rect x="16" y="256" width="28" height="16" rx="6" fill="#FFEBEE" stroke="#1D1D1F"/>
<text x="48" y="269" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 12  Set 4</text>
<rect x="16" y="274" width="28" height="16" rx="6" fill="#FFEBEE" stroke="#1D1D1F"/>
<text x="48" y="287" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 13  Set 5</text>
<rect x="16" y="292" width="28" height="16" rx="6" fill="#FFEBEE" stroke="#1D1D1F"/>
<text x="48" y="305" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 14  Set 6</text>
<rect x="16" y="310" width="28" height="16" rx="6" fill="#FFEBEE" stroke="#1D1D1F"/>
<text x="48" y="323" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeile 15  Set 7</text>
<rect x="280" y="40" width="360" height="140" rx="6" fill="#E8F5E9" stroke="#1B5E20"/>
<text x="296" y="70" font-size="18" font-weight="600" fill="#1B5E20" text-anchor="start">Zeilenweise</text>
<text x="296" y="100" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">1 Miss, dann 15 Hits</text>
<text x="296" y="130" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">gesamt 16 M / 240 H</text>
<text x="296" y="160" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">Line bleibt bis Zeilenende</text>
<rect x="280" y="200" width="360" height="160" rx="6" fill="#FFEBEE" stroke="#B71C1C"/>
<text x="296" y="230" font-size="18" font-weight="600" fill="#B71C1C" text-anchor="start">Spaltenweise</text>
<text x="296" y="260" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">Schritt = eine Zeile = 64 B</text>
<text x="296" y="290" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">Zeile r und r+8: Set r%8</text>
<text x="296" y="320" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">gesamt 256 M / 0 H</text>
<rect x="680" y="40" width="390" height="320" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="696" y="70" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">Grosses C-Beispiel getrennt</text>
<text x="696" y="110" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">1000 Spalten x 4 Byte</text>
<text x="696" y="146" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Zeilenabstand 4000 Byte</text>
<text x="696" y="182" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">4000 mod 64 = 32</text>
<text x="696" y="230" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">Keine exakte Miss-Quote</text>
<text x="696" y="266" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">ohne festgelegte Spur.</text>
<text x="16" y="360" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Nur die 256 Daten-Loads. Basis 0x1000 ist eine Annahme.</text>
<text x="16" y="390" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">Store-Zaehlung nur mit genannter Write-Allocate-Policy.</text>
</svg>
