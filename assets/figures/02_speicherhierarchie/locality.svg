<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="315" viewBox="0 0 1000 315" role="img">
<title>Zwei getrennte Zugriffsspuren mit Miss, Hit, Hit.</title>
<style>text{font-family:Inter,Arial,sans-serif;font-weight:400}</style>
<rect width="1000" height="315" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#86868B"/></marker></defs>
<text x="20" y="35" font-size="26" text-anchor="start" fill="#1D1D1F">Zeitlich</text>
<rect x="210" y="10" width="220" height="90" rx="10" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="320" y="39" font-size="26" text-anchor="middle" fill="#1D1D1F">0x1000</text>
<text x="320" y="75" font-size="24" text-anchor="middle" fill="#E2001A">Miss</text>
<path d="M430,55 H460 V55" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="460" y="10" width="220" height="90" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="570" y="39" font-size="26" text-anchor="middle" fill="#1D1D1F">0x1000</text>
<text x="570" y="75" font-size="24" text-anchor="middle" fill="#1D1D1F">Hit</text>
<path d="M680,55 H710 V55" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="710" y="10" width="220" height="90" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="820" y="39" font-size="26" text-anchor="middle" fill="#1D1D1F">0x1000</text>
<text x="820" y="75" font-size="24" text-anchor="middle" fill="#1D1D1F">Hit</text>
<text x="20" y="175" font-size="26" text-anchor="start" fill="#1D1D1F">Räumlich</text>
<rect x="210" y="150" width="220" height="90" rx="10" fill="#F5F5F7" stroke="#E2001A" stroke-width="2"/>
<text x="320" y="179" font-size="26" text-anchor="middle" fill="#1D1D1F">0x1000</text>
<text x="320" y="215" font-size="24" text-anchor="middle" fill="#E2001A">Miss</text>
<path d="M430,195 H460 V195" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="460" y="150" width="220" height="90" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="570" y="179" font-size="26" text-anchor="middle" fill="#1D1D1F">0x1004</text>
<text x="570" y="215" font-size="24" text-anchor="middle" fill="#1D1D1F">Hit</text>
<path d="M680,195 H710 V195" fill="none" stroke="#86868B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="710" y="150" width="220" height="90" rx="10" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="2"/>
<text x="820" y="179" font-size="26" text-anchor="middle" fill="#1D1D1F">0x1008</text>
<text x="820" y="215" font-size="24" text-anchor="middle" fill="#1D1D1F">Hit</text>
<text x="20" y="290" font-size="24" text-anchor="start" fill="#1D1D1F">Jeweils kalt; 64-Byte-Lines; keine Verdrängung.</text>
</svg>
