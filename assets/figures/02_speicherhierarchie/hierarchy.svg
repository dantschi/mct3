<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220">
<rect width="1000" height="220" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<rect x="16" y="40" width="120" height="50" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="48" y="70" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">CPU</text>
<rect x="180" y="16" width="140" height="44" rx="6" fill="#FFF3E0" stroke="#E65100"/>
<text x="200" y="44" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">L1-I</text>
<rect x="180" y="76" width="140" height="44" rx="6" fill="#E3F2FD" stroke="#1565C0"/>
<text x="200" y="104" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">L1-D</text>
<rect x="380" y="40" width="160" height="50" rx="6" fill="#fff" stroke="#1D1D1F"/>
<text x="420" y="70" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">L2</text>
<rect x="600" y="40" width="200" height="50" rx="6" fill="#F3E5F5" stroke="#6A1B9A"/>
<text x="640" y="70" font-size="16" font-weight="600" fill="#6A1B9A" text-anchor="start">nächste Ebene</text>
<line x1="136" y1="50" x2="180" y2="38" stroke="#E65100" stroke-width="2"/>
<line x1="136" y1="70" x2="180" y2="98" stroke="#1565C0" stroke-width="2"/>
<line x1="320" y1="38" x2="380" y2="60" stroke="#1D1D1F"/>
<line x1="320" y1="98" x2="380" y2="70" stroke="#1D1D1F"/>
<line x1="540" y1="65" x2="600" y2="65" stroke="#6A1B9A" stroke-width="2"/>
<text x="16" y="160" font-size="17" font-weight="600" fill="#1D1D1F" text-anchor="start">L1-Miss geht zur nächsten Ebene, nicht zwingend bis DRAM.</text>
<text x="16" y="196" font-size="16" font-weight="400" fill="#5F6368" text-anchor="start">Größen und Takte der Folie sind Größenordnungen, keine Messreihe.</text>
</svg>
