<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<rect width="1200" height="440" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="17" font-weight="600" fill="#1D1D1F" text-anchor="start">SoC-Transaktionen und DRAM-Kommandos sind zwei Ebenen.</text>
<text x="16" y="52" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Bus, angenommen: Einzelbeats brauchen je eine Anfrage. Burst buendelt Beats.</text>
<text x="16" y="90" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">einzeln</text>
<rect x="120" y="70" width="28" height="22" rx="2" fill="#1565C0" stroke="#1565C0" stroke-width="0"/>
<rect x="150" y="70" width="28" height="22" rx="2" fill="#fff" stroke="#5F6368" stroke-width="1.6"/>
<rect x="190" y="70" width="28" height="22" rx="2" fill="#1565C0" stroke="#1565C0" stroke-width="0"/>
<rect x="220" y="70" width="28" height="22" rx="2" fill="#fff" stroke="#5F6368" stroke-width="1.6"/>
<rect x="260" y="70" width="28" height="22" rx="2" fill="#1565C0" stroke="#1565C0" stroke-width="0"/>
<rect x="290" y="70" width="28" height="22" rx="2" fill="#fff" stroke="#5F6368" stroke-width="1.6"/>
<rect x="330" y="70" width="28" height="22" rx="2" fill="#1565C0" stroke="#1565C0" stroke-width="0"/>
<rect x="360" y="70" width="28" height="22" rx="2" fill="#fff" stroke="#5F6368" stroke-width="1.6"/>
<rect x="400" y="70" width="28" height="22" rx="2" fill="#1565C0" stroke="#1565C0" stroke-width="0"/>
<rect x="430" y="70" width="28" height="22" rx="2" fill="#fff" stroke="#5F6368" stroke-width="1.6"/>
<rect x="470" y="70" width="28" height="22" rx="2" fill="#1565C0" stroke="#1565C0" stroke-width="0"/>
<rect x="500" y="70" width="28" height="22" rx="2" fill="#fff" stroke="#5F6368" stroke-width="1.6"/>
<text x="16" y="140" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">Burst</text>
<rect x="120" y="120" width="40" height="22" rx="2" fill="#6A1B9A" stroke="#6A1B9A" stroke-width="0"/>
<rect x="170" y="120" width="30" height="22" rx="2" fill="#E65100" stroke="#E65100" stroke-width="0"/>
<rect x="206" y="120" width="30" height="22" rx="2" fill="#E65100" stroke="#E65100" stroke-width="0"/>
<rect x="242" y="120" width="30" height="22" rx="2" fill="#E65100" stroke="#E65100" stroke-width="0"/>
<rect x="278" y="120" width="30" height="22" rx="2" fill="#E65100" stroke="#E65100" stroke-width="0"/>
<rect x="314" y="120" width="30" height="22" rx="2" fill="#E65100" stroke="#E65100" stroke-width="0"/>
<rect x="350" y="120" width="30" height="22" rx="2" fill="#E65100" stroke="#E65100" stroke-width="0"/>
<text x="560" y="110" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">dunkle Kaestchen: Adressphase. Helle: Warten der CPU.</text>
<text x="16" y="180" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">DRAM, Open-Page, dieselbe zunaechst geschlossene Zeile:</text>
<text x="16" y="210" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">ACT</text>
<rect x="80" y="192" width="50" height="24" rx="2" fill="#B71C1C" stroke="#B71C1C" stroke-width="0"/>
<rect x="150" y="192" width="48" height="24" rx="2" fill="#1B5E20" stroke="#1B5E20" stroke-width="0"/>
<text x="158" y="210" font-size="13" font-weight="600" fill="#fff" text-anchor="start">RD</text>
<rect x="210" y="192" width="48" height="24" rx="2" fill="#1B5E20" stroke="#1B5E20" stroke-width="0"/>
<text x="218" y="210" font-size="13" font-weight="600" fill="#fff" text-anchor="start">RD</text>
<rect x="270" y="192" width="48" height="24" rx="2" fill="#1B5E20" stroke="#1B5E20" stroke-width="0"/>
<text x="278" y="210" font-size="13" font-weight="600" fill="#fff" text-anchor="start">RD</text>
<rect x="330" y="192" width="48" height="24" rx="2" fill="#1B5E20" stroke="#1B5E20" stroke-width="0"/>
<text x="338" y="210" font-size="13" font-weight="600" fill="#fff" text-anchor="start">RD</text>
<text x="400" y="210" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Row-Hits auch bei getrennten SoC-Zugriffen</text>
<text x="16" y="260" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">Zeilenwechsel: RD, PRE, ACT, RD. Offene passende Zeile: kein neues ACT.</text>
<text x="16" y="300" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">Nicht: 16 Einzeltransfers bedeuten 16 Row-Aktivierungen.</text>
<text x="16" y="334" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Vergleichen: Protokollaufwand, raeumliche Lokalitaet, CPU-Wartezeit. Keine feste Beschleunigung.</text>
<text x="16" y="368" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Laengere Busbelegung ist der Preis des Bursts. Arbitration je Beat ist nur eine angenommene Politik.</text>
<text x="16" y="400" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">On-Chip-SRAM hat keine DRAM-Zeile. Der Bezug auf Vorlesung 1 gilt nur fuer DRAM.</text>
<text x="16" y="428" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Eine DMA-Laenge ist nicht automatisch die DRAM-Burstlaenge.</text>
</svg>
