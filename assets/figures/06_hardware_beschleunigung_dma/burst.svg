<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="355" viewBox="0 0 1000 355" role="img" aria-labelledby="title">
<title id="title">Ein endlicher FIFO entkoppelt Speicherburst und einzelne Requests</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="355" fill="#FFFFFF"/>
<rect x="20" y="110" width="220" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="130.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Speicher</text>
<text x="130.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Burst liefert Daten</text>
<rect x="395" y="110" width="260" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="525.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">DMA-FIFO</text>
<text x="525.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">endliche Kapazität</text>
<rect x="790" y="110" width="190" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="885.0" y="153.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Peripherie</text>
<text x="885.0" y="183.0" font-size="24" fill="#1D1D1F" text-anchor="middle">entnimmt</text>
<line x1="240" y1="160" x2="390" y2="160" stroke="#E2001A" stroke-width="4" marker-end="url(#arrow)"/>
<text x="317" y="132" font-size="23" fill="#1D1D1F" text-anchor="middle">gebündelt</text>
<line x1="655" y1="160" x2="785" y2="160" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="720" y="132" font-size="23" fill="#1D1D1F" text-anchor="middle">einzeln</text>
<line x1="790" y1="240" x2="660" y2="240" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="725" y="271" font-size="23" fill="#1D1D1F" text-anchor="middle">Request</text>
<text x="20" y="35" font-size="24" fill="#1D1D1F" text-anchor="start">Speicherzugriff und Peripherieverbrauch haben andere Zeitmuster</text>
<text x="500" y="327" font-size="23" fill="#1D1D1F" text-anchor="middle">FIFO puffert kurzzeitig; voller oder leerer FIFO begrenzt den Weg</text>
</svg>
