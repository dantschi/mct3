<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title">
<title id="title">CPU-Zeiger und DMA-Geräteadresse können unterschiedliche Zahlen haben</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="410" fill="#FFFFFF"/>
<rect x="20" y="70" width="270" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="155.0" y="105.5" font-size="24" fill="#1D1D1F" text-anchor="middle">CPU-Zeiger</text>
<text x="155.0" y="135.5" font-size="24" fill="#1D1D1F" text-anchor="middle">virtuelle Adresse</text>
<rect x="20" y="245" width="270" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="155.0" y="280.5" font-size="24" fill="#1D1D1F" text-anchor="middle">DMA-Geräteadresse</text>
<text x="155.0" y="310.5" font-size="24" fill="#1D1D1F" text-anchor="middle">für diesen Initiator</text>
<rect x="430" y="155" width="210" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="535.0" y="190.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Plattform</text>
<text x="535.0" y="220.5" font-size="24" fill="#1D1D1F" text-anchor="middle">übersetzt/ordnet zu</text>
<rect x="770" y="155" width="210" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="875.0" y="190.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Derselbe</text>
<text x="875.0" y="220.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Speicherbereich</text>
<line x1="290" y1="113" x2="425" y2="183" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="290" y1="287" x2="425" y2="211" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="640" y1="197" x2="765" y2="197" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="20" y="35" font-size="24" fill="#1D1D1F" text-anchor="start">Gleicher Speicher bedeutet nicht automatisch gleiche Zahl</text>
<text x="500" y="385" font-size="24" fill="#1D1D1F" text-anchor="middle">Ein C-Cast erzeugt keine Geräteabbildung</text>
</svg>
