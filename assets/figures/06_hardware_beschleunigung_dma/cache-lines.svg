<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="363" viewBox="0 0 1000 363" role="img" aria-labelledby="title">
<title id="title">Hundert Bytes berühren vier ganze Cachezeilen mit gemeinsamem Rand</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="363" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">32 Bytes pro Zeile · Ausschnitt ab 0x20001000</text>
<rect x="90" y="105" width="210" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="195" y="93" font-size="23" fill="#1D1D1F" text-anchor="middle">+0x00</text>
<rect x="300" y="105" width="210" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="405" y="93" font-size="23" fill="#1D1D1F" text-anchor="middle">+0x20</text>
<rect x="510" y="105" width="210" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="615" y="93" font-size="23" fill="#1D1D1F" text-anchor="middle">+0x40</text>
<rect x="720" y="105" width="210" height="65" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="825" y="93" font-size="23" fill="#1D1D1F" text-anchor="middle">+0x60</text>
<rect x="109.6875" y="111" width="656.25" height="53" rx="0" fill="#F5F5F7" stroke="#E2001A"/>
<text x="450" y="144" font-size="24" fill="#1D1D1F" text-anchor="middle">Puffer: 100 Bytes</text>
<line x1="109.6875" y1="180" x2="109.6875" y2="235" stroke="#E2001A" stroke-width="2"/>
<text x="110" y="263" font-size="23" fill="#1D1D1F" text-anchor="start">Start +0x03</text>
<line x1="765.9375" y1="180" x2="765.9375" y2="235" stroke="#E2001A" stroke-width="2"/>
<text x="760" y="263" font-size="23" fill="#1D1D1F" text-anchor="middle">Ende +0x67</text>
<text x="500" y="333" font-size="23" fill="#1D1D1F" text-anchor="middle">Wartungsbereich: +0x00 bis ausschließlich +0x80 = 128 Bytes</text>
</svg>
