<rect x="620" y="210" width="320" height="44" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="780" y="240" font-size="24" fill="#1D1D1F" text-anchor="middle">0x20002004</text>
<line x1="410" y1="209" x2="615" y2="232" stroke="#E2001A" stroke-width="2" marker-end="url(#arrow)"/>
