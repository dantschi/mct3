<line x1="410" y1="175" x2="615" y2="122" stroke="#E2001A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="620" y="155" width="320" height="44" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
