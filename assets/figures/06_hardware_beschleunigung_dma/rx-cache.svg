<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="373" viewBox="0 0 1000 373" role="img" aria-labelledby="title">
<title id="title">Eine alte Dirty-Cachekopie kann neu empfangene Daten überschreiben</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="373" fill="#FFFFFF"/>
<text x="20" y="35" font-size="24" fill="#1D1D1F" text-anchor="start">Fehlerfall: alte Dirty-Zeile bleibt während DMA-Empfang</text>
<rect x="20" y="110" width="270" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="155.0" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">CPU-Cache</text>
<text x="155.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">AA · alt und Dirty</text>
<rect x="365" y="110" width="270" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Speicher</text>
<text x="500.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">55 · neu</text>
<rect x="710" y="110" width="270" height="90" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="845.0" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">DMA</text>
<text x="845.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">schreibt 55</text>
<line x1="705" y1="155" x2="640" y2="155" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="290" y1="248" x2="360" y2="248" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="325" y="285" font-size="23" fill="#1D1D1F" text-anchor="middle">späteres Write-Back: AA überschreibt 55</text>
<text x="500" y="346" font-size="23" fill="#1D1D1F" text-anchor="middle">Vorbereiten und nach Empfang synchronisieren: Plattformregel</text>
</svg>
