<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="342" viewBox="0 0 1000 342" role="img" aria-labelledby="title">
<title id="title">Sichtbarkeit, DMA-Erreichbarkeit und Besitz getrennt prüfen</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="342" fill="#FFFFFF"/>
<rect x="20" y="90" width="280" height="120" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="160.0" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Sichtbarkeit</text>
<text x="160.0" y="173.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Kohärenz / Cachepflege</text>
<rect x="360" y="90" width="280" height="120" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Erreichbarkeit</text>
<text x="500.0" y="173.0" font-size="24" fill="#1D1D1F" text-anchor="middle">DMA kann adressieren</text>
<rect x="700" y="90" width="280" height="120" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="840.0" y="143.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Besitz</text>
<text x="840.0" y="173.0" font-size="24" fill="#1D1D1F" text-anchor="middle">keine fremden Zugriffe</text>
<text x="500" y="35" font-size="26" fill="#1D1D1F" text-anchor="middle">Alle drei Bedingungen müssen gleichzeitig gelten</text>
<line x1="160" y1="215" x2="160" y2="267" stroke="#1D1D1F" stroke-width="2"/>
<line x1="500" y1="215" x2="500" y2="267" stroke="#1D1D1F" stroke-width="2"/>
<line x1="840" y1="215" x2="840" y2="267" stroke="#1D1D1F" stroke-width="2"/>
<line x1="160" y1="267" x2="840" y2="267" stroke="#E2001A" stroke-width="3"/>
<text x="500" y="315" font-size="23" fill="#1D1D1F" text-anchor="middle">RAM_UNCACHED ist nur ein Name, keine Hardwarekonfiguration</text>
</svg>
