<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect width="1200" height="400" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="start">Drei Ebenen. Ein Linkername macht Speicher nicht uncached.</text>
<rect x="16" y="56" width="270" height="78" rx="2" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="24" y="76" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">1 Plattform</text>
<text x="24" y="94" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Attribute setzen / PMA, nicht PMP</text>
<rect x="310" y="56" width="270" height="78" rx="2" fill="#fff" stroke="#E65100" stroke-width="1.6"/>
<text x="318" y="76" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">2 Linker</text>
<text x="318" y="94" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Puffer platzieren / .dma_buffer</text>
<rect x="610" y="56" width="270" height="78" rx="2" fill="#fff" stroke="#1B5E20" stroke-width="1.6"/>
<text x="618" y="76" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">3 Anwendung</text>
<text x="618" y="94" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Adresse uebergeben / DMA-erreichbar</text>
<text x="16" y="170" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Fiktive Karte: 246 KiB ab 0x20000000, 10 KiB ab 0x2003D800, Ende exklusiv 0x20040000.</text>
<rect x="16" y="190" width="760" height="28" rx="2" fill="#E8EEF2" stroke="#5F6368" stroke-width="1.6"/>
<rect x="16" y="190" width="620" height="28" rx="2" fill="#D6E6F5" stroke="#1565C0" stroke-width="1"/>
<rect x="636" y="190" width="140" height="28" rx="2" fill="#F8E0CC" stroke="#E65100" stroke-width="1"/>
<text x="24" y="210" font-size="13" font-weight="600" fill="#1565C0" text-anchor="start">0x20000000  gewoehnlich</text>
<text x="646" y="210" font-size="13" font-weight="600" fill="#E65100" text-anchor="start">DMA-Zone</text>
<text x="16" y="250" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Uncached nur, wenn die Plattform das fuer 0x2003D800 wirklich konfiguriert.</text>
<text x="16" y="280" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">PMP</text>
<text x="220" y="280" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Zugriffsrechte</text>
<text x="16" y="308" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">PMA / Plattform</text>
<text x="220" y="308" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">unter anderem Cacheability</text>
<text x="16" y="336" font-size="16" font-weight="600" fill="#5F6368" text-anchor="start">Linker</text>
<text x="220" y="336" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">nur Platzierung</text>
<text x="16" y="376" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Uncached heisst weder automatisch DMA-erreichbar noch automatisch geordnet.</text>
</svg>
