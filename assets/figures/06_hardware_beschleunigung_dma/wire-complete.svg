<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title">
<title id="title">DMA-Abschluss vor FIFO-Leerung und Ende des letzten UART-Rahmens</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="360" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">UART-Modell · T = Rahmendauer · letztes Byte B steht an</text>
<text x="20" y="115" font-size="24" fill="#1D1D1F" text-anchor="start">DMA-Auftrag</text>
<line x1="180" y1="115" x2="310" y2="115" stroke="#E2001A" stroke-width="3"/>
<text x="310" y="77" font-size="24" fill="#1D1D1F" text-anchor="middle">TC</text>
<line x1="310" y1="85" x2="310" y2="282" stroke="#86868B" stroke-width="2" stroke-dasharray="6 5"/>
<text x="20" y="186" font-size="24" fill="#1D1D1F" text-anchor="start">FIFO: Byte B</text>
<rect x="310" y="155" width="175" height="42" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="397.5" y="184" font-size="23" fill="#1D1D1F" text-anchor="middle">wartet</text>
<text x="20" y="257" font-size="24" fill="#1D1D1F" text-anchor="start">Schieberegister</text>
<rect x="205.0" y="225" width="280" height="42" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="345.0" y="254" font-size="23" fill="#1D1D1F" text-anchor="middle">Rest A</text>
<rect x="485.0" y="225" width="350" height="42" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="660" y="254" font-size="23" fill="#1D1D1F" text-anchor="middle">Byte B</text>
<line x1="835.0" y1="85" x2="835.0" y2="282" stroke="#E2001A" stroke-width="3"/>
<text x="835.0" y="77" font-size="23" fill="#1D1D1F" text-anchor="middle">Leitungsende</text>
<line x1="310" y1="287" x2="940" y2="287" stroke="#86868B" stroke-width="2"/>
<text x="940" y="347" font-size="22" fill="#1D1D1F" text-anchor="end">Zeit nach DMA-TC →</text>
<line x1="310" y1="282" x2="310" y2="292" stroke="#86868B" stroke-width="2"/>
<text x="310" y="316" font-size="22" fill="#1D1D1F" text-anchor="middle">0</text>
<line x1="485.0" y1="282" x2="485.0" y2="292" stroke="#86868B" stroke-width="2"/>
<text x="485.0" y="316" font-size="22" fill="#1D1D1F" text-anchor="middle">0,5 T</text>
<line x1="835.0" y1="282" x2="835.0" y2="292" stroke="#86868B" stroke-width="2"/>
<text x="835.0" y="316" font-size="22" fill="#1D1D1F" text-anchor="middle">1,5 T</text>
</svg>
