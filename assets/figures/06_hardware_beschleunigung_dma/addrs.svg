<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
<rect width="1200" height="460" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">M2P, fiktiv: 8 Bit, COUNT 16, SRC ab 0x20001000, DST fest 0x4003000C.</text>
<text x="16" y="52" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">n</text>
<text x="80" y="52" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">SRC</text>
<text x="280" y="52" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">DST</text>
<text x="520" y="52" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Rest</text>
<text x="16" y="78" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">1</text>
<text x="80" y="78" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">0x20001000</text>
<text x="280" y="78" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">0x4003000C</text>
<text x="520" y="78" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">15</text>
<text x="16" y="106" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">2</text>
<text x="80" y="106" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">0x20001001</text>
<text x="280" y="106" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">0x4003000C</text>
<text x="520" y="106" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">14</text>
<text x="16" y="134" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">3</text>
<text x="80" y="134" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">0x20001002</text>
<text x="280" y="134" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">0x4003000C</text>
<text x="520" y="134" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">13</text>
<text x="16" y="162" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">4</text>
<text x="80" y="162" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">0x20001003</text>
<text x="280" y="162" font-size="16" font-weight="600" fill="#B71C1C" text-anchor="start">0x4003000C</text>
<text x="520" y="162" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">12</text>
<text x="620" y="78" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">P2M, halfwordfaehig angenommen</text>
<text x="620" y="106" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">ADC 0x40031000, fest</text>
<text x="620" y="134" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">RAM ab 0x20002000, +2</text>
<text x="620" y="162" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">COUNT 8 = 16 Byte</text>
<text x="16" y="210" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Ein 16-Bit-I2C-Wert kann zwei Byte-Transfers sein. C-Typ und erlaubte Breite sind verschieden.</text>
<text x="16" y="242" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">1 000 000 Byte, 8 Bit, COUNT max. 65535: 15 x 65535 + 16975 = 16 Bloecke.</text>
<text x="16" y="274" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">Adressregister in Bytes zaehlen. uint16_t* p; p += width skaliert doppelt.</text>
<text x="16" y="310" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Getrennt: Bus-Alignment, Cacheline-Alignment, DMA-Erreichbarkeit.</text>
<text x="16" y="342" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Ziel-Increment auf MMIO kann Nachbarregister beschreiben.</text>
<text x="16" y="380" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">uint32_t-Cast ist nur eine Adressannahme. uintptr_t macht aus einer CPU-Adresse keine DMA-Adresse.</text>
<text x="16" y="420" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Alle Adressen in dieser Abbildung sind fiktives Lehrmodell.</text>
<text x="16" y="446" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Packing nur, wenn Quelle, Ziel und Controller es dokumentieren.</text>
</svg>
