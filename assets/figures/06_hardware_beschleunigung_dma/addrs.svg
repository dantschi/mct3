<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title">
<title id="title">Byteweises Senden mit inkrementierender Quelle und festem Ziel</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="390" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Senden · Breite 1 Byte · Modelladressen mit 0x-Präfix</text>
<text x="190" y="76" font-size="24" fill="#1D1D1F" text-anchor="middle">Quelle im Speicher</text>
<text x="760" y="76" font-size="24" fill="#1D1D1F" text-anchor="middle">UART-TX-Register fest</text>
<rect x="600" y="155" width="340" height="95" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="770.0" y="195.5" font-size="24" fill="#1D1D1F" text-anchor="middle">0x40010004</text>
<text x="770.0" y="225.5" font-size="24" fill="#1D1D1F" text-anchor="middle">jedes Element hierhin</text>
<rect x="30" y="100" width="320" height="44" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="190" y="130" font-size="24" fill="#1D1D1F" text-anchor="middle">0x20001000</text>
<line x1="350" y1="122" x2="595" y2="175" stroke="#E2001A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="155" width="320" height="44" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="190" y="185" font-size="24" fill="#1D1D1F" text-anchor="middle">0x20001001</text>
<line x1="350" y1="177" x2="595" y2="192" stroke="#E2001A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="210" width="320" height="44" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="190" y="240" font-size="24" fill="#1D1D1F" text-anchor="middle">0x20001002</text>
<line x1="350" y1="232" x2="595" y2="209" stroke="#E2001A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="265" width="320" height="44" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="190" y="295" font-size="24" fill="#1D1D1F" text-anchor="middle">0x20001003</text>
<line x1="350" y1="287" x2="595" y2="226" stroke="#E2001A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="364" font-size="23" fill="#1D1D1F" text-anchor="middle">Quelladresse +1 je Element · Zieladresse +0</text>
</svg>
