<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="315" viewBox="0 0 1000 315" role="img" aria-labelledby="title">
<title id="title">Bildspeicher und erforderliche Nutzdatenrate</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="315" fill="#FFFFFF"/>
<rect x="35" y="65" width="380" height="190" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="225" y="160" font-size="30" fill="#1D1D1F" text-anchor="middle">320 × 240 Pixel</text>
<text x="225" y="210" font-size="24" fill="#1D1D1F" text-anchor="middle">2 Bytes je Pixel</text>
<line x1="435" y1="160" x2="510" y2="160" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="530" y="80" width="440" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="750.0" y="128.0" font-size="24" fill="#1D1D1F" text-anchor="middle">153600 Bytes je Vollbild</text>
<rect x="530" y="200" width="440" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="750.0" y="248.0" font-size="24" fill="#1D1D1F" text-anchor="middle">60 Bilder/s → 9,216 MB/s</text>
<text x="20" y="35" font-size="24" fill="#1D1D1F" text-anchor="start">RGB565: 16 Bit je Pixel · MB = 10⁶ Bytes</text>
<line x1="750" y1="160" x2="750" y2="195" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
