<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
<rect width="1200" height="430" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="18" font-weight="600" fill="#1D1D1F" text-anchor="start">Engpass liegt auf der SPI-Leitung, nicht nur in der CPU.</text>
<text x="16" y="46" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Ein Frame RGB565: 320 x 240 x 2 = 153600 Byte. 60 FPS: 9,216 MB/s = 73,728 Mbit/s.</text>
<rect x="16" y="64" width="170" height="52" rx="2" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="24" y="84" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">Bildpuffer</text>
<text x="24" y="102" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">153600 B</text>
<rect x="210" y="64" width="170" height="52" rx="2" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="218" y="84" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">Speicherbus</text>
<text x="218" y="102" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">geteilt</text>
<rect x="400" y="64" width="170" height="52" rx="2" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="408" y="84" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">DMA oder CPU</text>
<text x="408" y="102" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Nachfuellen</text>
<rect x="610" y="64" width="170" height="52" rx="2" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="618" y="84" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">SPI-TX</text>
<text x="618" y="102" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Register/FIFO</text>
<rect x="820" y="64" width="170" height="52" rx="2" fill="#fff" stroke="#E65100" stroke-width="1.6"/>
<text x="828" y="84" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">Leitung</text>
<text x="828" y="102" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">1 Bit/SCK</text>
<rect x="1010" y="64" width="170" height="52" rx="2" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="1018" y="84" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">Display</text>
<text x="1018" y="102" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Geraet</text>
<line x1="186" y1="90" x2="208" y2="90" stroke="#1D1D1F" stroke-width="2"/>
<line x1="376" y1="90" x2="398" y2="90" stroke="#1D1D1F" stroke-width="2"/>
<line x1="586" y1="90" x2="608" y2="90" stroke="#1D1D1F" stroke-width="2"/>
<line x1="796" y1="90" x2="818" y2="90" stroke="#1D1D1F" stroke-width="2"/>
<line x1="990" y1="90" x2="1012" y2="90" stroke="#1D1D1F" stroke-width="2"/>
<rect x="16" y="150" width="560" height="36" rx="2" fill="#fff" stroke="#B71C1C" stroke-width="1.6"/>
<text x="28" y="174" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Anforderung 60 FPS</text>
<text x="300" y="174" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">9,216 MB/s</text>
<rect x="16" y="194" width="560" height="36" rx="2" fill="#fff" stroke="#E65100" stroke-width="1.6"/>
<text x="28" y="218" font-size="15" font-weight="600" fill="#E65100" text-anchor="start">SPI 10 MHz ideal</text>
<text x="300" y="218" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">1,25 MB/s, etwa 8,14 FPS</text>
<rect x="16" y="238" width="560" height="36" rx="2" fill="#fff" stroke="#1B5E20" stroke-width="1.6"/>
<text x="28" y="262" font-size="15" font-weight="600" fill="#1B5E20" text-anchor="start">SPI 50 MHz ideal</text>
<text x="300" y="262" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">6,25 MB/s, etwa 40,69 FPS</text>
<rect x="16" y="282" width="560" height="36" rx="2" fill="#fff" stroke="#B71C1C" stroke-width="1.6"/>
<text x="28" y="306" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">60 FPS, 1 Bit/SCK</text>
<text x="300" y="306" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">mindestens 73,728 MHz</text>
<rect x="610" y="150" width="560" height="168" rx="2" fill="#fff" stroke="#5F6368" stroke-width="1.6"/>
<text x="624" y="176" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Wenn die Leitung nicht reicht:</text>
<text x="624" y="204" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">geringere Bildrate</text>
<text x="624" y="232" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">Teilupdates statt Vollbild</text>
<text x="624" y="260" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">oder eine breitere Schnittstelle</text>
<text x="624" y="296" font-size="13" font-weight="400" fill="#5F6368" text-anchor="start">Kommandos und Pausen senken den Durchsatz weiter.</text>
<text x="16" y="400" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Audio getrennt: 44100 Samples/s mono, 16 Bit = 88200 Byte/s. Samples allein sind keine Byte-Rate.</text>
<text x="16" y="422" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">DMA kuerzt Nachfuellpausen. Es hebt das SCK-Limit nicht auf. MB hier dezimal.</text>
</svg>
