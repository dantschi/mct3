<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
<rect width="1200" height="460" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="17" font-weight="600" fill="#1D1D1F" text-anchor="start">Dieselbe Leitung, vier CPU-Spuren. 10 MHz SPI: ein Byte ideal 0,8 us.</text>
<text x="16" y="46" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">1 000 000 Byte mindestens 0,8 s reine Leitungszeit. Ausschnitt, nicht massstaeblich.</text>
<text x="16" y="92" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Polling</text>
<rect x="130" y="70" width="900" height="28" rx="2" fill="#fff" stroke="#5F6368" stroke-width="1"/>
<rect x="130" y="72" width="898" height="24" rx="2" fill="#B71C1C" stroke="#B71C1C" stroke-width="0"/>
<text x="134" y="89" font-size="12" font-weight="400" fill="#fff" text-anchor="start">Hauptschleife wartet</text>
<text x="16" y="154" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">IRQ/Byte</text>
<rect x="130" y="132" width="900" height="28" rx="2" fill="#fff" stroke="#5F6368" stroke-width="1"/>
<rect x="130" y="134" width="70" height="24" rx="2" fill="#6A1B9A" stroke="#6A1B9A" stroke-width="0"/>
<rect x="238" y="134" width="160" height="24" rx="2" fill="#1565C0" stroke="#1565C0" stroke-width="0"/>
<text x="242" y="151" font-size="12" font-weight="400" fill="#fff" text-anchor="start">Nutz</text>
<rect x="436" y="134" width="70" height="24" rx="2" fill="#6A1B9A" stroke="#6A1B9A" stroke-width="0"/>
<rect x="544" y="134" width="160" height="24" rx="2" fill="#1565C0" stroke="#1565C0" stroke-width="0"/>
<text x="548" y="151" font-size="12" font-weight="400" fill="#fff" text-anchor="start">Nutz</text>
<rect x="742" y="134" width="70" height="24" rx="2" fill="#6A1B9A" stroke="#6A1B9A" stroke-width="0"/>
<rect x="850" y="134" width="142" height="24" rx="2" fill="#1565C0" stroke="#1565C0" stroke-width="0"/>
<text x="854" y="151" font-size="12" font-weight="400" fill="#fff" text-anchor="start">Nutz</text>
<text x="16" y="216" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">IRQ/16 B</text>
<rect x="130" y="194" width="900" height="28" rx="2" fill="#fff" stroke="#5F6368" stroke-width="1"/>
<rect x="130" y="196" width="88" height="24" rx="2" fill="#6A1B9A" stroke="#6A1B9A" stroke-width="0"/>
<rect x="256" y="196" width="628" height="24" rx="2" fill="#1565C0" stroke="#1565C0" stroke-width="0"/>
<text x="260" y="213" font-size="12" font-weight="400" fill="#fff" text-anchor="start">Nutzarbeit</text>
<rect x="922" y="196" width="88" height="24" rx="2" fill="#6A1B9A" stroke="#6A1B9A" stroke-width="0"/>
<text x="16" y="278" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">DMA</text>
<rect x="130" y="256" width="900" height="28" rx="2" fill="#fff" stroke="#5F6368" stroke-width="1"/>
<rect x="130" y="258" width="106" height="24" rx="2" fill="#E65100" stroke="#E65100" stroke-width="0"/>
<rect x="256" y="258" width="664" height="24" rx="2" fill="#1565C0" stroke="#1565C0" stroke-width="0"/>
<text x="260" y="275" font-size="12" font-weight="400" fill="#fff" text-anchor="start">Main rechnet</text>
<rect x="940" y="258" width="70" height="24" rx="2" fill="#6A1B9A" stroke="#6A1B9A" stroke-width="0"/>
<text x="130" y="330" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">Leitung: Bytes ohne Pause    | Luecke = Software-Nachfuellpause, nur bei IRQ/Polling moeglich</text>
<line x1="130" y1="348" x2="980" y2="348" stroke="#E65100" stroke-width="3"/>
<line x1="430" y1="340" x2="520" y2="340" stroke="#B71C1C" stroke-width="6"/>
<text x="430" y="372" font-size="13" font-weight="600" fill="#B71C1C" text-anchor="start">Pause</text>
<text x="16" y="404" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Modell: 100-MHz-CPU, 100 Zyklen je Byte-IRQ. 1,25 Mio IRQ/s waeren 125 Prozent. Nicht erreichbar.</text>
<text x="16" y="430" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">16 Byte je IRQ: derselbe feste Aufwand etwa 7,81 Prozent. Kopieren kommt dazu. Keine Messung.</text>
<text x="16" y="452" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Polling beschaeftigt die aufrufende Schleife. Aktivierte Interrupts koennen weiterlaufen.</text>
</svg>
