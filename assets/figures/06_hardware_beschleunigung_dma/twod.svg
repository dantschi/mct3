<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect width="1200" height="400" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">RGB565, 320 Pixel, Pitch 640 Byte. Rechteck 4 x 3 bei x=10, y=20.</text>
<rect x="16" y="48" width="420" height="200" rx="2" fill="#fff" stroke="#5F6368" stroke-width="1.6"/>
<rect x="96" y="118" width="70" height="52" rx="2" fill="#F8E0CC" stroke="#E65100" stroke-width="1.6"/>
<text x="24" y="68" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Framebuffer</text>
<text x="100" y="100" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">4 x 3</text>
<text x="460" y="80" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Basis 0x20001000, fiktiv</text>
<text x="460" y="112" font-size="18" font-weight="600" fill="#E65100" text-anchor="start">Erste Zeile: 0x20004214</text>
<text x="460" y="144" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">8 Byte kopieren, Skip 632 Byte</text>
<text x="460" y="176" font-size="16" font-weight="600" fill="#1565C0" text-anchor="start">Naechster Zeilenstart +640 Byte</text>
<text x="460" y="214" font-size="16" font-weight="600" fill="#1B5E20" text-anchor="start">Dichtes Ziel: Startabstand 8 Byte</text>
<text x="16" y="280" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">Offsetregister koennen Pixel statt Bytes zaehlen. Datenblatt umrechnen.</text>
<text x="16" y="314" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Scatter-Gather: drei Puffer, Deskriptor mit SRC, DST, Count, Next.</text>
<text x="16" y="346" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Deskriptoren brauchen Erreichbarkeit, Alignment, Lebensdauer und ggf. Cache-Pflege.</text>
<text x="16" y="376" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Next = 0 ist kein universeller Stopp. DMA ersetzt kein I2C-START/STOP.</text>
</svg>
