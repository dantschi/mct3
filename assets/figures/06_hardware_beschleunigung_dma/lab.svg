<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect width="1200" height="400" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="17" font-weight="600" fill="#1D1D1F" text-anchor="start">Rechenmodell, keine Renode-Messung. 4096 Byte, 115200 Baud, 8N1.</text>
<text x="16" y="50" font-size="16" font-weight="600" fill="#E65100" text-anchor="start">Ideale Leitungszeit: 4096 x 10 / 115200 = 355,56 ms.</text>
<rect x="16" y="76" width="180" height="52" rx="2" fill="#fff" stroke="#1B5E20" stroke-width="1.6"/>
<text x="24" y="96" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">TX-Puffer</text>
<text x="24" y="114" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">lebt weiter</text>
<rect x="220" y="76" width="180" height="52" rx="2" fill="#fff" stroke="#E65100" stroke-width="1.6"/>
<text x="228" y="96" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">DMAC</text>
<text x="228" y="114" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Request</text>
<rect x="420" y="76" width="180" height="52" rx="2" fill="#fff" stroke="#E65100" stroke-width="1.6"/>
<text x="428" y="96" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">UART</text>
<text x="428" y="114" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">FIFO/Shift</text>
<rect x="640" y="76" width="180" height="52" rx="2" fill="#fff" stroke="#1B5E20" stroke-width="1.6"/>
<text x="648" y="96" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Pruefer</text>
<text x="648" y="114" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Bytestrom</text>
<rect x="860" y="76" width="180" height="52" rx="2" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="868" y="96" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">main</text>
<text x="868" y="114" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Heartbeat</text>
<text x="16" y="170" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">Heartbeat schaltet die LED in main(), etwa alle 10 ms nach Zeitvergleich.</text>
<text x="16" y="198" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Ein Timer darf die Zeitbasis sein. Der Wechsel darf nicht autonom in Hardware oder Timer-ISR liegen.</text>
<text x="16" y="236" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Vergleich nur bei identischen Daten und UART-Einstellungen.</text>
<text x="16" y="264" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Getrennt protokollieren: korrekter Bytestrom, Main-Fortschritt, Heartbeat-Luecken, DMA-TC, Leitung fertig.</text>
<text x="16" y="300" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">PerformanceInMips ist keine MCU-Taktfrequenz. Hostlaufzeit ist keine Transferzeit.</text>
<text x="16" y="334" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Ohne Baud- und Handshake-Modell bleibt der Lauf ein Funktionstest, keine Entlastungsmessung.</text>
<text x="16" y="370" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Im Repository kein DMA-Modell und keine .repl. Diese Adressen bleiben fiktiv.</text>
</svg>
