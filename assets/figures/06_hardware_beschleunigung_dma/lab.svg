<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-labelledby="title">
<title id="title">Abbruch mit bestätigtem Stillstand oder weiterhin gesperrtem Puffer</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="365" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Timeout oder Fehler ist kein Beweis für ruhende Speicherzugriffe</text>
<rect x="20" y="100" width="220" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="130.0" y="150.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Stopp anfordern</text>
<rect x="360" y="100" width="260" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="490.0" y="135.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Begrenzt warten</text>
<text x="490.0" y="165.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Status prüfen</text>
<rect x="760" y="100" width="220" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="870.0" y="135.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Ruhe bestätigt</text>
<text x="870.0" y="165.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Puffer zurück</text>
<line x1="240" y1="142" x2="355" y2="142" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="620" y1="142" x2="755" y2="142" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="695" y="116" font-size="22" fill="#1D1D1F" text-anchor="middle">ja</text>
<line x1="490" y1="185" x2="490" y2="245" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="330" y="255" width="320" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="490.0" y="285.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Nicht bestätigt:</text>
<text x="490.0" y="315.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Puffer bleibt gesperrt</text>
<text x="670" y="231" font-size="23" fill="#1D1D1F" text-anchor="middle">Frist abgelaufen</text>
</svg>
