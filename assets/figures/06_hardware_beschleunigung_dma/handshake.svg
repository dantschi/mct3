<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title">
<title id="title">Lokaler DMA-Request und Datenzugriff sind getrennte Vorgänge</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="340" fill="#FFFFFF"/>
<rect x="20" y="115" width="260" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="150.0" y="158.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Peripherie</text>
<text x="150.0" y="188.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Register/FIFO bereit</text>
<rect x="410" y="115" width="255" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="537.5" y="158.0" font-size="24" fill="#1D1D1F" text-anchor="middle">DMA-Controller</text>
<text x="537.5" y="188.0" font-size="24" fill="#1D1D1F" text-anchor="middle">bewegt ein Element</text>
<rect x="780" y="115" width="200" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="880.0" y="173.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Speicher</text>
<line x1="280" y1="140" x2="405" y2="140" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="340" y="116" font-size="22" fill="#1D1D1F" text-anchor="middle">Request</text>
<line x1="410" y1="193" x2="285" y2="193" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="340" y="242" font-size="22" fill="#1D1D1F" text-anchor="middle">Datenzugriff</text>
<line x1="780" y1="165" x2="670" y2="165" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="35" font-size="24" fill="#1D1D1F" text-anchor="start">Lokale Bereitschaft ist kein externes Protokoll-ACK</text>
<text x="500" y="313" font-size="23" fill="#1D1D1F" text-anchor="middle">FIFO: First In, First Out · ACK: Acknowledge</text>
</svg>
