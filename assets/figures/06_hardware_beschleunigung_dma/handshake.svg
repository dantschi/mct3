<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<rect width="1200" height="400" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Speicher-Burst und Peripherie-Transfer sind zwei Breiten. DREQ/DACK sind Lehrnamen.</text>
<rect x="16" y="50" width="190" height="52" rx="2" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="24" y="70" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">RAM-Burst</text>
<text x="24" y="88" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">mehrere Bytes</text>
<rect x="230" y="50" width="190" height="52" rx="2" fill="#fff" stroke="#E65100" stroke-width="1.6"/>
<text x="238" y="70" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">DMAC-FIFO</text>
<text x="238" y="88" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">wenn vorhanden</text>
<rect x="450" y="50" width="190" height="52" rx="2" fill="#fff" stroke="#6A1B9A" stroke-width="1.6"/>
<text x="458" y="70" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">ein Zugriff</text>
<text x="458" y="88" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">nur wenn bereit</text>
<rect x="680" y="50" width="190" height="52" rx="2" fill="#fff" stroke="#1B5E20" stroke-width="1.6"/>
<text x="688" y="70" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">UART/SPI-FIFO</text>
<text x="688" y="88" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">wenn vorhanden</text>
<rect x="920" y="50" width="190" height="52" rx="2" fill="#fff" stroke="#B71C1C" stroke-width="1.6"/>
<text x="928" y="70" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Schiebereg.</text>
<text x="928" y="88" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Leitung</text>
<line x1="206" y1="76" x2="228" y2="76" stroke="#1D1D1F" stroke-width="2"/>
<line x1="426" y1="76" x2="448" y2="76" stroke="#1D1D1F" stroke-width="2"/>
<line x1="656" y1="76" x2="678" y2="76" stroke="#1D1D1F" stroke-width="2"/>
<line x1="896" y1="76" x2="918" y2="76" stroke="#1D1D1F" stroke-width="2"/>
<text x="16" y="140" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">Request</text>
<text x="16" y="180" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">Zugriff</text>
<text x="16" y="220" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">FIFO</text>
<line x1="120" y1="150" x2="160" y2="150" stroke="#6A1B9A" stroke-width="3"/>
<line x1="140" y1="128" x2="140" y2="150" stroke="#6A1B9A" stroke-width="2"/>
<rect x="128" y="164" width="24" height="16" rx="2" fill="#E65100" stroke="#E65100" stroke-width="0"/>
<line x1="280" y1="150" x2="320" y2="150" stroke="#6A1B9A" stroke-width="3"/>
<line x1="300" y1="128" x2="300" y2="150" stroke="#6A1B9A" stroke-width="2"/>
<rect x="288" y="164" width="24" height="16" rx="2" fill="#E65100" stroke="#E65100" stroke-width="0"/>
<line x1="440" y1="150" x2="480" y2="150" stroke="#6A1B9A" stroke-width="3"/>
<line x1="460" y1="128" x2="460" y2="150" stroke="#6A1B9A" stroke-width="2"/>
<rect x="448" y="164" width="24" height="16" rx="2" fill="#E65100" stroke="#E65100" stroke-width="0"/>
<line x1="600" y1="150" x2="640" y2="150" stroke="#6A1B9A" stroke-width="3"/>
<line x1="620" y1="128" x2="620" y2="150" stroke="#6A1B9A" stroke-width="2"/>
<rect x="608" y="164" width="24" height="16" rx="2" fill="#E65100" stroke="#E65100" stroke-width="0"/>
<line x1="760" y1="150" x2="800" y2="150" stroke="#6A1B9A" stroke-width="3"/>
<line x1="780" y1="128" x2="780" y2="150" stroke="#6A1B9A" stroke-width="2"/>
<text x="120" y="250" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Ein Request erlaubt nicht 16 Words in ein Ein-Byte-TX-Register.</text>
<text x="16" y="290" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">M2P: RAM -> Peripherie.   P2M: Peripherie -> RAM.   M2M: RAM -> RAM.</text>
<text x="16" y="322" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">P2M verhindert einen Overrun nicht, wenn der Pfad langsamer ist als die Quelle.</text>
<text x="16" y="354" font-size="15" font-weight="400" fill="#5F6368" text-anchor="start">M2M ist kein allgemeines memmove fuer Ueberlappung. DACK ist kein I2C-ACK.</text>
<text x="16" y="386" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Die zwei FIFOs nur zeichnen, wenn das konkrete Modell sie hat.</text>
</svg>
