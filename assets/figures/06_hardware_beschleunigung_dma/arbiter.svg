<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" role="img" aria-labelledby="title">
<title id="title">CPU und DMA konkurrieren am gemeinsamen Speicherpfad</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="392" fill="#FFFFFF"/>
<rect x="20" y="55" width="235" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="137.5" y="88.0" font-size="24" fill="#1D1D1F" text-anchor="middle">CPU</text>
<text x="137.5" y="118.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Zugriff mit Cache-Miss</text>
<rect x="20" y="235" width="235" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="137.5" y="268.0" font-size="24" fill="#1D1D1F" text-anchor="middle">DMA</text>
<text x="137.5" y="298.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Speicherzugriff</text>
<rect x="385" y="145" width="210" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="490.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Arbiter</text>
<text x="490.0" y="208.0" font-size="24" fill="#1D1D1F" text-anchor="middle">teilt Zugriffe zu</text>
<rect x="750" y="145" width="230" height="80" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="865.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Gemeinsamer</text>
<text x="865.0" y="208.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Speicherpfad</text>
<line x1="255" y1="95" x2="380" y2="174" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="255" y1="275" x2="380" y2="196" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="595" y1="185" x2="745" y2="185" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="340" y="35" font-size="23" fill="#1D1D1F" text-anchor="start">Lokaler Cache-Hit: nicht zwangsläufig dieser Pfad</text>
<text x="500" y="365" font-size="23" fill="#1D1D1F" text-anchor="middle">Konkurrenz nur an gemeinsam benutzten Ressourcen</text>
</svg>
