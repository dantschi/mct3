<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect width="1200" height="420" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="17" font-weight="600" fill="#1D1D1F" text-anchor="start">Besitz des Puffers und Abschluss der Leitung sind zwei Zeitachsen.</text>
<rect x="16" y="48" width="180" height="40" rx="2" fill="#fff" stroke="#1B5E20" stroke-width="1.6"/>
<text x="24" y="68" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">CPU fuellt</text>
<rect x="210" y="48" width="180" height="40" rx="2" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="218" y="68" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">veroeffentlicht</text>
<rect x="420" y="48" width="180" height="40" rx="2" fill="#fff" stroke="#E65100" stroke-width="1.6"/>
<text x="428" y="68" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">DMA besitzt</text>
<rect x="630" y="48" width="180" height="40" rx="2" fill="#fff" stroke="#6A1B9A" stroke-width="1.6"/>
<text x="638" y="68" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">DMA-TC</text>
<rect x="820" y="48" width="180" height="40" rx="2" fill="#fff" stroke="#1B5E20" stroke-width="1.6"/>
<text x="828" y="68" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">CPU darf wieder</text>
<line x1="196" y1="68" x2="208" y2="68" stroke="#1D1D1F" stroke-width="2"/>
<line x1="406" y1="68" x2="418" y2="68" stroke="#1D1D1F" stroke-width="2"/>
<line x1="616" y1="68" x2="628" y2="68" stroke="#1D1D1F" stroke-width="2"/>
<line x1="806" y1="68" x2="818" y2="68" stroke="#1D1D1F" stroke-width="2"/>
<text x="16" y="120" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Waehrend DMA besitzt: CPU aendert den aktiven Quellbereich nicht.</text>
<text x="16" y="146" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Ein lokales Array darf nach Rueckkehr der Startfunktion nicht verschwinden.</text>
<text x="16" y="190" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">DMA schreibt letztes Element</text>
<text x="16" y="230" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">DMA-TC</text>
<text x="16" y="270" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">UART/SPI sendet</text>
<text x="16" y="310" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">Leitung fertig</text>
<line x1="180" y1="330" x2="1000" y2="330" stroke="#5F6368" stroke-width="1"/>
<line x1="200" y1="178" x2="200" y2="330" stroke="#E65100" stroke-width="2"/>
<rect x="194" y="172" width="12" height="12" rx="2" fill="#E65100" stroke="#E65100" stroke-width="0"/>
<line x1="360" y1="218" x2="360" y2="330" stroke="#6A1B9A" stroke-width="2"/>
<rect x="354" y="212" width="12" height="12" rx="2" fill="#6A1B9A" stroke="#6A1B9A" stroke-width="0"/>
<line x1="560" y1="258" x2="560" y2="330" stroke="#1565C0" stroke-width="2"/>
<rect x="554" y="252" width="12" height="12" rx="2" fill="#1565C0" stroke="#1565C0" stroke-width="0"/>
<line x1="760" y1="298" x2="760" y2="330" stroke="#1B5E20" stroke-width="2"/>
<rect x="754" y="292" width="12" height="12" rx="2" fill="#1B5E20" stroke="#1B5E20" stroke-width="0"/>
<text x="180" y="360" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Abstand nicht festgelegt. Ohne Controllerdokument keine feste Differenz.</text>
<text x="16" y="390" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Pufferfreigabe, naechster DMA-Start und SPI-CS sind getrennte Entscheidungen.</text>
<text x="16" y="414" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Vor Start: Kanal stoppen, Altstatus, Route, Breite, Count, Cache, IRQ. Kein blindes |=.</text>
</svg>
