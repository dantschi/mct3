<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<rect width="1200" height="420" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="24" font-size="17" font-weight="600" fill="#1D1D1F" text-anchor="start">CPU und DMAC sind Initiatoren. RAM und Peripherieregister sind Ziele.</text>
<rect x="20" y="56" width="150" height="50" rx="2" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="28" y="76" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">CPU</text>
<text x="28" y="94" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Initiator</text>
<rect x="200" y="56" width="150" height="50" rx="2" fill="#fff" stroke="#6A1B9A" stroke-width="1.6"/>
<text x="208" y="76" font-size="14" font-weight="600" fill="#6A1B9A" text-anchor="start">D-Cache</text>
<text x="208" y="94" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">optional</text>
<rect x="390" y="56" width="160" height="50" rx="2" fill="#fff" stroke="#B71C1C" stroke-width="1.6"/>
<text x="398" y="76" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">Interconnect</text>
<text x="398" y="94" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">CPU gegen DMA</text>
<rect x="590" y="56" width="140" height="50" rx="2" fill="#fff" stroke="#1B5E20" stroke-width="1.6"/>
<text x="598" y="76" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">RAM</text>
<text x="598" y="94" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Ziel</text>
<rect x="20" y="140" width="150" height="50" rx="2" fill="#fff" stroke="#E65100" stroke-width="1.6"/>
<text x="28" y="160" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">DMAC</text>
<text x="28" y="178" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">Initiator</text>
<rect x="200" y="140" width="160" height="50" rx="2" fill="#fff" stroke="#E65100" stroke-width="1.6"/>
<text x="208" y="160" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">Kanal-Arbiter</text>
<text x="208" y="178" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">im DMAC</text>
<rect x="390" y="140" width="160" height="50" rx="2" fill="#fff" stroke="#5F6368" stroke-width="1.6"/>
<text x="398" y="160" font-size="14" font-weight="600" fill="#5F6368" text-anchor="start">SPI / UART</text>
<text x="398" y="178" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start">MMIO-Ziel</text>
<line x1="170" y1="80" x2="198" y2="80" stroke="#1565C0" stroke-width="2"/>
<line x1="350" y1="80" x2="388" y2="80" stroke="#1565C0" stroke-width="2"/>
<line x1="550" y1="80" x2="588" y2="80" stroke="#1565C0" stroke-width="2"/>
<line x1="170" y1="164" x2="198" y2="164" stroke="#E65100" stroke-width="2"/>
<line x1="360" y1="164" x2="470" y2="90" stroke="#E65100" stroke-width="2"/>
<text x="16" y="220" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">DMAMUX routet Requests. Kanaele sind Kontexte, nicht automatisch eigene Datenpfade.</text>
<rect x="16" y="240" width="560" height="70" rx="2" fill="#fff" stroke="#1565C0" stroke-width="1.6"/>
<text x="28" y="266" font-size="15" font-weight="600" fill="#1565C0" text-anchor="start">CPU-Arbeit mit Cache-Hits</text>
<text x="28" y="290" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">DMA stoert den Speicherbus seltener.</text>
<rect x="600" y="240" width="560" height="70" rx="2" fill="#fff" stroke="#B71C1C" stroke-width="1.6"/>
<text x="612" y="266" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">CPU-Arbeit mit vielen RAM-Zugriffen</text>
<text x="612" y="290" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Dieselbe DMA-Last verzoegert deutlich staerker.</text>
<text x="16" y="340" font-size="15" font-weight="600" fill="#6A1B9A" text-anchor="start">Round-Robin, angenommen: CPU, DMA, CPU, DMA. Feste Prioritaet: DMA, DMA, CPU.</text>
<text x="16" y="368" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">Nicht: DMA gewinnt immer. Nicht: Stalls sind immer kurz.</text>
<text x="16" y="400" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Setup, Cache-Wartung und Abschluss kosten Zeit. Bei kleinen Kopien kann die CPU guenstiger sein.</text>
</svg>
