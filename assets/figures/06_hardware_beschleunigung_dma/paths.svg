<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-labelledby="title">
<title id="title">Daten durch CPU-Register oder einen DMA-Initiator</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="365" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">CPU-Kopieren</text>
<rect x="20" y="55" width="235" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="137.5" y="100.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Speicher</text>
<rect x="385" y="55" width="235" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="502.5" y="100.5" font-size="24" fill="#1D1D1F" text-anchor="middle">CPU-Register</text>
<rect x="750" y="55" width="230" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="865.0" y="100.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Peripherie</text>
<line x1="255" y1="92" x2="380" y2="92" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="620" y1="92" x2="745" y2="92" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="183" font-size="24" fill="#1D1D1F" text-anchor="start">DMA-Kopieren</text>
<rect x="20" y="210" width="235" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="137.5" y="255.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Speicher</text>
<rect x="385" y="210" width="235" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="502.5" y="255.5" font-size="24" fill="#1D1D1F" text-anchor="middle">DMA-Initiator</text>
<rect x="750" y="210" width="230" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="865.0" y="255.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Peripherie</text>
<line x1="255" y1="247" x2="380" y2="247" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="620" y1="247" x2="745" y2="247" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="340" font-size="23" fill="#1D1D1F" text-anchor="middle">Beide Wege beanspruchen Speicher- und Busressourcen</text>
</svg>
