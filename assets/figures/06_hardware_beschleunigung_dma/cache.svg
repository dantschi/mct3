<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="333" viewBox="0 0 1000 333" role="img" aria-labelledby="title">
<title id="title">Neue CPU-Cachewerte sind ohne Veröffentlichung nicht DMA-sichtbar</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="333" fill="#FFFFFF"/>
<text x="20" y="35" font-size="24" fill="#1D1D1F" text-anchor="start">Nicht kohärentes Write-Back-Modell · Werte als Hexbytes</text>
<rect x="20" y="90" width="270" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="155.0" y="135.5" font-size="24" fill="#1D1D1F" text-anchor="middle">CPU-Cache</text>
<rect x="365" y="90" width="270" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="135.5" font-size="24" fill="#1D1D1F" text-anchor="middle">Speicher</text>
<rect x="710" y="90" width="270" height="75" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="845.0" y="135.5" font-size="24" fill="#1D1D1F" text-anchor="middle">DMA liest</text>
<text x="155" y="210" font-size="30" fill="#E2001A" text-anchor="middle">22 · Dirty</text>
<text x="500" y="210" font-size="30" fill="#1D1D1F" text-anchor="middle">11 · alt</text>
<text x="845" y="210" font-size="30" fill="#1D1D1F" text-anchor="middle">11 · alt</text>
<line x1="635" y1="199" x2="705" y2="199" stroke="#1D1D1F" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="290" y1="245" x2="360" y2="245" stroke="#E2001A" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="500" y="303" font-size="24" fill="#1D1D1F" text-anchor="middle">Erst Clean veröffentlicht 22 in den Speicher</text>
</svg>
