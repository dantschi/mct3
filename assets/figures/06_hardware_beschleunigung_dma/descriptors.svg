<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="335" viewBox="0 0 1000 335" role="img" aria-labelledby="title">
<title id="title">Eine unterstützte Deskriptorkette verbindet mehrere Transferaufträge</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="335" fill="#FFFFFF"/>
<text x="20" y="35" font-size="24" fill="#1D1D1F" text-anchor="start">Deskriptormodell: SRC · DST · COUNT · NEXT</text>
<rect x="20" y="100" width="260" height="140" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="150.0" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Auftrag 1</text>
<text x="150.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Quelle / Ziel / Anzahl</text>
<text x="150.0" y="208.0" font-size="24" fill="#1D1D1F" text-anchor="middle">NEXT → Folge</text>
<line x1="280" y1="170" x2="365" y2="170" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="370" y="100" width="260" height="140" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="500.0" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Auftrag 2</text>
<text x="500.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Quelle / Ziel / Anzahl</text>
<text x="500.0" y="208.0" font-size="24" fill="#1D1D1F" text-anchor="middle">NEXT → Folge</text>
<line x1="630" y1="170" x2="715" y2="170" stroke="#E2001A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="720" y="100" width="260" height="140" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="850.0" y="148.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Auftrag 3</text>
<text x="850.0" y="178.0" font-size="24" fill="#1D1D1F" text-anchor="middle">Quelle / Ziel / Anzahl</text>
<text x="850.0" y="208.0" font-size="24" fill="#1D1D1F" text-anchor="middle">NEXT → Ende</text>
<text x="500" y="307" font-size="23" fill="#1D1D1F" text-anchor="middle">DMA muss diese Struktur und das definierte Kettenende unterstützen</text>
</svg>
