<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="377" viewBox="0 0 1000 377" role="img" aria-labelledby="title">
<title id="title">DMA liest und CPU füllt abwechselnd unterschiedliche Pufferhälften</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="377" fill="#FFFFFF"/>
<text x="20" y="30" font-size="24" fill="#1D1D1F" text-anchor="start">Audio-TX-Modell · Rollenwechsel nach einer Halbzeit</text>
<text x="20" y="103" font-size="23" fill="#1D1D1F" text-anchor="start">1. Halbzeit</text>
<rect x="210" y="75" width="320" height="85" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="370" y="110" font-size="26" fill="#1D1D1F" text-anchor="middle">DMA liest A</text>
<text x="370" y="140" font-size="22" fill="#1D1D1F" text-anchor="middle">CPU verändert nicht</text>
<rect x="630" y="75" width="320" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="790" y="110" font-size="26" fill="#1D1D1F" text-anchor="middle">CPU füllt B</text>
<text x="790" y="140" font-size="22" fill="#1D1D1F" text-anchor="middle">danach synchronisieren</text>
<text x="20" y="228" font-size="23" fill="#1D1D1F" text-anchor="start">2. Halbzeit</text>
<rect x="210" y="200" width="320" height="85" rx="8" fill="#F5F5F7" stroke="#E2001A"/>
<text x="370" y="235" font-size="26" fill="#1D1D1F" text-anchor="middle">DMA liest B</text>
<text x="370" y="265" font-size="22" fill="#1D1D1F" text-anchor="middle">CPU verändert nicht</text>
<rect x="630" y="200" width="320" height="85" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
<text x="790" y="235" font-size="26" fill="#1D1D1F" text-anchor="middle">CPU füllt A</text>
<text x="790" y="265" font-size="22" fill="#1D1D1F" text-anchor="middle">danach synchronisieren</text>
<text x="500" y="348" font-size="23" fill="#1D1D1F" text-anchor="middle">Vor Wiedereintritt des DMA müssen Inhalt und Sichtbarkeit fertig sein</text>
</svg>
