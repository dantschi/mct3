<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
<rect width="1200" height="430" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D1D1F}</style>
<text x="16" y="22" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">44100 Hz, mono, 16 Bit: 88200 Byte/s. Puffer 4096 B, Haelften 2048 B = 1024 Samples.</text>
<text x="16" y="46" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">16-Bit-COUNT 2048. HT nach 1024 Elementen. Eine Haelfte ideal etwa 23,22 ms, Runde 46,44 ms.</text>
<text x="16" y="78" font-size="14" font-weight="600" fill="#E65100" text-anchor="start">DMA</text>
<rect x="120" y="58" width="300" height="26" rx="2" fill="#E65100" stroke="#E65100" stroke-width="0"/>
<text x="230" y="76" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">A</text>
<rect x="420" y="58" width="300" height="26" rx="2" fill="#6A1B9A" stroke="#6A1B9A" stroke-width="0"/>
<text x="540" y="76" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">B</text>
<rect x="720" y="58" width="300" height="26" rx="2" fill="#E65100" stroke="#E65100" stroke-width="0"/>
<text x="860" y="76" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">A</text>
<text x="16" y="130" font-size="14" font-weight="600" fill="#1565C0" text-anchor="start">CPU</text>
<rect x="420" y="110" width="300" height="26" rx="2" fill="#E5F2E6" stroke="#1B5E20" stroke-width="1.6"/>
<text x="500" y="128" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">bearbeitet A</text>
<rect x="720" y="110" width="300" height="26" rx="2" fill="#E5F2E6" stroke="#1B5E20" stroke-width="1.6"/>
<text x="800" y="128" font-size="14" font-weight="600" fill="#1B5E20" text-anchor="start">bearbeitet B</text>
<text x="250" y="168" font-size="13" font-weight="700" fill="#6A1B9A" text-anchor="middle">HT</text>
<text x="560" y="168" font-size="13" font-weight="700" fill="#6A1B9A" text-anchor="middle">TC</text>
<line x1="420" y1="58" x2="420" y2="150" stroke="#6A1B9A" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="720" y1="58" x2="720" y2="150" stroke="#6A1B9A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="16" y="210" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Beide Haelften vor dem Start vorbereiten. Danach nur die freigegebene Haelfte anfassen.</text>
<text x="16" y="240" font-size="14" font-weight="600" fill="#B71C1C" text-anchor="start">IRQ-Verzoegerung + Nachfuellen + Veroeffentlichen + Reserve &lt; Fenster vor der naechsten Nutzung.</text>
<text x="16" y="270" font-size="15" font-weight="600" fill="#B71C1C" text-anchor="start">30 ms Nachfuellzeit ueberschreitet die idealen 23,22 ms. TX: Underrun. RX: Overrun.</text>
<text x="16" y="304" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">ISR: Status lesen, Quelle quittieren, Arbeit signalisieren. Nachfuellen ausserhalb, wenn das Budget traegt.</text>
<text x="16" y="336" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Zwei boolesche Flags zaehlen keine beliebig vielen Runden. Bei unklarem Besitz neu synchronisieren.</text>
<text x="16" y="368" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Etwa 43,07 HT-/TC-Ereignisse je Sekunde. Wrap nur, wenn der Controller ihn neu laedt.</text>
<text x="16" y="400" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start">Linearer Ring mit HT/TC und Hardware-Doppelpuffer sind verschiedene Implementierungen.</text>
</svg>
