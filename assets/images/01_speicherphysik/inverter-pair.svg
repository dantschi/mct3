<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title">
<title id="title">Zwei kreuzgekoppelte Inverter mit getrennten Knoten</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="350" fill="#FFFFFF"/>
<rect x="200" y="110" width="100" height="70" rx="0" fill="#FFFFFF" stroke="#E5E5EA"/>
<text x="250" y="155" font-size="28" fill="#1D1D1F" text-anchor="middle">1</text>
<circle cx="306" cy="145" r="6" fill="#FFFFFF" stroke="#86868B" stroke-width="2"/>
<rect x="640" y="110" width="100" height="70" rx="0" fill="#FFFFFF" stroke="#E5E5EA"/>
<text x="690" y="155" font-size="28" fill="#1D1D1F" text-anchor="middle">1</text>
<circle cx="746" cy="145" r="6" fill="#FFFFFF" stroke="#86868B" stroke-width="2"/>
<line x1="312" y1="145" x2="640" y2="145" stroke="#86868B" stroke-width="2"/>
<line x1="752" y1="145" x2="815" y2="145" stroke="#86868B" stroke-width="2"/>
<polyline points="815.000,145.000 815.000,65.000 150.000,65.000 150.000,145.000 200.000,145.000" fill="none" stroke="#86868B" stroke-width="3"/>
<text x="410" y="130" font-size="26" fill="#1D1D1F" text-anchor="start">Q</text>
<text x="810" y="130" font-size="26" fill="#1D1D1F" text-anchor="start">QB</text>
<text x="500" y="315" font-size="27" fill="#1D1D1F" text-anchor="middle">Stabil: Q / QB = 0 / 1 oder 1 / 0</text>
</svg>
