<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="295" viewBox="0 0 1000 295" role="img" aria-labelledby="title">
<title id="title">IEC-Inverter und Wahrheitstabelle</title>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;font-weight:400}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="#1D1D1F"/></marker></defs>
<rect width="1000" height="295" fill="#FFFFFF"/>
<rect x="230" y="90" width="100" height="70" rx="0" fill="#FFFFFF" stroke="#E5E5EA"/>
<text x="280" y="135" font-size="28" fill="#1D1D1F" text-anchor="middle">1</text>
<circle cx="336" cy="125" r="6" fill="#FFFFFF" stroke="#86868B" stroke-width="2"/>
<line x1="80" y1="125" x2="230" y2="125" stroke="#86868B" stroke-width="2"/>
<line x1="342" y1="125" x2="490" y2="125" stroke="#86868B" stroke-width="2"/>
<text x="80" y="105" font-size="25" fill="#1D1D1F" text-anchor="start">A</text>
<text x="490" y="105" font-size="25" fill="#1D1D1F" text-anchor="start">Y</text>
<text x="750" y="55" font-size="26" fill="#1D1D1F" text-anchor="middle">A      Y</text>
<text x="750" y="120" font-size="28" fill="#1D1D1F" text-anchor="middle">0      1</text>
<text x="750" y="180" font-size="28" fill="#1D1D1F" text-anchor="middle">1      0</text>
<text x="500" y="260" font-size="25" fill="#1D1D1F" text-anchor="middle">Y = logische Negation von A</text>
</svg>
